    summary: "מה שהעולם נראה כמציאות נפרדת – הוא מפני הסתר פנים. הקליפה והסטרא אחרא מקבלים חיות מן הקדושה כביכול 'בגלות', ולכן הם מרגישים את עצמם כיש נפרד ונקראים 'אלוהים אחרים' – כמו עבד שמרד באדונו.",
    stories: [
      { t: "יושב בשמים ישחק", d: "ר' יצחק אהרן גאָלדין, ששימש את אדמו\"ר הריי\"צ בחליו בחורף תרפ\"א, רשם שהרבי סיפר פעם: אביו, אדמו\"ר הרש\"ב, שלח אותו לדבר עם אחד מגדולי המלשינים. הלה נכנס עמו לחדר והתחיל לדבר שהוא יהרוס ויעשה כלה, ועוד דברים כאלה, ועל כל דבר שאמר ענה לו הרבי: 'הוא צוחק'. האיש התרגז וצעק עוד יותר, והרבי חזר ואמר: 'הוא צוחק'. הלה לא יכול היה להתאפק עוד ושאל: מי צוחק? ענה הרבי: 'יושב בשמים ישחק'. הרים האיש את ידו וסטר לרבי. אמר לו הרבי: זה יעלה לך ביוקר. ולבסוף נלקחה ממנו היד. לקח: הרשע מרגיש את עצמו כבעל כח עצמאי, כעבד המורד באדונו; אבל אין לו שום חיות אלא ממה שה' מחיה אותו בהסתר, ולכן מי שרואה זאת אינו מתפעל מאיומיו – לגבי ה' כל גאוותו אינה אלא דבר שצוחקים עליו.", s: "ספר השיחות תרפ\"א, חורף תרפ\"א (מרשימת ר' יצחק אהרן גאָלדין), סעיף טו (ספר השיחות תר\"פ–תרפ\"ז, עמ' 22)", u: "https://pnimi.org/page/4301580103" }
    ]
  },
  23: {
    title: "פרק כ\"ג",
    summary: "התורה והמצוות הן רצונו וחכמתו של הקב\"ה, מיוחדים עמו בתכלית. כשאדם לומד ומקיים, נפשו ואבריו נעשים 'מרכבה' לרצון ה' ומתאחדים עמו; ובשעת העסק בתורה – נפשו ולבושיה, מחשבתו ודיבורו, מיוחדים בה' בתכלית היחוד, ולא מרכבה בלבד; ולכן גדלה מעלת תלמוד תורה יותר מכל המצוות, ואפילו מתפילה.",
    stories: [
      { t: "השנים הטובות במצרים", d: "כשהיה הצמח צדק ילד ולמד את הפסוק 'ויחי יעקב בארץ מצרים שבע עשרה שנה', תרגם לו מלמדו – על פי פירוש בעל הטורים – שיעקב אבינו חי את שבע עשרה שנותיו הטובות ביותר במצרים. כשבא הביתה מן החדר שאל את סבו, אדמו\"ר הזקן: היתכן שיעקב אבינו, בחיר האבות, יהיו מבחר שנות חייו שבע עשרה השנים שגר בארץ מצרים, ערוות הארץ? ענה לו אדמו\"ר הזקן: כתוב 'ואת יהודה שלח לפניו אל יוסף להורות לפניו גשנה', ואיתא במדרש – מובא ברש\"י – אמר רבי נחמיה: להתקין לו בית תלמוד, שתהא שם תורה ושיהיו השבטים הוגים בתורה. כשלומדים תורה – נעשים קרובים יותר אל הקב\"ה, ולכן גם במצרים היה 'ויחי' – חיים. לקח: התורה היא חכמתו ורצונו של ה', והלומד אותה מתאחד עמו; לכן בכל מקום שיש תורה – אפילו במצרים, ערוות הארץ – יש קרבת ה' וחיים אמיתיים.", s: "היום יום, י\"ח טבת", u: "https://pnimi.org/page/3701350247" },
      { t: "אויר גן עדן", d: "בתחילת אדר תער\"ב נסע אדמו\"ר הריי\"צ לרגל עניני הכלל אל אביו, אדמו\"ר הרש\"ב, במנטון, ונשאר שם עד אחרי פורים. שהה שם אז החסיד הרה\"ג ר' יעקב מרדכי מפולטאווא, ולפורים באו כמה מאנ\"ש, ובראשם החסיד ר' שמואל גורארי' מקרמנצ'וג. בסעודת פורים היתה התוועדות גדולה. אדמו\"ר הרש\"ב ביאר שהלומדים חסידות בעיון יכולים להגיע להשגות העמוקות ביותר במוחש ממש, ותוכן השיחה היה שכל אחד יכול לומר 'מתי יגיעו מעשי למעשי אבותי', וכל יהודי יכול להגיע להיות מרכבה לאלוקות כמו האבות. אמר: כשמעמיקים בהעמקת הדעת בהשגה של ענין בחסידות – מרגישים את אויר גן עדן. שנים עמלתי שלא לרמות את עצמי, את כוחותיי נתתי להשגה בעבודה של חסידות, והטעם של חסידות אפף אותי; איני מחזיק לעצמי טובה על כך – זו מתנה. הכל יודעים כמה מאוס ענין ההגזמה, ובכל זאת אני אומר גלוי לעין כל: ה' עוזר ומזכה להעמיק בהעמקת הדעת בהשגה עיונית של ענין בחסידות – ומרגישים את אויר גן עדן. וכשכח השכל המלובש במוח הגשמי מתעמק ומקיף ענין אלוקי, לא זו בלבד שהאדם החושב מתעלה על ידי המחשבה, אלא הענין שבו הוא חושב מתעלה, והענין עצמו מעלה את האדם החושב אל המקום שאליו העלהו בעבודת המוח. לקח: בשעת העסק בתורה השכל של האדם והחכמה שהוא משיג מתאחדים יחוד גמור – לא רק שהוא עולה, אלא שהוא והענין נעשים אחד, ובכך מתאחד הוא עם ה'.", s: "ספר השיחות תר\"ץ, שמחת תורה תר\"ץ, סעיף יט (ספר השיחות תרפ\"ח–תרצ\"א, עמ' 102–103)", u: "https://pnimi.org/page/4301600289" }
    ]
  },
  24: {
    title: "פרק כ\"ד",
    summary: "העובר על רצון ה' – אפילו בעבירה קלה – נפרד ממנו באותה שעה יותר מן הסטרא אחרא עצמה, ודומה כעובד עבודה זרה. רק משום שבשעת החטא 'רוח שטות' מכסה על האהבה המסותרת, האדם אינו מרגיש זאת.",
    stories: [
      { t: "זיעה ודמעות", d: "אדמו\"ר הריי\"צ סיפר (בליל שבת פרשת לך לך תש\"ו): בשנת תרנ\"ב, בחתונת ר' משה הארענשטיין, התוועד אביו, אדמו\"ר הרש\"ב, ואמר: מי שלומד חסידות ואינו עושה בעבודה – עונשו כמו של מי שלוקח את ראשו של המלך ומכופף אותו, כמו שכתוב בתניא; למלקות שיתנו לו – בסוף מתרגלים, אבל החרפה שבדבר! היו שם אז פתחי' חאַרסאָנער וישעי' חאַרסאָנער. פתחי' נתבטל, וישעי' עמד, וזיעה ודמעות נשפכו ממנו. אמר הדוד רז\"א: הוא נעשה בטל לפני האמת – לפני האמת שבנפש. לקח: מי שיודע אלוקות ואינו עושה כפי ידיעתו, מוריד כביכול את ראשו של המלך אל המקום השפל ביותר; וכשמרגישים זאת באמת, אין זה עונש רחוק אלא חרפה שמרעידה את האדם עד זיעה ודמעות.", s: "ספר השיחות תש\"ו, ליל ש\"ק פרשת לך לך תש\"ו בסעודה, סעיף ב (ספר השיחות תש\"ו–ה'שי\"ת, עמ' 12)", u: "https://pnimi.org/page/4301620170" }
    ]
  },
  25: {
    title: "פרק כ\"ה",
    summary: "כשם שכל יהודי היה מוסר נפשו שלא לכפור בה' אחד, כך עליו לעמוד גם בכל ניסיון קל של עבירה, שהרי כל עבירה מפרידה מה'. ובכל מצוה מתאחד האדם עם ה' יחוד נצחי, שאינו תלוי בזמן.",
    stories: [
      { t: "עולם אחד ואלוהים רבים", d: "בקיץ תר\"פ, בשנת האבלות על אביו, נקרא אדמו\"ר הריי\"צ בעת התפילה אל הצ'קה ברוסטוב. הוא סירב להפסיק עד שסיים את התפילה ואת המשניות שאחריה, ורק אז הלך עם השומרים. באולם ישבו כחמישה עשר חברי 'הוועדה לבדיקת הדתות', ולפני כל אחד מונח אקדח. הרבי אמר להם ביידיש שכבר הבהיר בשתי הפעמים הקודמות שלא יזוז מעקרונותיו, ושעדיין לא נולד האדם, וגם לא השד, שיזיזו אותו מהם אפילו כחוט השערה. אחד מהם הרים את אקדחו ואמר: 'הצעצוע הזה מסיר את העקרונות; אימתו פותחת את הפה, וגם אילם נעשה דברן'. ענה הרבי: 'טעות גמורה. הצעצוע הזה עושה רושם רק על חסרי האמונה, מוגי הלב, שאין להם אלא עולם אחד ואלים רבים – כל בעל תאווה יש לו אלוהיו. אבל אנחנו, שיש לנו אלוהים אחד ושני עולמות – הצעצוע שאתה מראה לא רק שאינו מפחיד, הוא אינו עושה שום רושם'. לקח: פרק כה מלמד שהעמידה בניסיון באה מן ההכרה שה' אחד – ומול זה, כל איום של העולם הזה אינו עושה רושם.", s: "אגרות קודש אדמו\"ר הריי\"צ, חלק ח, אגרת ב'קצג, עמ' ס–סב; וראה לקוטי שיחות חלק ג, עמ' 806", u: "https://www.chabad.org/library/article_cdo/aid/84830/jewish/Avoiding-Errors.htm" },
      { t: "אין אדם שיכול למנוע", d: "בליל מאסרו בשנת תרפ\"ז, עוד בביתו, דרש אדמו\"ר הריי\"צ מן הקצין נחמנסון רשות להניח תפילין ולהתפלל, והלה הבטיח לו זאת. כשהובא לשפלרקה, מטה הג.פ.או. בלנינגרד, לא קוימה ההבטחה, והרבי חזר ודרש אותה מן הפקידים. לאחד מהם אמר: 'אני יהודי שומר מצוות, ואני רוצה להניח תפילין ולהתפלל. אין אדם עלי אדמות שיכול למנוע ממני לעבוד את ה''. וכשסירב למלא את השאלון ונשאל על תוארו, השיב: 'אזרח כבוד תורשתי'. הפקידה אמרה שתואר כזה כבר אינו קיים, והוא ענה: 'איני יודע אם הוא קיים כאן או לא – אבל זה התואר שלי'. בסוף הוויכוח עם הפקידים, כך הוא רושם, נשארו התפילין בידיו. לקח: פרק כה מלמד לעמוד בכל ניסיון כאילו היה זה מסירות נפש ממש – כי כל מצוה מאחדת את האדם עם ה' באחדות נצחית.", s: "רשימת המאסר לאדמו\"ר הריי\"צ, בלקוטי דיבורים חלק ד (בתרגום האנגלי: A Prince in Prison, The Imprisonment of 1927, Part II)", u: "https://www.sichos-in-english.org/books/prince-in-prison/05.htm" }
    ]
  },
  26: {
    title: "פרק כ\"ו",
    summary: "כמו שבנצחון על אויב, העצל והכבד מחמת עצבות אינו יכול לנצח, כך הנצחון על היצר צריך זריזות הבאה מן השמחה ומלב פנוי מכל דאגה ועצב. עצבות על עניני העולם הזה – בבנים, בבריאות ובפרנסה – יש לסלק בקבלה באהבה שהכל מאת ה' ולטובה, אלא שהטוב נעלם, מעלמא דאתכסיא, והוא טוב עליון יותר מן הטוב הנראה. ואף עצבות על עניני שמים אין לה מקום בשעת עבודת ה'.",
    stories: [
      { t: "כשאבא קורא", d: "אדמו\"ר הזקן היה בעצמו הקורא בתורה. פעם אחת לא היה בליאזנא בשבת פרשת תבוא, ואדמו\"ר האמצעי – אז נער לפני בר מצוה – שמע את הקריאה מאחר. עגמת הנפש מן הקללות שבתוכחה הביאה אותו לכאב לב, עד שביום הכיפורים הסתפק אדמו\"ר הזקן אם יוכל להתענות. כששאלו את אדמו\"ר האמצעי: הרי בכל שנה קוראים פרשה זו? ענה: כשאבא קורא – לא נשמעות קללות. לקח: מה שנראה כקללה וכיסורים הוא באמת טוב עליון מעלמא דאתכסיא, שאינו נראה; ומי ששומע את הדברים כפי שהם במקורם – אינו שומע בהם רע.", s: "היום יום, י\"ז אלול", u: "https://pnimi.org/page/3701350243" }
    ]
  },
  27: {
    title: "פרק כ\"ז",
    summary: "אם העצבות היא מחמת הרהורי תאוות ומחשבות רעות העולים בלבו – אדרבה, ישמח בחלקו: כל פעם שהוא מסיח דעתו מהן הוא מקיים מצות 'ולא תתורו אחרי לבבכם', ובכך – 'אתכפיא סטרא אחרא' – עולה נחת רוח לפניו יתברך, כמו מביטול הרע לגמרי אצל הצדיקים. וכן בדברים המותרים: המשהה את תאוותו אפילו לשעה מועטת ומתגבר עליה, מכניע את הסטרא אחרא. ולכן אין לבינוני להתעצב על המלחמה הזאת – היא עבודתו, ובה נחת רוחו של מקום.",
    stories: [
      { t: "שיידע שדי", d: "בחורף תרפ\"א, כשהיה אדמו\"ר הריי\"צ חולה, שימש אותו החסיד ר' יצחק אהרן גאָלדין, ובדרך כלל התפלל עמו – החזיק בשבילו את הסידור והפך את הדפים. פעם אחת, בשבת בבוקר, אמר לו ר' יצחק אהרן שהוא הולך לחמם את החלב, והרבי הסכים – ובינתיים התחיל להתפלל מ'מה טובו'. ר' יצחק אהרן אמר לו שישתה לפני 'הודו', וכשנכנס שוב ראה שהרבי כבר התחיל 'ברוך שאמר'. הוא התחיל לדבר עמו שזהו הכרח על פי ציווי הרופאים, והרבי הראה לו שישתה בין שחרית למוסף. ר' יצחק אהרן יצא, וכשנכנס עם החלב ורצה לתתו לו – כבר התחיל הרבי מוסף. הוא חיכה עד שגמר, והתחיל להתחנן לפניו שישתה. אמר לו הרבי: יצחק, הנפש הבהמית עלולה לחשוב שזהו סדר; צריך להראות לה שדי. לקח: גם בדבר המותר, ואפילו בדבר שהוא הכרח, השהיית התאווה לשעה – 'אתכפיא' – מראה לנפש הבהמית שאינה השולטת, ובכך עולה נחת רוח למעלה.", s: "ספר השיחות תרפ\"א, חורף תרפ\"א (מרשימת ר' יצחק אהרן גאָלדין), סעיף יד (ספר השיחות תר\"פ–תרפ\"ז, עמ' 22)", u: "https://pnimi.org/page/4301580103" }
    ]
  },
  28: {
    title: "פרק כ\"ח",
    summary: "גם אם נופלות לו מחשבות זרות – הרהורי תאוות ועוד – דווקא בשעת התפילה או בשעת לימוד התורה, אל יפול ברוחו ואל ישים לבו אליהן; כי זו דרך המלחמה: כשהנפש האלוקית מתעוררת, מתגברת כנגדה גם הנפש הבהמית, כמשל שני אנשים הנאבקים זה בזה. לא יתעסק בהן ולא ינסה לתקנן, אלא יסיח דעתו מהן ויוסיף אומץ בכוונה; ואם הן מטרידות אותו מאד – יבקש מה' בלבו שירחם עליו.",
    stories: []
  },
  29: {
    title: "פרק כ\"ט",
    summary: "יש בינוני שלבו אטום ונפשו כבדה, ואינו יכול לעורר את לבו בתורה ובתפילה. סיבת הדבר היא גסות החומר של הנפש הבהמית המטמטמת את הלב, ועצתו – להשפילה ולבזותה: להתבונן שהוא רחוק מאד מן הצדיק, ושנפשו הבהמית היא מן הקליפה; להתמרמר על כך ולגעור בה כ'רוח שטות'. כמאמר הזוהר: עץ שאינו קולט את האש – מכתתים אותו; כך שבירת הלב וההכנעה פותחות את הלב לאור הנשמה.",
    stories: []
  },
  30: {
    title: "פרק ל'",
    summary: "עוד ישפיל את עצמו: יהיה שפל רוח בפני כל אדם, ואפילו בפני קל שבקלים, כמאמר 'אל תדין את חברך עד שתגיע למקומו'. שהרי מקומו של חברו – טבעו, תאוותיו ומצבו – גורם לו להיכשל, ואילו הוא עצמו, אף שאינו עובר על עבירות גסות, אינו עומד כנגד יצרו כפי כוחו בדברים שבהם הוא חייב, כגון בלימוד ובתפילה כראוי; ונמצא שבערכו ובמקומו – גם הוא אינו נקי.",
    stories: [
      { t: "שלושים שנה עם מלה אחת", d: "החסידים ר' אבא ציאַסניקער ור' הענדל נהגו לסעוד בשבת בליובאוויטש על שולחנו של אדמו\"ר הרש\"ב. ר' אבא היה זקן; בילדותו נשאר יתום מאב ומאם וגדל בין חסידים, אצל דודו – יהודי פשוט, איש השווקים, שעוד נסע לאדמו\"ר הזקן. פעם בשבת ביקש ממנו אדמו\"ר הרש\"ב שיספר משהו מימי ילדותו. סיפר ר' אבא שפעם אמר לו דודו ששמע מאדמו\"ר הזקן ענין – איך יהודי צריך לומר 'מה טובו'. את תוכן הענין לא יכול היה הדוד למסור לו, רק את המלים ששמע מאדמו\"ר הזקן: 'כך צריך יהודי לומר מה טובו'. ר' אבא ידע שדודו לא נסע אז לשום מקום, ושאל אותו: מתי הייתם אצל הרבי? ענה הדוד: מה אתה חושב – עכשיו? את זה אני מספר לך ממה ששמעתי לפני שלושים שנה! אמר אדמו\"ר הריי\"צ (בסעודת אחרון של פסח תש\"ז): כך חי החסיד שלושים שנה עם מלה אחת ששמע מן הרבי – והוא היה איש פשוט. לקח: אין לאדם להתנשא על שום יהודי, ובפרט לא על ה'פשוט'; אפשר שבמקומו הוא עושה יותר ממה שאנו עושים במקומנו, ולכן ראוי להיות שפל רוח בפני כל אדם.", s: "ספר השיחות תש\"ז, סעודת אחרון של פסח תש\"ז, סעיף ב (ספר השיחות תש\"ו–ה'שי\"ת, עמ' 119)", u: "https://pnimi.org/page/4301620302" }
    ]
  },
  31: {
    title: "פרק ל\"א",
    summary: "גם אם ההתבוננות בשפלותו מביאה אותו לעצבות – לא יחוש. אבל באמת, לב נשבר ומרירות הנפש על ריחוקה מאור פני ה' אינם נקראים 'עצבות' כלל: עצבות היא שלבו מטומטם כאבן ואין בו חיות, ואילו במרירות יש חיות בלבו להתפעל ולהתמרמר. השעה המתאימה לכך היא כשהוא עצב ממילא מעניני העולם, ואז יהפוך את העצב לחשבון נפש, ובזה ייפטר מן העצבות. ואחר כך יבוא לשמחה אמיתית: אף שהוא רחוק מה' – יש בקרבו 'חלק ה'' ממש, הנפש האלוקית שבגלות, ויקדיש את חייו להוציאה מגלותה על ידי תורה, מצוות ותפילה – כבן מלך היוצא מבית האסורים אל בית אביו.",
    stories: [
      { t: "אין מקום לעצבות", d: "אדמו\"ר הריי\"צ רשם ברשימת המאסר: בשעות הראשונות למאסרו בשנת תרפ\"ז, בבניין השפאלערקע, הכניסו אותו לחדר סגור להמתין שם. הוא ישב על אחד הכסאות, הביט בשעון התלוי בקיר, ועלתה במוחו המחשבה: מה עושים בני ביתי? – המאסר כבר נודע בבתי ידידיו – ואנחה עמוקה יצאה מלבו. מיד כתב: 'אי אפשר לי בשעה זו ואינני רשאי לחשוב מחשבות כאלו הפועלות נמיכת רוח. פה אין מקום לעצבות ושפלות'. המקום והזמן, כתב, דורשים חסדי ה' ועזרתו באומץ הלב ובהגבהת רוח, ועם זה לשים דעת ולב על כל פרטי ההשגחה העליונה – דבר שיכול לבוא רק מתוך התבוננות של מרירות והסתכלות בציור פני אביו, אדמו\"ר הרש\"ב. ועוד כתב שעליו להכין את עצמו למצב של אסיר, שלא ייבהל ולא יפחד, ולא יסור ממה שהחליט. לקח: פרק לא מבחין בין עצבות, שאין בה חיות, לבין מרירות, שיש בה חיות; הרבי דחה את המחשבות הפועלות נמיכת רוח, ופנה להתבוננות של מרירות שהביאה אותו לבקש את עזרת ה' בהגבהת רוח.", s: "רשימת המאסר של אדמו\"ר הריי\"צ (ספר השיחות תר\"פ–תרפ\"ז, 'רשימת המאסר עם הוספות – רשימה', עמ' 207)", u: "https://pnimi.org/page/4301580292" }
    ]
  },
  32: {
    title: "פרק ל\"ב",
    summary: "כשאדם מחשיב את גופו כמבוזה ואת נפשו כעיקר, קל לו לקיים 'ואהבת לרעך כמוך' באהבה אמיתית לכל יהודי: כל הנשמות הן אחת, ולכולן אב אחד. וגם את הרחוקים מן התורה צריך לקרב בעבותות אהבה – 'אוהב את הבריות ומקרבן לתורה'.",
    stories: [
      { t: "קול ילד בוכה", d: "הרבי (אדמו\"ר מנחם מענדל) מספר במכתב, מתוך מה שמסר לו חותנו אדמו\"ר הריי\"צ: אדמו\"ר האמצעי, שגר בבית אביו, הצטיין בכוח התרכזות ודבקות שלא היה כמותו; בשעת לימודו או תפילתו לא הרגיש כלום ממה שקורה סביבו. פעם, כשהיה שקוע בלימודו, נפל תינוק מן העריסה שבפינת חדרו ופרץ בבכי, והוא לא הרגיש. אדמו\"ר הזקן, שגר בקומה העליונה והיה גם הוא שקוע בלימודו, שמע את הבכי, הפסיק, ירד, הרים את התינוק, הרגיע אותו והשכיבו בעריסה, ולא זז משם עד שראה את נכדו שליו. ורבי דובער עדיין לא הרגיש לא באביו ולא בבנו. לאחר זמן, בשעת הכושר, הוכיח אותו אדמו\"ר הזקן ואמר שאין זו הדרך – להיות שקוע בלימוד עד כדי כך שאין שומעים קול ילד בוכה. לקח: אהבת ישראל של פרק לב דורשת לשמוע כל יהודי שזקוק לעזרה, ולהפסיק לשם כך אפילו עניין נעלה.", s: "אגרות קודש של הרבי, חלק כב, אגרת ח'תקנח (לקראת י\"ט כסלו תשכ\"ג); נדפסה בלקוטי שיחות חלק ו, עמ' 264; וראה לקוטי שיחות חלק ג, עמ' 802 ואילך", u: "https://chabadlibrary.org/books/1200960342" },
      { t: "כשאני רואה יהודי בצער", d: "בחג הפסח תר\"ץ שאל אדמו\"ר הריי\"צ את החסיד ר' שלמה זלמן האוולין אם היה עם אדמו\"ר הרש\"ב בנאות דשא בקיץ תרנ\"ט, וזה סיפר: שם התאכסן הרבי אצל בעל בית, איש פשוט אך שומר תורה ומצוות, שדאג לרבי בכל מאודו. באותם ימים החליט מלמד מחסידי בעשענקאָוויטש, ר' דובער, ללכת לליובאוויטש לשמוע חסידות. הוא עזב את עבודתו והלך ברגל עד ליובאוויטש; שם נודע לו שהרבי בנאות דשא, והלך לשם ברגל; וכשהגיע נודע לו שהרבי לא יאמר חסידות. עצוב ומדוכא הסתובב, עד שפגש בו בעל האכסניה ודיבר על לבו שישים בטחונו בה', בלי לדעת מה סיבת עצבותו. בשבת היה ר' דובער אורחו, ובכל סעודות השבת ניסה בעל הבית להביאו לספר את דאגתו, אולי יוכל לעזור לו – ללא הועיל. בסעודה שלישית נשבר ר' דובער ואמר בעיניים דומעות שלא חסר לו דבר, אלא שרצה לשמוע מאמר מן הרבי, ויגע כל כך עד שהגיע, ולבסוף לא השיג את מבוקשו. בעל הבית, שהיה כבן בית אצל הרבי, נכנס מיד ואמר לו: 'יש כאן אורח שיש לו צער גדול על שאינו יכול לשמוע חסידות מפי הרבי. כשאני רואה יהודי שרוי בצער וביכולתי לעזור – אני עוזר. והרי הרבי יכול לעזור ליהודי זה ולומר חסידות'. כעבור שעה קלה הודיע הרבי שיאמר חסידות, ואחרי ששמע ר' דובער את המאמר האירו פניו והיה בשמחה רבה. לקח: פרק לב מלמד לאהוב כל אחד מישראל באהבה אמיתית; בעל הבית, איש פשוט, לא נח עד שגילה את צערו של האורח – צער על דבר רוחני – ופעל אצל הרבי כדי לעזור לו.", s: "ספר השיחות תר\"ץ, חג הפסח תר\"ץ (ספר השיחות תרפ\"ח–תרצ\"א, עמ' 132–133)", u: "https://pnimi.org/page/4301600323" },
      { t: "האלמנה בפרשבורג", d: "אדמו\"ר הריי\"צ סיפר (אדר–ניסן תרפ\"ד): פעם, כשהיה עם אביו, אדמו\"ר הרש\"ב, בחוץ לארץ, נח אביו אחר סעודת הצהריים על הספה כדרכו, אבל הפעם האריך זמן רב, כאילו אינו בעולם הזה; הבן ניסה לעוררו ברעש ובהזזת השולחן, ולא הועיל. כשהתעורר שאל: איזה יום היום? איזו פרשה? ואחר כך התפלל ערבית באריכות, כעין תפילת ראש השנה. למחרת שאל אם יש כסף; הבן, שהיה אז בדוחק, משכן את מקל הכסף שלו ומסר לאביו את הכסף. האב יצא לבדו, ובשעות הבאות הגיעו למלון חבילות מחנויות של בגדי נשים ונערות. בערב נסעו לפרשבורג. ברחוב שאל הרבי בחור אחד שרץ וממהר היכן המלון של פלוני, והבחור ענה בחיפזון: אין לי פנאי, לכו ישר ושם תשאלו. אמר לו הרבי: 'היתכן? כך מקיימים מצות הכנסת אורחים?' הבחור הבין, עצר, הראה להם את הדרך, וסיפר שבעל המלון נפטר בימים אלה – בדיוק בזמן שהרבי נח על הספה – ובביתו יושבים שבעה. במלון ישבו האלמנה ושלוש בנותיה. הרבי הלך לישיבה שבעיר, שוחח בלימוד עם בחורים, ובהם הבחור מן הרחוב, והרבה להתפלפל עם אחד מהם ושיבחו מאוד. כשחזרו נכנס לנחם את האלמנה, וגלגל את הדברים עד שדיבר עמה שתשתדל להשיא את בנותיה. היא התאוננה שמצבה רע, ובפרט עכשיו אחרי מות בעלה; הוצאות הבגדים מרובות, ושידוכים מתאימים אינם מזדמנים לה. הרבי הציע לבכירה את הבחור ששיבח, ולשנייה את הבחור מן הרחוב, ואמר לה שלא תדאג לבגדים, כי מלבושים לכלות יש לו מן המוכן. שני השידוכים התקיימו. כעבור חמש שנים נסע אדמו\"ר הריי\"צ לפרשבורג במיוחד כדי לראות כיצד הסתדרו הבנות, ומצא שם רק את השלישית; היא סיפרה לו ששתי אחיותיה מאושרות מאוד – בעלה של האחת רב בעיר, ובעלה של השנייה ראש ישיבה. לקח: פרק לב מלמד לאהוב כל אחד מישראל באהבה אמיתית, כאחים ממש; הרבי טרח בעצמו, בזמנו ובכספו, למען אלמנה ובנותיה בעיר זרה.", s: "ספר השיחות תרפ\"ד, [אדר–ניסן תרפ\"ד] בכפר הסמוך למאסקווא, סעיף א (ספר השיחות תר\"פ–תרפ\"ז, עמ' 62–63)", u: "https://pnimi.org/page/4301580143" }
    ]
  },
  33: {
    title: "פרק ל\"ג",
    summary: "עוד שמחה אמיתית לנפש: כשיעמיק ויצייר בשכלו את יחודו האמיתי יתברך – שהוא ממלא כל עלמין, ואפילו 'מלא כל הארץ הלזו כבודו', וכל הנבראים בטלים אצלו במציאות ממש, כביטול אור השמש במקורו – ישמח לבו באמונה זו, שהיא קרבת אלוקים ממש ותכלית בריאת העולמות: להיות לו יתברך דירה בתחתונים. על כך אומרים בכל בוקר 'אשרינו מה טוב חלקנו', כאדם השמח בירושה גדולה. וזהו 'וצדיק באמונתו יחיה': בשמחה זו תתעלה נפשו על כל המונעים את קיום המצוות, וישמח גם בשמחת ה', שבאמונה זו 'אתהפך חשוכא לנהורא', ובפרט בחוץ לארץ.",
    stories: [
      { t: "גם שפאלערנא בכלל", d: "אדמו\"ר הריי\"צ רשם ברשימת המאסר את הלילה הראשון בתא בשפאלערנא, בשנת תרפ\"ז: באמצע תפילת ערבית שמע צעדים כבדים ופתיחת דלתות של תאים סמוכים, יללות של אסירים ואת קול הפקיד המצווה לשים יד על פיו של אחד מהם, ואחר כך יריות וגניחות של נרצחים, עד שהאיר היום. דמעות זלגו מעיניו, פחד אחז בו, ותנומה לא נתן לעיניו. כשנשבה רוח קרה מחורי החלון ושקט של 'חצר מות' שרר, הוקלו מעט מכאוביו, פחדו סר ממנו – 'רוח ממרום יתמכני', כתב – ומחשבותיו הסתדרו. 'המחשבה הראשונה היתה מלא כל הארץ כבודו, אשר גם שפאליערנא בכלל'. ומיד עמד לנגד עיניו ציור מאסרו של אדמו\"ר הזקן במבצר פטרופבלובסק, והוא כתב שבשעה כזו האדם כולו מורם מעל אשפות הגשם והחומר. לקח: פרק לג מלמד להעמיק בכך שאפילו 'מלא כל הארץ הלזו' הוא כבודו יתברך, ואין עוד מלבדו; זו היתה מחשבתו הראשונה של הרבי אחרי הלילה האיום – שגם בית הכלא הזה בכלל.", s: "רשימת המאסר של אדמו\"ר הריי\"צ (ספר השיחות תר\"פ–תרפ\"ז, 'רשימת המאסר עם הוספות – ניירות השייכות להמאסר', עמ' 269–270)", u: "https://pnimi.org/page/4301580352" }
    ]
  },
  34: {
    title: "פרק ל\"ד",
    summary: "האבות היו 'מרכבה' לה', שלא הפסיקו אף שעה מלקשר את דעתם ונשמתם אליו, ואחריהם הנביאים, ובמתן תורה ציווה ה' לעשות לו משכן להשראת שכינתו. ומשחרב בית המקדש אין לו יתברך בעולמו אלא ארבע אמות של הלכה. לכן מי ששכלו קטן מלהיות מרכבה ייעשה לו משכן על ידי עסק התורה בקביעות עתים, וישמח על שזכה להיות 'אושפיזכן לגבורה'. וגם שאר היום, שעוסק בו במשא ומתן, יהיה מכון לשבתו יתברך על ידי הצדקה שיתן מיגיעו – והחומש מעלה עמו לה' את כל ארבע הידות. ושמחות אלו אינן סותרות את היותו נבזה בעיניו ובעל לב נשבר: זה מצד הגוף והנפש הבהמית, וזה מצד הנפש האלוקית.",
    stories: [
      { t: "המטבע של זהב", d: "אדמו\"ר הריי\"צ רשם בזכרונות ילדותו: את הכסף שקיבל על לימוד משניות – 'אשר בזעת אפי בלימוד משניות קבצתים' – הלווה, בעצת אביו, אדמו\"ר הרש\"ב, לגבאים של חברות צדקה. כשהגיע הונו לחמישה עשר רובל, החליפו במטבע זהב אחד, ובו היה משתעשע. באחד הימים ביקש ר' קאפיל מאביו הלוואה של עשרים ושמונה רובל, והאב ענה שאין לו מה להלוות. ר' קאפיל העיף עין במטבע של הילד ואמר שאף שאינו אלא חמישה עשר, בשעת הדחק גם זה טוב. רעד עבר בילד; הוא ראה חיוך קל על שפתי אביו, ובלי לומר דבר הטמין את המטבע בצלחתו. כשהלך ר' קאפיל, אמר לו אביו: גמילות חסד גדולה מצדקה, שהיא הן לעניים והן לעשירים; וכשלא רוצים ובכל זאת נותנים – זה עוד יותר טוב; מלווים לשבוע או שבועיים, מקבלים בחזרה, ויש מצוה גדולה. קשה היה לו מאוד להיפרד מן המטבע, אבל אחרי הסעודה רץ לחנותו של ר' קאפיל. הוא התפלל בלבו שר' קאפיל יאמר שכבר השיג את ההלוואה, אך הלה נאנח: דרוש לי כסף, כסף הרבה, הסוכן צריך לנסוע הלילה להביא סחורה. 'ובשברון לב הוצאתי את האוצר שלי... ואמסרהו', כתב. ר' קאפיל הבטיח שיחזיר בשבוע הבא, והילד לא יכול היה לעצור את דמעותיו ורץ החוצה. עברו שבועות, ובפורים התאזר עוז ושאל על ההלוואה; ענה ר' קאפיל שזהו 'מעשה ישנה', ושגם אם יצליח מסחר האתרוגים בקיץ הבא אינו חושב על הלוואות כאלה. הילד פנה הצדה ובכה. לקח: פרק לד מלמד שבנתינת צדקה מיגיעו נעשה האדם מכון לשבתו יתברך; הילד מסר לגמילות חסד – שאביו לימדו שהיא גדולה מצדקה – את מה שקיבץ ביגיעת לימודו, אף שהיה לו קשה מאוד.", s: "רשימת אדמו\"ר הריי\"צ (זכרונות ילדותו), ספר השיחות תר\"פ–תרפ\"ז, 'רשימת המאסר עם הוספות – רשימה', עמ' 249–251", u: "https://pnimi.org/page/4301580335" }
    ]
  },
  35: {
    title: "פרק ל\"ה",
    summary: "כדי להבין את תכלית ירידת נשמות הבינונים לעולם הזה, שהרי אינם יכולים לגרש את הנפש הבהמית כל ימיהם: הזוהר ממשיל את אור השכינה לאור הנר, את הגוף לפתילה, ואת המעשים הטובים לשמן – אין השכינה שורה על הגוף אלא על ידי מעשים טובים, ולא די לו בנשמתו שהיא חלק אלוה ממעל. כי הנשמה, אפילו של צדיק גמור, אינה בטלה במציאות לגמרי, ואילו המצוות הן רצונו יתברך ממש, בלי הסתר פנים. בעסק התורה מתייחדות הנפש האלוקית ולבושי המחשבה והדיבור שלה באור ה'; וכדי להמשיך את אור השכינה גם על הגוף ועל הנפש הבהמית צריך לקיים מצוות מעשיות הנעשות בגוף ממש – ואז 'שכינתא שריא על רישיה'.",
    stories: [
      { t: "התפילין במבצר", d: "בשמחת תורה תרפ\"ו אמר אדמו\"ר הריי\"צ שעל תורה ומצוות אין שום העלמות והסתרים, אלא רק נסיון, וסיפר את מה שמספרים על אדמו\"ר הזקן: כשהובא למבצר פטרופבלובסק, ישבו שם פקידים ופקידות ששמעו שהביאו 'מורד במלכות'. הוא נכנס עם הטלית והתפילין תחת זרועו, לבוש קפוטה ארוכה, והם תמהו: האם איש כזה הוא מורד במלכות? אחר כך כיוון את עצמו לצד מזרח, הניח את הטלית על כתפו ובדק את הציציות, ואחר כך התעטף בטלית והניח תפילין; וכשהניח את של ראש, כיוון בידיו שתהיה במקומה, ועמד מול היושבים שם. מי שישב – לא יכול היה לקום, ומי שעמד – לא יכול היה לשבת, כמאמר חז\"ל על הפסוק 'וראו כל עמי הארץ כי שם ה' נקרא עליך ויראו ממך' – אלו תפילין שבראש. הרבי הוסיף שזהו מעשה שיש לו בו יסוד וקבלה, כפי שחסידים של פעם היו מספרים אותו. לקח: פרק לה מלמד שבמצוה מעשית הנעשית בגוף ממש נמשך אור השכינה גם על הגוף – 'דשכינתא שריא על רישיה'; התפילין שבראשו של אדמו\"ר הזקן הטילו מורא על כל הנוכחים.", s: "ספר השיחות תרפ\"ו, שמחת תורה תרפ\"ו, סעיף ב (ספר השיחות תר\"פ–תרפ\"ז, עמ' 95)", u: "https://pnimi.org/page/4301580174" }
    ]
  }
};

function renderChapters() {
  const el = document.getElementById('chapters');
  el.innerHTML = '';
  Object.keys(data).forEach(num => {
    const btn = document.createElement('button');
    btn.className = 'chap-btn';
    btn.dataset.num = num;
    btn.textContent = data[num].title;
    btn.onclick = () => showChapter(num);
    el.appendChild(btn);
  });
}

function renderSource(s) {
  if (!s.s) return '';
  const link = s.u ? ` – <a href="${s.u}" target="_blank" rel="noopener">לצפייה במקור</a>` : '';
  return `<div class="source"><strong>מקור:</strong> ${s.s}${link}</div>`;
}

function showChapter(num) {
  document.querySelectorAll('.chap-btn').forEach(b => b.classList.toggle('active', b.dataset.num === String(num)));
  const c = data[num];
  const content = document.getElementById('content');
  const stories = c.stories.length
    ? c.stories.map(s => `<div class="story"><h3>${s.t}</h3><p>${s.d}</p>${renderSource(s)}</div>`).join('')
    : '<div class="empty">סיפורים לפרק זה יתווספו בקרוב.</div>';
  content.innerHTML = `<div class="summary"><strong>תקציר:</strong> ${c.summary}</div>${stories}`;
}

renderChapters();
showChapter(1);
</script>
