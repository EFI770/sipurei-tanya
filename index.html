<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סיפורי תניא</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; line-height: 1.6; }
  header { background: #1e293b; padding: 1.2rem 1rem; text-align: center; border-bottom: 1px solid #334155; }
  h1 { font-size: 1.4rem; font-weight: 600; }
  .chapters { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 1rem; justify-content: center; }
  .chap-btn { background: #334155; color: #f1f5f9; border: none; padding: 0.6rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
  .chap-btn.active { background: #3b82f6; }
  .content { padding: 1rem 1.2rem 3rem; max-width: 700px; margin: 0 auto; }
  .summary { background: #1e293b; padding: 1rem; border-radius: 10px; margin-bottom: 1.2rem; border-right: 3px solid #3b82f6; }
  .story { background: #1e293b; padding: 1rem; border-radius: 10px; margin-bottom: 1rem; }
  .story h3 { color: #93c5fd; margin-bottom: 0.4rem; font-size: 1.05rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>סיפורים חסידיים לספר התניא</h1>
  <p style="opacity:0.7; font-size:0.85rem; margin-top:0.3rem;">ליקוטי אמרים – 5 סיפורים לכל פרק</p>
</header>

<div class="chapters" id="chapters"></div>
<div class="content" id="content"></div>

<script>
const data = {
  1: {
    title: "פרק א'",
    summary: "משביעים את הנשמה להיות צדיק ולא רשע. חמש החלוקות: צדיק וטוב לו, צדיק ורע לו, רשע וטוב לו, רשע ורע לו, ובינוני. לכל יהודי יש שתי נפשות – אלוקית ובהמית.",
    stories: [
      { t: "המלחמה היא העבודה", d: "חסיד בא לאדמו\"ר הזקן ואמר: רבי, אני מרגיש רשע – כל היום עולות בי מחשבות זרות. הרבי ענה: אם אתה נלחם בהן ולא נותן להן לשלוט במעשה – אתה בינוני. זה בדיוק מה שהתניא מלמד." },
      { t: "בינוני גדול מצדיק", d: "פעם אמר האדמו\"ר הזקן: יהודי פשוט שנלחם כל יום ביצר ומתגבר – גדול יותר מצדיק שאין לו מלחמה. הצדיק עובד מתוך תענוג, הבינוני עובד מתוך מסירות נפש." },
      { t: "אל תהיה רשע בעיניך", d: "חסיד היה עצוב מאוד כי חשב שהוא רשע. הרבי אמר לו: אם אתה חושב שאתה רשע – זה בדיוק מה שאומרים לך לא לחשוב. התניא מלמד אותנו להיות בינוניים שמחים." },
      { t: "שתי הנפשות", d: "פעם שאל חסיד: מה ההבדל ביני לבין הנפש האלוקית לבהמית? הרבי ענה: הבהמית רוצה לאכול ולישון, האלוקית רוצה לדבק בה'. אתה בוחר כל רגע מי ישלוט." },
      { t: "המלמד והכסף", d: "מלמד עני מצא צרור כסף שהשאיר אורח. הוא חיכה שנים, והאדמו\"ר הזקן הנחה אותו שלב אחר שלב עד שהפך לסוחר גדול. זה בינוני שעובד במעשה גם כשהרגש לא מושלם." }
    ]
  },
  2: {
    title: "פרק ב'",
    summary: "הנפש האלוקית היא חלק אלוקה ממעל ממש. כאשר האדם נושם – זה מתוכו ומפנימיותו של הבורא.",
    stories: [
      { t: "חלק אלוקה", d: "חסיד אמר: אני כלום. הרבי ענה: אתה לא כלום – אתה חלק מהבורא. כל יהודי נושא בתוכו ניצוץ אלוקי." },
      { t: "הנשמה הגבוהה", d: "פעם שאל חסיד מדוע אני מרגיש רחוק. הרבי: כי הנשמה שלך היא כל כך גבוהה שהגוף לא מספיק לה. זה סימן טוב." },
      { t: "ביטול וגאוה", d: "האדמו\"ר הזקן לימד: ביטול אמיתי אינו לחשוב שאתה כלום, אלא לדעת שאתה חלק מהבורא ולכן אין לך זכות עצמית." },
      { t: "האב והבן", d: "כמו שאב מוציא מתוכו את הנשימה לבנו, כך הקב\"ה נפח בנו נשמת חיים. זה לא דימוי – זה ממש." },
      { t: "הערך העצמי", d: "חסיד שהרגיש חסר ערך שמע מהרבי: אתה יקר כי אתה של ה'. זה לא תלוי במעשים שלך." }
    ]
  },
  3: {
    title: "פרק ג'",
    summary: "כל בחינה של הנפש (נפש, רוח, נשמה) כלולה מעשרה כוחות המקבילים לספירות: חכמה, בינה, דעת ושבע המידות.",
    stories: [
      { t: "דעת מחברת", d: "הרבי הסביר: חכמה היא ניצוץ, בינה היא הבנה, דעת היא החיבור האמיתי. בלי דעת אין עבודת ה'." },
      { t: "המידות", d: "חסיד שאל איך מתקנים מידות. הרבי: על ידי התבוננות בשכל. השכל מוליד את המידות." },
      { t: "עשרה כוחות", d: "כל יהודי יש לו את כל הכוחות. העבודה היא לגלות אותם ולהשתמש בהם לקדושה." },
      { t: "חכמה ובינה", d: "האדמו\"ר הזקן אמר: חכמה בלי בינה היא כמו זרע בלי אדמה. שתיהן נצרכות." },
      { t: "התבוננות", d: "חסיד ישב שעה והתבונן בפרק. בסוף הרגיש שהמידות שלו השתנו. זה כוח השכל." }
    ]
  },
  4: {
    title: "פרק ד'",
    summary: "שלושת הלבושים של הנפש האלוקית: מחשבה, דיבור ומעשה של תרי\"ג מצוות.",
    stories: [
      { t: "כוח הדיבור", d: "הרבי אמר: דיבור אחד של תורה יכול לשנות את כל היום. הלבוש מלביש את הנשמה." },
      { t: "מעשה קטן", d: "חסיד עשה מצווה קטנה בשמחה. הרבי: זה יותר חשוב מדיבור גדול בלי מעשה." },
      { t: "מחשבה דיבור מעשה", d: "שלושתם ביחד מלבישים את כל תרי\"ג איברי הנשמה. זה החיבור לה'." },
      { t: "הלבוש החשוב", d: "האדמו\"ר הזקן: אפילו אם הלב לא מרגיש – המעשה והדיבור עדיין מלבישים את הנשמה." },
      { t: "תרי\"ג מצוות", d: "כל מצווה שעושים במעשה דיבור ומחשבה – מחברת אותנו להבורא." }
    ]
  },
  5: {
    title: "פרק ה'",
    summary: "לימוד התורה הוא תפיסה והתאחדות עם הבורא. לית מחשבה תפיסא בך – אבל בתורה אפשר.",
    stories: [
      { t: "כוח הלימוד", d: "הרבי אמר: אפילו אם לא מבינים הכל – הלימוד מחבר אותנו לה'. זה הדבר הקרוב ביותר." },
      { t: "תורה בזמנים קשים", d: "חסיד למד תניא בבית הסוהר. אחר כך אמר: זה מה שנתן לי כוח לעמוד." },
      { t: "התאחדות", d: "כאשר לומדים תורה – אנחנו תופסים את הבורא. זה לא דימוי." },
      { t: "גם לא מבינים", d: "האדמו\"ר הזקן: אפילו אם לא מבינים את הכל – הלימוד עדיין מעלה." },
      { t: "הדבר הקרוב", d: "כי קרוב אליך הדבר מאוד – בפיך ובלבבך. הלימוד הוא הדרך." }
    ]
  }
};

function renderChapters() {
  const el = document.getElementById('chapters');
  el.innerHTML = '';
  Object.keys(data).forEach(num => {
    const btn = document.createElement('button');
    btn.className = 'chap-btn';
    btn.textContent = data[num].title;
    btn.onclick = () => showChapter(num);
    el.appendChild(btn);
  });
}

function showChapter(num) {
  document.querySelectorAll('.chap-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const c = data[num];
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="summary"><strong>תקציר:</strong> ${c.summary}</div>
    ${c.stories.map(s => `<div class="story"><h3>${s.t}</h3><p>${s.d}</p></div>`).join('')}
  `;
}

renderChapters();
showChapter(1);
</script>
</body>
</html>
