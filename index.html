      {"t": "היחידות הראשונה בונה את החסיד", "d": "מפתגמי אדמו\"ר מהר\"ש: מבנה השכל והמידות של חסיד הוא לפי ערך היחידות הראשונה שלו אצל רבו. והיחידות הראשונה היא לפי ערך מהותו העצמית של החסיד – ולפי מהותו, כזה סדר עבודה נותן לו הרבי. פרק ב מתאר את הנשמות כענפים הקשורים בנשמות הצדיקים, \"ראש ומוח\" של הדור, והפתגם מראה שהרבי מכיר את מהות הנשמה ומדריך אותה לפיה.", "s": "היום יום, כ' סיון (מפתגמי אדמו\"ר מהר\"ש).", "u": "https://pnimi.org/page/3701350278"},
      {"t": "היחידות הראשונה: הסרת ערלת הלב", "d": "החסיד ר' הענדל סיפר דבר שהיה ידוע לכל החסידים: ביחידות הראשונה אצל הרבי הייתה \"העברת הערלה\" – מה שלא יהיה, מ\"ערלת הלב\" נפטרו מיד. פרק ב מלמד שההתקשרות לצדיק, \"ולדבקה בו\", קושרת את הנשמה ומייחדת אותה בשורשה.", "s": "היום יום, י\"ג אלול.", "u": "https://pnimi.org/page/3701350191"},
      {"t": "\"הרבי אינו בודד, וחסידים אינם בודדים\"", "d": "פעם אחת, בשנים תקמ\"ד–תקמ\"ז, התוועדו החסידים הראשונים, ותוכן שיחתם היה: הרבי – אדמו\"ר הזקן – פעל שלא יהיו בודדים. פעם היה הרב – הר\"מ והגאון – בודד, והתלמידים היו בודדים. דרך החסידות שייסד הרבי היא התועלת האלוקית הגדולה: הרבי אינו בודד, וחסידים אינם בודדים. לפי פרק ב, נשמות ההמון יונקות מנשמת הצדיק כענפים מן השורש.", "s": "היום יום, כ\"ב אייר.", "u": "https://pnimi.org/page/3701350301"},
      {"t": "\"תפארת שבתפארת עושה טוב\"", "d": "כשהיה אדמו\"ר מהר\"ש בן שבע, בחן אותו פעם אביו, הצמח צדק. הילד ענה היטב כל כך, עד שהמלמד שלו התפעל ולא יכול היה להתאפק, ואמר לצמח צדק: \"הא, מה אתם אומרים? הוא עושה טוב!\" ענה לו הצמח צדק: \"מה ההתפעלות, שתפארת שבתפארת עושה טוב?\" מהר\"ש נולד בב' אייר, היום השבעה עשר לעומר – תפארת שבתפארת. פרק ב מלמד שהבן נמשך ממוח האב, והצמח צדק הכיר את מדרגת נשמת בנו כבר בילדותו.", "s": "היום יום, ב' אייר.", "u": "https://pnimi.org/page/3701350035"},
      {"t": "אהבת ישראל – גם ליהודי שלא ראית", "d": "אדמו\"ר הזקן סיפר לבנו, אדמו\"ר האמצעי, שהסבא – הבעל שם טוב – אומר: צריך שתהיה מסירות נפש על אהבת ישראל, אפילו כלפי יהודי שמעולם לא ראו. פרק ב מתאר את כל הנשמות כנמשכות מ\"חכמה עילאה\", כבן ממוח אביו – ולכן כל יהודי, גם מי שלא ראינו, קשור אלינו בשורשו.", "s": "היום יום, ט\"ו כסלו.", "u": "https://pnimi.org/page/3701350220"},
      {"t": "\"ארץ חפץ\": האוצרות הגנוזים ביהודים", "d": "בל\"ג בעומר, בערך בשנת תר\"ד, סיפר הצמח צדק תורה של הבעל שם טוב על הפסוק \"כי תהיו אתם ארץ חפץ, אמר ה' צבאות\". כשם שהחכמים הגדולים ביותר לעולם לא ישיגו את האוצרות הגדולים שטבע הקב\"ה בארץ, כך אין איש יכול להשיג את האוצרות הגדולים הטמונים ביהודים, שהם \"ארץ חפץ\" של הקב\"ה. וסיים הבעש\"ט: \"אני רוצה לעשות מיהודים שיתנו את היבול ש'ארץ חפץ' של הקב\"ה יכולה לתת\". האוצרות האלה הם הנפש האלוקית, \"חלק אלוה ממעל ממש\" (פרק ב), שנמצאת גם אצל הפשוט שבפשוטים.", "s": "היום יום, י\"ז אייר.", "u": "https://pnimi.org/page/3701350239"},
      {"t": "אדמו\"ר הזקן ו\"העצמי\" של היהודי הפשוט", "d": "בי\"ט כסלו תש\"ח סיפר אדמו\"ר הריי\"צ שעד נסיעתו למזריטש עסק אדמו\"ר הזקן רק עם בני תורה. לאחר שחזר ממזריטש, ובידעו את \"הכוונה הפנימית\", קירב במיוחד דווקא אנשים פשוטים. אדמו\"ר הזקן מסר נפשו למען איש פשוט, בעניין גשמי או בעניין רוחני, כי ראה את ה\"עצמי\" של היהודים הפשוטים. פרק ב מדגיש שגם נשמות \"עמי הארץ ופחותי הערך\" נמשכות מחכמה עילאה וקשורות לצדיקים.", "s": "ספר השיחות תש\"ו–ה'שי\"ת (ספר השיחות תש\"ח), שיחת י\"ט כסלו תש\"ח, סעיפים ב-ג, עמ' 181-182.", "u": "https://pnimi.org/page/4301620381"}
    ]
  },
  3: {
    title: "פרק ג'",
    summary: "כל בחינה של הנפש (נפש, רוח, נשמה) כלולה מעשרה כוחות המקבילים לספירות: חכמה, בינה, דעת ושבע המידות.",
    stories: [
      { t:"\"עם הרצפה ועם הספסל\"", d: "פעם שאל אדמו\"ר הזקן את בנו, אדמו\"ר האמצעי: במה אתה מתפלל? כלומר, באיזו התבוננות. השיב הבן: בדרוש \"וכל קומה לפניך תשתחווה\". אחר כך שאל הבן את אביו: ובמה אתה מתפלל? השיב לו: עם הרצפה ועם הספסל. ב\"בית רבי\" מבואר שהכוונה להתבוננות כיצד גם בעצים ובאבנים החיות מאלקות היא תמידית, ואילו הייתה מסתלקת לרגע, היו חוזרים לאין ואפס.", s: "בית רבי, ח\"א, עמ' 178 והערה ב' שם", u: "https://hebrewbooks.org/pdfpager.aspx?req=3751&pgnum=195" },
      { t:"\"חסד הוא אהבה\"", d: "ב\"בית רבי\" מובא שאדמו\"ר הזקן אמר: קודם שנסע למעזריטש הייתה עבודתו בהתבוננות, שהיא הסיבה העיקרית לאהבת ה' ויראתו; ובמעזריטש התעלה למדרגה שבה הידיעה עצמה היא יראה ואהבה. ואחד מנכדיו הרבנים סיפר בשמו שאמר: בתחילה, כששמעתי מהמגיד שחסד הוא אהבה וגבורה היא יראה, חשבתי שזו מליצה; ואחר כך ראיתי שכן הדבר – חסד הוא אהבה וגבורה היא יראה.", s: "בית רבי, ח\"א, פרק א, עמ' 4, הערה ב'", u: "https://hebrewbooks.org/pdfpager.aspx?req=3751&pgnum=21" },
      { t:"למה קוראים לנו חב\"ד", d: "אחד הרבנים מנכדי אדמו\"ר הזקן סיפר, שהצדיק מווילעדניק אמר על חסידי חב\"ד משל: הם כמו רובה טעון באבק שריפה ובכדורים, והמחזיק בו יודע לירות ויודע לאן לירות – רק הניצוץ חסר; כלומר, חסרה אצלם אהבה ויראה בהתגלות הלב. אמר הנכד, ששאלה זו כבר שאלו את אדמו\"ר הזקן, והוא השיב: כתוב \"וידעת היום והשבות אל לבבך\" – על \"וידעת\" נאמר \"היום\", ועל \"והשבות אל לבבך\" לא נאמר \"היום\". בדעת צריך להיות מוכן כבר עכשיו – לדעת איך צריכות להיות אהבה ויראה וכל מיני ההתבוננות – וזו כל מלאכתנו עתה: להשפיע דעת בעם; ואילו \"והשבות אל לבבך\" יהיה על ידי משיח, שיפיח את הניצוץ בלב. ואמר, שלכן קוראים אותנו בשם חב\"ד, כי כל ענייננו להשפיע מוחין בחסידים.", s: "בית רבי, ח\"א, דף מד", u: "https://hebrewbooks.org/pdfpager.aspx?req=3751&pgnum=104" },
      {"t": "\"משכיל\" ו\"עובד\": ר' אייזיק ור' הלל", "d": "אדמו\"ר הרש\"ב אמר שאצל החסידים הזקנים משתקפת בכל מילה ובכל תנועה מהותם העצמית. אביו, אדמו\"ר מהר\"ש, אמר לו ביחידות, בזמן שהתחיל לומר את המשך \"מים רבים\": ר' אייזיק מהאמיל הוא משכיל, ור' הלל מפאריטש הוא עובד. השכלה ועבודה הן שני עולמות, ומשכיל ועובד הם שני אנשים – כך היה מיום שנברא העולם – ובא הרבי, אדמו\"ר הזקן, וחיבר את שני העולמות ואת שני האנשים. ר' אייזיק הוא משכיל נפלא, ממציא משלים המכוונים לנקודה הפנימית של ההשכלה, והוא גם עובד מופלג בעבודה שבלב; ור' הלל הוא עובד ה' בגופו – כשם שהמוח הוא כלי לשכל והעיניים כלי לראייה, כך גופו הוא כלי למה שצריך – והוא גם משכיל נפלא. פרק ג מבאר שהמידות נולדות מן השכל, ודרך חב\"ד מחברת את ההשכלה עם העבודה בלב ובגוף.", "s": "ספר השיחות תש\"ו–ה'שי\"ת, הוספות, \"רשימה\", עמ' 418 (רשימת אדמו\"ר הריי\"צ בשם אביו אדמו\"ר הרש\"ב, בשם אדמו\"ר מהר\"ש).", "u": "https://pnimi.org/page/4301620656"},
      {"t": "חב\"ד וחג\"ת: הכל תלוי בנקודת ההתחלה", "d": "בהתוועדות י\"ט כסלו תש\"ח אמר אדמו\"ר הריי\"צ: טועים כשחושבים שחב\"ד היא השכלה בלבד – הרי חב\"ד היא חכמה, בינה ודעת, ומה לזה ולעבודת המידות, חג\"ת? פעם דיברו על \"חסידי חג\"ת\" ועל \"חסידי חב\"ד\", אבל אין הכוונה שחסידי חג\"ת הם רק חג\"ת בלי חב\"ד, או שחסידי חב\"ד הם רק חב\"ד בלי חג\"ת. ההבדל הוא רק בנקודת ההתחלה – מאין מתחילים; ועיקר החסידות הוא העבודה. פרק ג מסביר שחב\"ד הם \"אם ושורש\" לחג\"ת, כי האהבה והיראה נולדות מן ההתבוננות.", "s": "ספר השיחות תש\"ו–ה'שי\"ת (ספר השיחות תש\"ח), שיחת י\"ט כסלו תש\"ח, סעיף ב, עמ' 180-181. השיחה מצוטטת בתורת מנחם כרכים כז-כח.", "u": "https://pnimi.org/page/4301620380"},
      {"t": "רש\"י על חומש ורש\"י על גמרא", "d": "אדמו\"ר הזקן אמר פעם: פירוש רש\"י על החומש הוא \"יינה של תורה\" – הוא פותח את הלב ומגלה אהבה ויראה עצמיות; ופירוש רש\"י על הגמרא פותח את המוח ומגלה שכל עצמי. הפתגם מבחין בין שני סוגי הכוחות שמונה פרק ג – השכל והמידות – ומלמד שלימוד התורה פועל על כל אחד מהם.", "s": "היום יום, כ\"ט שבט.", "u": "https://pnimi.org/page/3701350381"},
      {"t": "\"ובמה מספרים את ה'לכם'?\"", "d": "ביום ב' דחג השבועות תרכ\"א, בסעודה, סיפר הצמח צדק מה שאמר אדמו\"ר הזקן בסעודת יום ב' דשבועות תקנ\"ה, בשם המגיד ממזריטש ביום ב' דשבועות תקכ\"ה: \"וספרתם לכם\" – \"וספרתם\" מלשון ספירות ובהירות, וצריך לעשות שה\"לכם\" יהיה בהיר. אדמו\"ר הזקן נשען על זרועות קדשו ושר בדבקות גדולה את הניגון של ארבע הבבות. אחר כך הרים את ראשו ושאל בניגון של שאלה: \"ובמה מספרים את ה'לכם'?\", ותוך כדי דיבור ענה בניגון של תשובה: \"בשבע שבתות תמימות – בבירור שבע המידות, שכל מידה ומידה תהיה כלולה משבע, ושבע המידות עצמן יהיו שבע שבתות, שהרי שבת אינה צריכה בירור\". פרק ג מונה את שבע המידות שבנפש האלוקית, וספירת העומר היא עבודת בירורן.", "s": "היום יום, י' אייר.", "u": "https://pnimi.org/page/3701350147"},
      {"t": "האל\"ף של חסידות", "d": "החסיד ר' משה מייזליש סיפר שאדמו\"ר הזקן לימד אותם: האל\"ף של חסידות הוא לנצל את הטבעיות לעבודה, וראשית העבודה היא לנצל את טבע הכוחות – כמו למשל הטבע שהמוח שליט על הלב. לפי פרק ג השכל הוא \"אם ושורש\" למידות, ו\"מוח שליט על הלב\" הוא היישום המעשי של סדר טבעי זה.", "s": "היום יום, י\"ט אדר ב'.", "u": "https://pnimi.org/page/3701350263"},
      {"t": "\"שנו מידותי\": תורה ומידות טובות", "d": "ר' משה, בנו של אדמו\"ר הזקן, למד בהיותו כבן שמונה עד אחת עשרה את הסוגיה בגיטין על שבחם של חכמים, והסתפק בדברי רשב\"י \"שנו מידותי\": האם פירושו \"למדו תורתי\", כפירוש רש\"י, או \"מידותי\" כפשוטו. בתוך כך נכנס אדמו\"ר הזקן ואמר, בניגון כדרכו בקודש: התורה שניתנה לנו כולה מידות טובות, ואפילו העונשים שבה הם באמת חסד וטוב. שני הפירושים אחד הם, והא בהא תליא: אי אפשר למידות טובות בלי תורה, ואי אפשר לתורה בלי מידות טובות. מעשה דומה אירע גם לצמח צדק בגיל כזה.", "s": "היום יום, כ\"ג אלול.", "u": "https://pnimi.org/page/3701350317"},
      {"t": "ר' זושא לומד עבודת ה' מגנב", "d": "כל המידות, אפילו אלו שאינן טובות או ששמן רע, אפשר להשתמש בהן לעבודת ה' על פי התורה. כך למד הצדיק ר' משולם זושא מאניפולי כמה דרכים בעבודת ה' מגנב: הוא הולך בהצנע; מעמיד את עצמו בסכנה; דבר קטן ביותר חשוב בעיניו כדבר גדול; עמל בטרחה גדולה; פועל בזריזות; בוטח ומקווה; ואם לא הצליח בפעם הראשונה – חוזר פעמים רבות. פרק ג מבאר שלנפש האלוקית שבע מידות קדושות, וההוראה כאן היא לרתום לעבודת ה' גם את התכונות הטבעיות.", "s": "היום יום, ג' אייר.", "u": "https://pnimi.org/page/3701350049"},
      {"t": "זוהר, מדרש ותהלים בדמעות", "d": "הצמח צדק אמר לחסיד ר' הענדל ביחידות: הזוהר מרומם את הנפש, המדרש מעורר את הלב, ותהלים בדמעות שוטף את הכלי. כך כל סוג לימוד פועל על כוח אחר בנפש – בהתאם להבחנה שבפרק ג בין כוחות הנפש, ובמיוחד על הלב והמידות.", "s": "היום יום, ט\"ז טבת.", "u": "https://pnimi.org/page/3701350221"}
    ]
  },
  4: {
    title: "פרק ד'",
    summary: "שלושת הלבושים של הנפש האלוקית: מחשבה, דיבור ומעשה של תרי\"ג מצוות.",
    stories: [
      { t:"\"וכבסו שמלותם\"", d: "בערב חג השבועות תקנ\"ז אמר אדמו\"ר הזקן תורה: \"וקדשתם היום ומחר\" – זהו מלמעלה; אבל \"וכבסו שמלותם\" – את זה צריך לעשות בעצמו. וזו הייתה כל התורה שאמר. ה\"צמח צדק\" ביאר: \"וקדשתם\" נאמר למשה, ולאתפשטותא דמשה שבכל דור ודור, שבכוחם לקדש את היום ואת המחר; אבל לשם כך צריך גם \"וכבסו שמלותם\" – לבושי מחשבה, דיבור ומעשה – ואת זה צריך לעשות בעצמו.", s: "היום יום, ה' סיון", u: "https://text.chabadpedia.com/index.php?title=%D7%97%D7%91%22%D7%93%D7%98%D7%A7%D7%A1%D7%98:%D7%94%D7%99%D7%95%D7%9D_%D7%99%D7%95%D7%9D/%D7%A1%D7%99%D7%95%D7%95%D7%9F" },
      { t:"\"אמן יהא שמיה רבא\" אחד", d: "שנים רבות לפני מאסרו בפטרבורג (בשנת תקנ\"ט) יצא פעם אדמו\"ר הזקן אל הציבור ואמר: בגן עדן מרגישים את היוקר של העולם הזה. לא מיבעיא מלאכי השרת – אפילו הנאצלים הראשונים היו מוסרים הכול עבור \"אמן יהא שמיה רבא\" של יהודי, כשהוא אומר אותו בכל כוחו, כפירושו ובכל כוונתו, כלומר כשהוא כולו בתוך זה. זה היה כל המאמר, והוא עורר התלהבות כזו אצל השומעים, ששנה שלמה אמרו \"אמן יהא שמיה רבא\" בהתלהטות.", s: "היום יום, י\"ז אדר א'", u: "https://text.chabadpedia.com/index.php?title=%D7%97%D7%91%22%D7%93%D7%98%D7%A7%D7%A1%D7%98:%D7%94%D7%99%D7%95%D7%9D_%D7%99%D7%95%D7%9D/%D7%90%D7%93%D7%A8" },
      {"t": "\"במצוה אחת אני שלה\"", "d": "פעם, כשיצא אדמו\"ר הזקן מחדרו, שמע את הרבנית אומרת לכמה נשים: \"שלי אומר\". אמר הרבי: במצוה אחת אני שייך לה, ובכמה מצוות שייכים לקב\"ה! ונפל על מזוזת הפתח ונכנס לדבקות. כשהתעורר מהדבקות, אמר: \"צאינה וראינה\" – לצאת מעצמו ולראות אלוקות – נעשה על ידי \"בנות ציון\": המלכות מעוררת את הזעיר אנפין, ולעתיד לבוא תהיה \"אשת חיל עטרת בעלה\". פרק ד מלמד שבקיום המצוות הנפש מתלבשת ברצון ה' ומתאחדת עמו.", "s": "היום יום, כ\"ג שבט.", "u": "https://pnimi.org/page/3701350309"},
      {"t": "\"אינני רוצה אלא אותך לבדך\"", "d": "הצמח צדק כתב על זקנו, אדמו\"ר הזקן, מה שהיה אומר בשעת דבקותו על הפסוק \"מי לי בשמים\": \"אינני רוצה מאומה; אינני רוצה את גן העדן שלך, אינני רוצה את העולם הבא שלך – אינני רוצה אלא אותך לבדך\". הרבי הדגיש בליל ב' דפסח תשי\"א שהסיפור לא נאמר רק כדי לפאר את מדרגת אדמו\"ר הזקן, אלא יש בו הוראה לכל יהודי: אין להתבלבל משום דבר, גשמי או רוחני, כי רצונו של יהודי הוא בעצמות ומהות אין סוף ברוך הוא בלבד. פרק ד מבאר שבתורה ובמצוות מתאחדים עם הקב\"ה עצמו, למעלה מגן עדן.", "s": "לקוטי שיחות כרך ב, דברים, שיחה א, עמ' 362 (משיחת ש\"פ מטות-מסעי תשט\"ז); תורת מנחם כרך ג (תשי\"א ח\"ב), שיחת ליל ב' דחג הפסח תשי\"א. המקור: הצמח צדק, דרך מצותיך, שרש מצות התפלה פרק מ.", "u": "https://pnimi.org/page/1390201106"},
      {"t": "\"אליהו, אני מקנא בך\"", "d": "אדמו\"ר מהר\"ש אמר לחסיד ר' אליהו אבעלער – איש פשוט בכשרונותיו ובידיעותיו – כשנכנס אליו ליחידות: \"אליהו, אני מקנא בך. אתה נוסע ליריד ורואה הרבה אנשים, וכשבאמצע העסק מדברים זה עם זה דבר יהודי, אמרה מעין יעקב, ומעוררים על לימוד נגלה וחסידות – מזה נעשית שמחה למעלה. ועל כך משלם הקב\"ה את דמי התיווך בבני, חיי ומזוני; וככל שהיריד גדול יותר והעבודה רבה יותר, כך גדלה הפרנסה\". הדיבור הוא אחד משלושת לבושי הנפש שבפרק ד, ודברי תורה באמצע המסחר מלבישים אותו בתורה.", "s": "היום יום, ט\"ז אייר.", "u": "https://pnimi.org/page/3701350226"},
      {"t": "\"קורע כדג\": כוחו של דיבור", "d": "לאחד מבעלי הבתים במעזיבוז היה ריב עם בעל בית אחר, ופעם, בבית הכנסת אצל הבעל שם טוב, צעק שהיה \"קורע את יריבו כדג\". הבעש\"ט ציווה על תלמידיו לאחוז זה בידי זה ולעמוד לידו בעיניים עצומות, והניח את ידיו הקדושות על כתפי שני התלמידים שעמדו לצדו. לפתע החלו התלמידים לצעוק בפחד: הם ראו כיצד בעל הבית קורע את יריבו כדג! מכאן רואים בבירור שלכל כוח יש פועל ממשי – אם בלבוש חומרי, ואם ברוחני שאפשר לתופסו רק בחושים נעלים ועדינים יותר. פרק ד מגדיר את המחשבה, הדיבור והמעשה כלבושים שדרכם הנפש פועלת – ולכן כה חשוב להלביש אותם בתורה ובמצוות.", "s": "היום יום, כ\"ט תשרי.", "u": "https://pnimi.org/page/3701350390"},
      {"t": "תורה בחנות, ברחוב ובמשא ומתן", "d": "עבודת בעלי העסקים מתחלקת לשני סעיפים עיקריים. האחד – העבודה עם עצמו: בשעה הפנויה, בשבתו בחנות וכדומה, ילמד משנה או פרק תניא, ויהיו לו דברי תורה שיהיה בקי בהם בעל פה, כמו חומש, משניות ותניא, כדי שיוכל לחזור עליהם בלכתו ברחוב ובשוק. השני – העבודה עם זולתו: בשעת דיבור בענייני עסק יסובב את הדיבור לספר סיפור בעל תוכן, וימצא סיבה לעורר על לימוד. כך ממלא בעל העסק בתורה את לבושי המחשבה והדיבור שלו, שעליהם מדבר פרק ד.", "s": "היום יום, ד' ניסן.", "u": "https://pnimi.org/page/3701350062"},
      {"t": "כל סיפור הוא הוראה בחיים", "d": "אדמו\"ר הרש\"ב אמר: ב\"יציאת מצרים\" של חסידות יש מצוה של סיפור יציאת מצרים בדיבור – לספר סיפורים חסידיים ולהפנים את הסיפור בפנימיות שבפנימיות. צריך לדעת שכל סיפור הוא הוראה בחיים. כל סיפור צריך להביא מידה טובה וחיות פנימית בהידור מצוה, ולחוש בו את \"דרכי הנועם\" של תורת החסידות. כך הדיבור, אחד הלבושים שבפרק ד, מתקדש בסיפורי צדיקים ומביא למעשה בפועל.", "s": "היום יום, כ\"ו מנחם אב (משיחות אדמו\"ר הרש\"ב).", "u": "https://pnimi.org/page/3701350352"},
      {"t": "\"עשה מה שאתה צריך\"", "d": "אדמו\"ר הזקן שאל את אחד החסידים הגדולים והמקורבים ביותר, כשהיה אצלו ביחידות, על מצבו, והחסיד התאונן שירד מנכסיו. ענה לו הרבי: \"אותך צריכים כדי שתאיר את סביבתך בתורה ובעבודה שבלב. פרנסה ומה שאתה צריך – את זה צריך הקב\"ה לתת לך. עשה מה שאתה צריך, והשי\"ת יעשה מה שהוא צריך\". פרק ד מעמיד את תכלית הנשמה בקיום המצוות ובלימוד התורה – וזו השליחות שהרבי הזכיר לחסיד.", "s": "היום יום, ה' תמוז.", "u": "https://pnimi.org/page/3701350079"},
      {"t": "צדקה לעני לפני התפילה", "d": "אדמו\"ר מהר\"ש ביאר פעם במאמר את מה שנאמר על רבי אלעזר, ש\"יהיב פרוטה לעני והדר מצלי\" – נתן פרוטה לעני ואחר כך התפלל: התפילה צריכה להיות בחיות, וכשנותנים צדקה לעני לפני התפילה ומחיים אותו, נוספת חיות רבה בתפילה. בשעת הדברים הניע את ידו ממטה למעלה, לרמז שהריבוי הוא בהפלאה. ואדמו\"ר הרש\"ב, פעמים רבות לפני התפילה, היה מחפש עני כדי לתת לו לאכול. המעשה הוא הלבוש השלישי שבפרק ד, וצדקה במעשה מוסיפה חיות בעבודה הרוחנית.", "s": "היום יום, ב' כסלו.", "u": "https://pnimi.org/page/3701350042"},
      {"t": "שבעים קופיקות ושערי ההיכלות העליונים", "d": "הצמח צדק סיפר לבנו, אדמו\"ר מהר\"ש, מאורע מחייו, וסיים: כשעוזרים ליהודי בפרנסה, אפילו להרוויח שבעים קופיקות (מטבע קטנה ברוסיה) במסחר עגלים, כל שערי ההיכלות העליונים פתוחים לפניו. כעבור כמה שנים סיפר מהר\"ש את הדברים לבנו, אדמו\"ר הרש\"ב, והוסיף: צריך אמנם לדעת אפילו את הדרך להיכלות העליונים, אבל לא זה העיקר; העיקר הוא לעזור בלב שלם וברגש, ושיהיה תענוג לעשות טובה ליהודי. פרק ד מלמד שמעשה מצוה גשמי ופשוט מחבר את האדם לרצון העליון יותר מכל גילויי העולמות העליונים.", "s": "היום יום, כ\"ח סיון.", "u": "https://pnimi.org/page/3701350374"}
    ]
  },
  5: {
    title: "פרק ה'",
    summary: "לימוד התורה הוא תפיסה והתאחדות עם הבורא. לית מחשבה תפיסא בך – אבל בתורה אפשר.",
    stories: [
      { t:"\"לירד לעומקה של הלכה\"", d: "בני אדמו\"ר הזקן מספרים בהקדמתם לשולחן ערוך שלו: כשהיה במעזריטש, ביקש המגיד למצוא בין תלמידיו איש שיוכל \"להבין ולהורות הלכה ברורה... הלכות בטעמיהן\", ולסדר את פסקי ההלכה \"בלשון צח ומילתא בטעמא\", משום שטרדת הפרנסה אינה מניחה לרבים לעיין בים התלמוד והפוסקים. הוא בחר באדמו\"ר הזקן, הפציר בו \"עד בוש\", ואמר לו: \"אין נבון וחכם כמוך לירד לעומקה של הלכה\". אדמו\"ר הזקן החל במלאכה עוד במעזריטש, בהלכות ציצית והלכות פסח.", s: "הקדמת בני המחבר לשולחן ערוך אדמו\"ר הזקן (מובאת גם בבית רבי, ח\"א, פרק ג, עמ' 6)", u: "https://www.chabadlibrary.org/books/11200019492" },
      { t:"בפעם השש עשרה", d: "באותה הקדמה מספרים בני אדמו\"ר הזקן, שכבר בהיותו בן שמונה עשרה למד את כל התלמוד עם ספרי הראשונים והאחרונים, ובהיותו בן שלושים חזר על כל התלמוד עם כל הראשונים והאחרונים שש עשרה פעמים. \"כאשר שמענו מפה קדוש\", בהיותו בעיר מאהליב שעל נהר דניסטר חזר על כל התלמוד בפעם השש עשרה בעמידה, לילה ויום, ולא פסק פיו מגירסא, \"כאשר עיני הכל ראו\". אז התחיל להגיה ולחדש בשולחן ערוך שלו, החל מהלכות נטילת ידיים.", s: "הקדמת בני המחבר לשולחן ערוך אדמו\"ר הזקן (מובאת גם בבית רבי, ח\"א, פרק ג, עמ' 7)", u: "https://www.chabadlibrary.org/books/11200019492" },
      { t:"הלכות בטעמיהן", d: "אדמו\"ר האמצעי כותב בהקדמתו לשולחן ערוך של אביו: \"לא פעם ושתים שמעתי מפי רוח קדשו\", שאם יגמור ה' בעדו, יצווה על כל אנ\"ש, מגדולם ועד קטנם, בכל עיר ומניין, לקבוע עתים בחבורות ללמוד הלכות בטעמיהן ולהיות בקיאים בהן, עד שכל הלכה תהא שגורה בפיהם. ועל זה, הוא מוסיף, אמרו חז\"ל \"השונה הלכות בכל יום מובטח לו שהוא בן העולם הבא\" – הלכות בטעמיהן הברורים למעשה, \"שזהו אמיתית גלוי רצון העליון\".", s: "הקדמת אדמו\"ר האמצעי לשולחן ערוך אדמו\"ר הזקן (קאפוסט תקע\"ו); נדפסה באגרות קודש אדמו\"ר האמצעי, אגרת כג", u: "https://www.chabadlibrary.org/books/11200019492" },
      {"t": "חלומות של תורה – פרי השקידה ביום", "d": "חלומות טובים בענייני תורה, שבהם מודיעים לאדם חידושים, באים על פי רוב בזכות שקידה גדולה בתורה ביום. כשאדם עוסק בתורה בשקידה גדולה, או בעבודה שבלב ביגיעה עצומה, נשמתו עולה בלילה למעלה ושואבת לה \"חיים מחיי דלעילא\", כמבואר בזוהר – ואז מודיעים לו חידושי תורה, בנגלה או בפנימיות התורה, איש איש לפי שקידת עבודתו ביום. פרק ה מתאר את התורה כמזון לנשמה המתאחד עמה, והשקידה ביום ממשיכה חיות ושפע תורה גם בלילה.", "s": "היום יום, ד' טבת.", "u": "https://pnimi.org/page/3701350058"},
      {"t": "\"וקנה לך חבר\": קולמוס הלב", "d": "כאשר התחיל הצמח צדק לכתוב בענייני נגלה וחסידות, אמר לו אדמו\"ר הזקן: \"וקנה לך חבר\" – \"וקַנֶה\" מלשון קולמוס: הקולמוס יהיה לך חבר. פעם אמר אדמו\"ר הרש\"ב את הדברים בשם אדמו\"ר הזקן, ופירש: \"קולמוס הלב\" – שכל דבר שלומדים צריך \"לחיות\" אותו. פרק ה דורש שהשכל לא רק יידע את התורה אלא יתאחד עמה, ו\"קולמוס הלב\" הוא היחוד הזה בפועל.", "s": "היום יום, י\"ד מנחם אב.", "u": "https://pnimi.org/page/3701350203"},
      {"t": "הניגון שבלימוד הצמח צדק", "d": "הצמח צדק חיבר כמה ניגונים, ולימודו היה בקול ובניגון. לפעמים היה מפסיק באמצע הלימוד, או באמצע כתיבת חסידות או שאלות ותשובות, ומנגן ניגון. אדמו\"ר מהר\"ש סיפר שמקול ניגונו של הצמח צדק היה יודע במה הוא עוסק באותה שעה. לימודו היה מאוחד כל כך עם נפשו, עד שהניגון ביטא את מה שעסק בו – המחשה ליחוד השכל עם התורה שבפרק ה.", "s": "היום יום, י\"ג סיון.", "u": "https://pnimi.org/page/3701350188"},
      {"t": "שיעור יומי: הצמח צדק ובנו", "d": "בחודש מרחשון תרי\"ג קבע הצמח צדק, מלבד שאר השיעורים, שיעור לימוד עם בנו, אדמו\"ר מהר\"ש, שתי שעות ומחצה בכל יום – בחורף משעה עשר בלילה, ובקיץ משעה ארבע לפנות בוקר. שנתיים למדו קבלה עם ביאורי חסידות, ואחר כך, עד אלול תרט\"ז, כשהשיעור נפסק, למדו ספרי מחקר על פי תורת החסידות: רס\"ג, מורה נבוכים, עיקרים, כוזרי ועוד. פרק ה מעמיד את לימוד התורה בעיון כדרך העליונה לדבקות בה'.", "s": "היום יום, י\"ט סיון.", "u": "https://pnimi.org/page/3701350266"},
      {"t": "בן שתים עשרה מלמד קידוש החודש", "d": "בהיותו בן תשע למד אדמו\"ר הזקן הנדסה וחכמת התכונה, ובגיל עשר סידר לוח לחמש עשרה שנה. בהיותו בן שתים עשרה נזדמן שלימד ברבים את הלכות קידוש החודש להרמב\"ם, והגאונים שהיו באותו מעמד לא מצאו ידיהם ורגליהם בבית המדרש. פרק ה מדגיש שההלכה היא חכמתו ורצונו של ה', והמשיג אותה מתאחד עמה – וכאן השגה כזו אצל ילד.", "s": "היום יום, ז' שבט.", "u": "https://pnimi.org/page/3701350101"},
      {"t": "\"אור\" תמיד שווה, \"מאור\" תמיד חדש", "d": "אדמו\"ר הרש\"ב סיפר על הדרוש \"וארא... ושמי ה'\", העוסק בעניין \"כי לא ידח ממנו נדח\" (ואינו הנדפס בתורה אור), שקנה לו שם \"דער פרומער וארא\" – ה\"וארא\" האדוק. אדמו\"ר הזקן היה רגיל לחזור עליו אחת לשלוש שנים, ובכל פעם אמר אותו כמעט כלשונו. אמר הצמח צדק: בכל פעם היה זה אור חדש. ועל כך אמר \"דער טאטע\" – האבא: \"אור\" הוא תמיד שווה, אבל \"מאור\" הוא תמיד כדבר חדש. פרק ה מבאר שבתורה האור האלוקי מתלבש בשכל – וגם כשהמילים חוזרות, ה\"מאור\" מתחדש אצל הלומד.", "s": "היום יום, ב' שבט.", "u": "https://pnimi.org/page/3701350031"},
      {"t": "ניטל: למה לא לומדים", "d": "אדמו\"ר הריי\"צ שמע מאביו, אדמו\"ר הרש\"ב, את הטעם למנהג שלא ללמוד בניטל: כדי שלא להוסיף חיות. פעם אמר אביו: \"המתמידים ששמונה השעות האלה נוגעות להם בנפש – איני מחבב\". והמנהג הוא רק עד חצות הלילה. הטעם \"שלא להוסיף חיות\" מניח שלכל לימוד תורה יש השפעה ממשית של המשכת חיות, כמו שמתאר פרק ה את התורה כמזון לנשמה.", "s": "היום יום, י\"ז טבת.", "u": "https://pnimi.org/page/3701350234"}
    ]
  },
  6: {
    title: "פרק ו'",
    summary: "כנגד הנפש האלוקית יש נפש מצד הקליפה והסטרא אחרא – 'זה לעומת זה'. גם היא כלולה מעשר בחינות טמאות (שלוש שכליות ושבע מידות רעות) ומתלבשת בשלושה לבושים: מחשבה, דיבור ומעשה של רע. כל מה שאינו בטל לה' ומרגיש עצמו דבר נפרד – נקרא 'סטרא אחרא', הצד האחר.",
    stories: [
      { t: "הבית בפוזנא", d: "אדמו\"ר הריי\"צ מביא בספר הזכרונות מעשה שסיפרה רחל, בתו של ר' ברוך מפוזנא, הנקרא 'ר' ברוך בטלן' (סבו של ר' ברוך, אבי אדמו\"ר הזקן). ר' ברוך בטלן גר שלושים שנה כדייר בבית ברחוב הפורטוגלי בפוזנא. הבית היה שייך לצורף הזהב אביגדור טוביה ולאשתו שרה גיטל. בעל הבית היה שיכור, משחק בקלפים ומרבה לנבל את פיו. אשתו עסקה בהכנסת אורחים, הכנסת כלה וסיוע ליולדות עניות, אך הרבתה בקללות. שניהם נתנו צדקה ביד רחבה. לאחר שנפטרו בלא ילדים, נשמעו מדירתם בכל ערב צווחות פראיות, צחוק של שיכורים, רקיעות רגליים ושירה גסה, ואיש מן השכנים לא יכול היה לעצום עין. ר' ברוך בטלן סיפר על כך לרבו, רבי יואל בעל שם מזאמושטש. רבי יואל הורה להפוך את הדירה לבית מדרש: להכניס לשם ספרי תורה, להתפלל בה שלוש פעמים ביום ולקבוע בה עתים לתורה. הרוחות ברחו מן הדירה, אך כעבור שישה שבועות השתכנו במרתף. רבי יואל בא אז בעצמו לפוזנא והזמין את בית הדין של העיר ל'דין תורה' עם המזיקים. נציגם טען שהבית שייך להם, כי הם נולדו ממחשבותיו ומעשיו הרעים של אביגדור טוביה ומקללותיה של שרה גיטל, ולכן הם יורשיהם. את הדירה שלמעלה, אמר, עזבו בגלל האור הגדול שבא עם ספרי התורה. בית הדין פסק שאין להם חלק בירושה. רבי יואל ציווה עליהם לעזוב את הבית, ומאז לא נראו עוד. לקח: לפי הסיפור, מן הקללות והמעשים הרעים נבראו מזיקים ממש, ורק אור התורה והקדושה גירש אותם.", s: "ספר הזכרונות לאדמו\"ר הריי\"צ (בתרגום ללשון הקודש), פרקים פ–פב; ובאנגלית: Lubavitcher Rabbi's Memoirs, vol. 2, ch. 33", u: "https://www.myascent.org/the-haunted-house/" },
      { t: "שיהיה ממך בצל", d: "אדמו\"ר האמצעי ציווה על החסידים לחזור חסידות בכל מקום שעברו בו בדרכם מליובאוויטש לביתם. חסיד אחד, שחזר חסידות בכישרון רב, התאונן לפני אדמו\"ר האמצעי שההצלחה שיש לו כשהוא חוזר חסידות לפני אחרים גורמת לו רגש של ישות. אדמו\"ר האמצעי לא התרשם, ואמר לו: 'א ציבעלע זאל פון דיר ווערן, אבער חסידות זאלסטו חזר'ן' – גם אם ייעשה ממך בצל, חסידות תמשיך לחזור. לקח: הישות – הרגשת ה'אני' הנפרד – היא עניין של סטרא אחרא, אבל אין בה סיבה להפסיק לעשות טוב.", s: "תורת מנחם – התוועדויות תשמ\"ה, כרך א, עמ' 223 (שיחת ליל א' דחג הסוכות); אגרות קודש של הרבי, חלק ח, עמ' 288 (כמובא במגזין Derher, כסלו תשפ\"ד, הערה 14)", u: "https://derher.org/wp-content/uploads/Kislev-5784-3.pdf" },
      { t: "שבעים הפנים שמאחור", d: "זקני החסידים בוויטבסק מסרו מעשה מימי צעירותו של אדמו\"ר הזקן. ר' אלישע, למדן שחבריו כינוהו 'גאון הגאונים', פירש קטע במסכת עירובין שלא כפירוש רש\"י, והתרעם על כך שלא קיבלו את פירושו: הרי גם תוספות חולקים לעתים על רש\"י, והראב\"ד על הרמב\"ם, והרי 'שבעים פנים לתורה'. בשנת תקכ\"א, השנה הראשונה אחרי הסתלקות הבעל שם טוב, טען זאת ר' אלישע לפני ר' אפרים, מחסידי הבעל שם טוב בוויטבסק, וזה ענה לו בפשטות: 'כתוב \"כתובה פנים ואחור\". כשם שיש פנים, יש גם אחור. המחלוקות והפירושים של רש\"י ותוספות, של הרמב\"ם והראב\"ד – הם משבעים הפנים של התורה. הטענות והפירושים שלך – הם משבעים האחוריים של התורה'. אדמו\"ר הרש\"ב, שסיפר זאת, הסביר: כשלומדים בביטול, החידושים הם מן הפנים; כשלומדים בישות ובגאווה, החידושים הם מן האחוריים. לקח: גם בלימוד תורה, הרגשת עצמו כמציאות נפרדת היא 'צד אחר' שמסתיר את הקדושה.", s: "שיחת אדמו\"ר הרש\"ב לתלמידי תומכי תמימים, שמחת תורה תרס\"א ('כל היוצא למלחמת בית דוד'), בלקוטי דיבורים לאדמו\"ר הריי\"צ – בתרגום האנגלי, פרק 56", u: "https://www.chabad.org/library/article_cdo/aid/6279493/jewish/Chapter-56.htm" },
      { t: "חמץ ומצה", d: "עילוי מפורסם, בעל כשרון גדול ועמקן נפלא, שהיה תחילה ממתנגדי החסידות, בא לליאזנא ושקד בלימוד החסידות, ובזמן קצר רכש ידיעה גדולה ורחבה בה. ביחידות הראשונה אצל אדמו\"ר הזקן שאל: 'רבי, מה חסר לי?'. ענה לו אדמו\"ר הזקן: 'אין חסר לך מאומה, כי ירא אלוקים אתה ולמדן, רק צריך אתה להוציא את החמץ, שהוא ישות וגסות הרוח, ולהכניס מצה, שהיא ביטול. ועל פי דין, כלי שהשתמשו בו על ידי האור צריך ליבון, והליבון הוא עד שיהיו ניצוצות ניתזין'. כשיצא מן היחידות אמר: 'הרבי לימד אותי הלכה בהלכות פסח באופן שלומדים בגן עדן' – כלי שהשתמשו בו בישות, שנדמה לו שהוא אור, כגון שפודין, 'שדוחקין רגלי השכינה', צריך ליבון, עד שהניצוצות ניתזים ונכללים באור האמיתי. לקח: הישות היא החמץ שבנפש – מה שתופח ומרגיש את עצמו – והתיקון הוא ביטול.", s: "היום יום, כ\"ז תמוז; אגרות קודש אדמו\"ר הריי\"צ, חלק ד, אגרת א'כ, עמ' שלג–שלד", u: "https://www.chabad.org/therebbe/article_cdo/aid/3316746/jewish/27-Tammuz.htm" },
      { t: "זיעה של מצוה", d: "כשאדמו\"ר הריי\"צ ניהל את ישיבת תומכי תמימים בליובאוויטש, ביקש להתקבל בחור מוכשר מאוד, שהייתה בו גסות שניכרה אפילו בתווי פניו. אדמו\"ר הרש\"ב הסכים לקבלו, וביקש מבנו לתת לו תשומת לב מיוחדת. לקראת פסח הורה הרש\"ב למסור לבחור את כל העבודה הקשה של אפיית המצות לתלמידים, שנעשתה בהידורים רבים. הבחור עבד בשמחה שבועות ארוכים, ובנוסף נצטווה ללמוד מאמר חסידות מורכב ולהסבירו. בסעודת אחרון של פסח אמר הרש\"ב לבנו: 'יוסף יצחק! ראה מה גדול כוחה של זיעה במצוה – לבחור הזה יש פנים אחרות לגמרי. הגסות נעלמה, והופיעו פנים של אדם'. לקח: הגסות של הקליפה אינה נעלמת מעצמה; היא מתבררת דרך עבודה ממשית בקדושה.", s: "היום יום, כ\"ז תמוז – בביאור 'A Story with an Echo' שבמהדורה האנגלית של קה\"ת (באתר chabad.org), בשם לקוטי דיבורים (בתרגום האנגלי), חלק א, עמ' 259 ואילך", u: "https://www.chabad.org/therebbe/article_cdo/aid/3316746/jewish/27-Tammuz.htm" },
      { t: "במה אתה נחוץ", d: "אדמו\"ר הריי\"צ סיפר: חסיד בא לאדמו\"ר הזקן והתאונן על מצבו בפרנסה ובבריאות: הוא צריך שה' ישלח רפואה לו ולבני ביתו, הוא צריך פרנסה כדי לפרוע חובות, להשיא את ילדיו ולתקן את ביתו. ענה לו הרבי: 'אתה אומר מה שאתה צריך – ועל מה שצריכים אותך, אינך שואל!'. הרבי (אדמו\"ר מנחם מענדל) מוסיף באחד ממכתביו ששמע מחותנו, שכאשר תיקן החסיד את הנהגתו לפי ההוראה הזאת, הוטב מצבו, ועוד יותר מבתחילה. לקח: כשהאדם עסוק רק בעצמו ובצרכיו, הוא שוכח את התכלית שלשמה נברא; זו הנקודה שבה 'מציאות עצמו' עומדת מול עבודת ה'.", s: "ספר השיחות תש\"ג, עמ' 195; אגרות קודש של הרבי, חלק יא, אגרת ג'תקיא (כ\"ה אייר תשט\"ו)", u: "https://www.chabad.org/library/article_cdo/aid/2611382/jewish/Self-Concern.htm" }
    ]
  },
  7: {
    title: "פרק ז'",
    summary: "הנפש הבהמית שביהודי היא מקליפת נוגה, שיש בה טוב ורע. כל הדברים המותרים – אכילה, שתייה ועסקים – יונקים מנוגה. כשאדם אוכל כדי שיהיה לו כוח לעבוד את ה', המאכל עולה ונכלל בקדושה; ואם אוכל לתאוותו בלבד – הוא יורד זמנית לסטרא אחרא, עד שיחזור ויעבוד ה' בכוח זה.",
    stories: [
      { t: "למה אתה אוכל?", d: "פעם שיחקו בגן בניו הקטנים של אדמו\"ר המהר\"ש, הרז\"א והרש\"ב, והתווכחו על דברי המלמד, שבלקוטי תורה כתוב שיש הבדל בין טבע המידות של יהודי לטבע המידות של גוי. הרש\"ב, אז ילד בן חמש, לא הבין ולא האמין שיש הבדל כזה. קרא המהר\"ש למשרתו בנציון ושאלו: 'אכלת היום?' – 'כן'. 'אכלת טוב?' – 'מה פירוש טוב? שבע, ברוך השם'. 'ולשם מה אכלת?' – 'כדי לחיות'. 'ולשם מה אתה חי?' – 'כדי שאוכל להיות יהודי ולעשות מה שהקב\"ה רוצה', ונאנח. אחר כך ביקש המהר\"ש לקרוא לאיוואן הגוי, משרת החצר, ושאל אותו אותן שאלות. איוואן ענה שהוא אוכל כדי לחיות, וחי 'כדי שאוכל לשתות כוסית יי\"ש ולנשנש'. אמר המהר\"ש לבניו: 'רואים אתם: יהודי בטבעו אוכל כדי לחיות, וחי כדי להיות יהודי ולעשות מה שהקב\"ה מצווה. ועוד הוא נאנח, כי מרגיש שעדיין אינו עושה זאת באמת לאמיתו. והגוי חי בשביל השתייה והנשנוש, ומחייך, כי מצייר לעצמו את התענוג שבאכילה ושתייה, שזו התכלית בעיניו'.", s: "לקוטי דיבורים, חלק ג, עמ' תכא–תכב (שיחת ליל א' דחג הפסח תש\"ג, סעיף לט)", u: "https://www.chabad.org/parshah/article_cdo/aid/1062252/jewish/The-Origin-of-the-Jewish-Work-Ethic.htm" },
      { t: "סעודת שבת לשם שמים", d: "אדמו\"ר הריי\"צ סיפר, בסעודת יום ב' דראש השנה, ששמע מזקני החסידים: כשחזר אדמו\"ר הזקן ממזריטש, נכנס במוצאי שבת אל החסידים שישבו וחזרו על התורה ששמעו ממנו, ואמר: 'זקני' – הבעל שם טוב – 'גילה את מעלות הנשמות. וידוע המעשה: בשעה שישב עם תלמידיו בסעודת שבת, הראה להם כיצד רב אחד, גאון וצדיק שהיה במקום אחר, אוכל את סעודת השבת לשם שמים. ו'הרבי'' – המגיד ממזריטש – 'גילה את המעלות שבאלוקות'. לקח: גם אכילה גשמית, כשהיא לשם שמים, היא עניין של מעלת הנשמה.", s: "ספר השיחות תש\"ב, סעודת יום ב' דראש השנה, סעיף ב (מפי זקני החסידים, בשם אדמו\"ר הזקן)", u: "https://www.chabad.org/library/article_cdo/aid/4062523/jewish/Chapter-3.htm" },
      { t: "העגלון מבשנקוביץ", d: "באגרת משנת תרצ\"ו מביא אדמו\"ר הריי\"צ רשימה ששמע מאביו, אדמו\"ר הרש\"ב, על החסיד ר' יוסף מבשנקוביץ. בשנת תקס\"ד אמר לו אדמו\"ר הזקן ביחידות: 'לטובת נשמתך טוב יותר להיות בעל עגלה מלהיות רב'. כעבור כעשר שנים הציעו לו רבנות, והוא נזכר בדברים. אחרי מאבק פנימי קשה נעשה לעגלון, כשהוא כבן שבעים, אחרי עשרות שנים של לימוד תורה. בשנת תקע\"ו לן באחד ממסעותיו במלון בדרך לעיר סעננא. באותו מלון התאכסן גם יהודי בשם שלמה לייב, שעזב את דרך אבותיו, חי עם אשה נכרית ושימש בחצר אציל. האורח זלזל בתפילה, אך בלילה שמע את ר' יוסף אומר תיקון חצות בבכי, ובבוקר את תפילתו הארוכה בהתלהבות, ונזכר בבית אביו. הוא נשבע לשוב בתשובה גמורה, ביקש טלית ותפילין והתפלל בבכי רב. מאוחר יותר הגיע לליובאוויטש, ואדמו\"ר האמצעי סידר לו תיקון וציווה עליו לשוב לאשתו ולילדיו. כשנכנס ר' יוסף ליחידות, אמר לו אדמו\"ר האמצעי: 'אבי היה אצלי ואמר שיוסף בשנקוביצער הוציא לפועל את הכוונה'. אדמו\"ר הריי\"צ כותב שאין בידו מסורת ברורה בדבר, אך 'יש מקום לחשוב' שעבור בעל תשובה זה כתב אדמו\"ר האמצעי את הקונטרס 'פוקח עורים', העוסק בתיקוני תשובה, ובפרט על שכרות, ולכן כתבו באידיש, השפה המדוברת.", s: "אגרות קודש אדמו\"ר הריי\"צ, חלק ג, אגרת תתכה (כ\"ו טבת תרצ\"ו), עמ' תעז ואילך", u: "https://chabadpedia.co.il/wiki/%D7%A4%D7%95%D7%A7%D7%97_%D7%A2%D7%95%D7%A8%D7%99%D7%9D" },
      { t: "לחם וקוואס", d: "אדמו\"ר הרש\"ב אמר בשיחה לאחיו, הרמ\"מ: 'מענדל שאתה נקרא על שמו' – הצמח צדק – 'היה מענדל אחר לגמרי'. כידוע, במגירתו של הצמח צדק היה מונח לחם, ובמקום כלשהו בחדר עמד גם 'קוואס'. כשהיה אוכל מזה לפני שקיבל אנשים ליחידות, כדי שיהיה לו כוח לענות ליהודי או לעשות דבר מסוים, היה שומע ורואה בלחם ובקוואס אלוקות, 'בבחינת עצמותו יתברך', יותר מבשעת תפילתו – 'והרי גודל ערך תפילתו ידוע'. 'הייתי מאחל זאת לעצמי ברגע זה', הוסיף. לקח: אכילה מן ההיתר, כשהיא בשביל עבודת ה', אינה רק מותרת – היא נעשית כלי לאלוקות.", s: "ספר השיחות תורת שלום (שיחות אדמו\"ר הרש\"ב), שיחת שמחת תורה תרס\"א, סעיף ו; בתרגום ללשון הקודש בגליון 'מעיינותיך' (באתר תורת חב\"ד)", u: "https://toratchabad.com/%D7%91%D7%93%D7%A8%D7%9B%D7%99-%D7%94%D7%A2%D7%91%D7%95%D7%93%D7%94-%D7%94%D7%A4%D7%A0%D7%99%D7%9E%D7%99%D7%AA" },
      { t: "בגשמיות וברוחניות", d: "פעם ישבו אדמו\"ר הזקן וחבריו, תלמידי המגיד ממזריטש, בהתוועדות. אדמו\"ר הזקן אמר 'לחיים' ואיחל: 'יהי רצון שה' יעזור לנו בגשמיות וברוחניות'. שאלו אותו: מדוע אתה מקדים גשמיות לרוחניות? ענה: גם יעקב אבינו הקדים – 'ונתן לי לחם לאכול ובגד ללבוש', ורק אחר כך 'והיה ה' לי לאלוקים'. טענו חבריו: הגשמיות של יעקב אבינו היא מסוג אחר לגמרי! השיב להם: הלא גם הרוחניות שלו מסוג אחר; ואף אצלו הרוחניות גבוהה מהגשמיות, ובכל זאת הקדים את הגשמיות. לקח: הצרכים הגשמיים של יהודי אינם סתירה לעבודת ה' – הם הבסיס שעליו היא נבנית.", s: "שמועות וסיפורים (הרב רפאל נחמן הכהן), חלק א, עמ' 43 – כמובא בגליון 'מעיינותיך' (באתר תורת חב\"ד)", u: "https://toratchabad.com/%D7%A1%D7%99%D7%A4%D7%95%D7%A8%D7%99%D7%9D-%D7%A2%D7%9C-%D7%90%D7%93%D7%9E%D7%95%D7%A8-%D7%94%D7%96%D7%A7%D7%9F" },
      { t: "עשרים דקות זה הרבה", d: "בהתוועדות שמחת תורה תרפ\"ט העיר מישהו לאדמו\"ר הריי\"צ שהשעה מאוחרת לתפילת מנחה, ונותרו רק כעשרים דקות. ענה הרבי: 'עשרים דקות זה הרבה. אפשר לעשות תשובה עד שהזדונות נעשים כזכויות. זדונות – אותם איננו רוצים, אבל את הזכויות אנו רוצים. ובעשרים דקות אפשר לעשות תשובה'. לקח: בסוף פרק ז מבאר התניא שתשובה מאהבה הופכת את הזדונות לזכויות ומעלה אותם לקדושה – ולתשובה כזו די ברגעים ספורים.", s: "ספר השיחות תרפ\"ט, יום שמחת תורה, סעיף יא (ספר השיחות תרפ\"ח–תרצ\"א, עמ' 43)", u: "https://pnimi.org/page/4301600217" }
    ]
  },
  8: {
    title: "פרק ח'",
    summary: "מאכלות אסורות נאחזים בשלוש הקליפות הטמאות לגמרי – אינם עולים לקדושה ומטמטמים את הלב. גם דברים בטלים ושיחה בטלה, ובמיוחד ביטול זמן מתורה, חמורים מאוד, כי מבזבזים את כוחות הנפש האלוקית. וחכמת אומות העולם מלבישה את חב\"ד שבנפש בקליפת נוגה – אלא אם לומדים אותה לפרנסה או כדי להשתמש בה בעבודת ה' ובתורה.",
    stories: [
      { t: "הזמן של השיחות הבטלות", d: "ר' אבא גינזבורג, סוחר גדול ועשיר ממינסק, התאונן ביחידות לפני אדמו\"ר המהר\"ש שאין לו זמן ליטול ספר ביד, וטוב לו אם מספיק להתפלל בציבור. אמר לו הרבי: 'אבא, הרי אתה בר דעת, אמור בעצמך: כך מודים לה' על שנתן לך את הנסיון של דאגות העשירות במקום הנסיון של דאגת העניות?' ר' אבא יצא שבור. כעבור כמה ימים החליט לעזוב את עסקיו, לקחת מלמד ולשבת באוהלה של תורה, ולהוריש מחצית מהונו לצדקה. הרבי אמר שטוב שייקח מלמד וילמד בכל יום, ושהצדקה תהיה חלק מן התיקון, אף שצריך גם תשובה. אך את הצדקה עליו לתת עוד בחייו, ואת העסקים לא לעזוב. כשטען ר' אבא שלא יהיה לו זמן, ענה הרבי: 'יהיה לך זמן – את הזמן של דברים בטלים, שמדברים בו על דברים שאינם שייכים לעצם העסק, את הזמן הזה תן לתפילה וללימוד'. ר' אבא חזר הביתה, ערך חשבון של רכושו, לקח מלמד ונזהר מדברים בטלים במסחר. ובאמת נעשו לו כמה שעות פנויות בכל יום ללימוד. כעבור כמה חודשים בא לליובאוויטש עם החשבון, וחילק את חלק הצדקה לדברים שונים.", s: "אגרות קודש אדמו\"ר הריי\"צ, חלק ח, אגרת ב'קנו (י\"ג תשרי תש\"ד), עמ' ה–ז", u: "https://www.chabad.org/parshah/article_cdo/aid/3324946/jewish/Finding-Time.htm" },
      { t: "שעון או ספרים", d: "אדמו\"ר הריי\"צ רשם בילדותו (תרנ\"א) שאביו, אדמו\"ר הרש\"ב, היה נותן לו כסף על כל פרק משניות שלמד בעל פה. הוא חסך את הכסף והלווה אותו לגמילות חסדים. הוא השתוקק לקנות ספרים בכריכה טובה ושעון עם שרשרת מוזהבת, ושקל מה לקנות קודם: את הספרים, שבינתיים אפשר לשאול, או את השעון, שאי אפשר להשיג בהשאלה. 'כף מאזני שכלי הכריע כי שעון נחוץ יותר, ותועלתו מרובה בשמירת הזמן' – כתב. הוא צייר לעצמו שבעזרת השעון לא רק כל שעה תהיה מיוחדת לעניני קדושה, אלא אפילו הדקות יהיו שמורות.", s: "רשימת אדמו\"ר הריי\"צ משנת תרנ\"א, נדפסה בספר המאמרים תרנ\"א, הוספות, עמ' רנו–רנז (באנגלית: Likkutei Dibburim, vol. 4, ch. 37, §14)", u: "https://chabadpedia.co.il/wiki/%D7%A9%D7%9E%D7%99%D7%A8%D7%AA_%D7%94%D7%96%D7%9E%D7%9F" },
      { t: "החלב של הנכרי", d: "חסיד אחד בא לאדמו\"ר הזקן וסיפר בצער שחתנו נתקף לעתים בספקות באמונה. אדמו\"ר הזקן השיב שהחתן שתה, בלי לדעת, חלב שחלב נכרי בלי שיהודי רואהו. אף שלא ידע על כך, ואף שהאיסור הוא מדרבנן, השפיע עליו הדבר עד שגרם לו ספקות באמונה. אחר כך הורה אדמו\"ר הזקן לחסיד כיצד לתקן את הדבר. לקח: מאכל אסור מטמטם את הלב ומשאיר בו רושם, גם כשנאכל בשוגג וגם כשהאיסור מדרבנן; זו חומרת מאכלות אסורות שבפרק ח.", s: "ספר המאמרים אידיש, עמ' 57; ספר המאמרים ת\"ש, עמ' 82 (בעימוד הראשון) – כמובא בשיעורים בספר התניא (קה\"ת), פרק ח", u: "https://www.chabad.org/library/tanya/tanya_cdo/aid/1058362/jewish/Tanya-Chapter-8-II.htm" },
      { t: "עשרים ושניים מאסרים", d: "באסיפת הרבנים בפטרבורג בשנת תר\"ג (1843) נאסר הצמח צדק עשרים ושתיים פעמים, משום שעמד בתוקף נגד דרישת המלוכה לשינויים בחינוך וכו'. השר טען: 'הרי זה מרד במלכות!'. ענה לו הצמח צדק: 'מורד במלכות חייב מיתה בגוף, אבל מורד במלכות שמים חייב מיתה בנפש. ואיזה מהם גדול יותר?'. לקח: בעיני הצמח צדק, הסכנה לנפש שבשינוי החינוך חמורה מן הסכנה לגוף; ובתניא מבואר שחכמות האומות מלבישות את חב\"ד שבנפש בקליפה.", s: "היום יום, כ\"ג מרחשון; ספר השיחות תש\"א, עמ' 57", u: "https://www.chabad.org/therebbe/article_cdo/aid/3318030/jewish/23-Cheshvan.htm" }
    ]
  },
  9: {
    title: "פרק ט'",
    summary: "מקום משכן הנפש הבהמית בחלל השמאלי שבלב, והנפש האלוקית שוכנת במוח ומתפשטת לחלל הימני. הגוף הוא 'עיר קטנה' ששתי הנפשות נלחמות עליה – כל אחת רוצה למשול בה לבדה. רצון הנפש האלוקית שכל מחשבה, דיבור ומעשה יהיו שלה ולה' בלבד. והיצר הרע נלחם רק כדי שהאדם יתגבר עליו – כמשל הזוהר על המלך שבחן את בנו.",
    stories: [
      { t: "והאר עינינו", d: "ר' שלמה מונסון, חסיד של אדמו\"ר האמצעי בשקלוב, נולד למשפחה עשירה וגדל בין חסידי אדמו\"ר הזקן. הוא שמר על מנהגי החסידים, אבל חסר לו חום חסידי. שמונה שנים נסע לליובאוויטש ליחידות ולא ראה שינוי ממשי בעצמו. בהתוועדות של חסידי שקלוב פרץ ר' מיכל המלמד הצולע בבכי, הכה על חזהו והתפלל – לא על אחרים, אלא על עצמו: 'ריבונו של עולם, רחם עליי ועזור לי, שאוכל לומר \"והאר עינינו בתורתך\" באותה התלהבות שבה שלמה מונסון אומר \"והעושר והכבוד מלפניך\"'. הדברים חדרו ללבו של ר' שלמה. זמן קצר אחר כך נסע לליובאוויטש, נכנס ליחידות אצל אדמו\"ר האמצעי וחזר אדם אחר. לקח: אותו להט שבלב יכול לבעור לעושר או לאלוקות; המלחמה על 'העיר הקטנה' היא על כך למי ילך הלב.", s: "שיחת אדמו\"ר הרש\"ב לתלמידי תומכי תמימים, שמחת תורה תרס\"א ('כל היוצא למלחמת בית דוד'), בלקוטי דיבורים לאדמו\"ר הריי\"צ – בתרגום האנגלי, פרק 56", u: "https://www.chabad.org/library/article_cdo/aid/6279493/jewish/Chapter-56.htm" },
      { t: "המנורה והאבן", d: "בשנת תקנ\"ה בא לליאזנא אברך עילוי, מפורסם בישיבות מינסק והגליל, הגאון ר' זאב דוב. מזגו היה מתון וקר; הוא הרגיש את מהות עצמו, סתר בבקיאותו ובחריפותו את דברי חבריו, והיה גס רוח נורא. ביחידות הראשונה שאל אותו אדמו\"ר הזקן: 'מה חסר לך?', והוא השיב: 'איני יודע מה חסר לי, ואיני מרגיש שחסר לי'. אמר לו אדמו\"ר הזקן: 'רוחניות וגשמיות הפכים הם במהותם: מה שהוא מעלה בגשמיות הוא חסרון ברוחניות. מידת ההסתפקות היא מעלה בגשמיות וחסרון ברוחניות'. אחר כך נשען בדבקות, ואמר: 'בני ישראל נקראים נרות. נר כלול מכלי, שמן, פתילה ואש, אבל צריך להדליק את האש, ואז הוא מאיר. אצלך יש נר טוב, אבל חסר לך המדליק. על ידי הכאה בכוח באבן של הנפש הבהמית יוצא ניצוץ אש, שמדליק את האש האלוקית'. ר' זאב דוב שקד בלימוד החסידות, ובתוך כחצי שנה נעשה לאחד מבחירי התלמידים. לקח: המאבק עם הנפש הבהמית, ולא בריחה ממנו, הוא שמצית את אור הנפש האלוקית.", s: "היום יום, י' סיון ול' סיון; אגרות קודש אדמו\"ר הריי\"צ, חלק ד, אגרת תתקלז, עמ' קכ–קכא", u: "https://www.chabad.org/therebbe/article_cdo/aid/3316536/jewish/10-Sivan.htm" },
      { t: "קצוץ לי את הצד השמאלי", d: "אדמו\"ר הרש\"ב סיפר (כפי שמסר בנו, אדמו\"ר הריי\"צ) על ר' יקותיאל ליעפלער, שהיה איש פשוט, אבל מסר את עצמו לאדמו\"ר הזקן בכל עצמותו. פעם טיפס אל חדרו של הרבי בקומה העליונה בצעקה: 'רבי, קצוץ לי את הצד השמאלי!'. אחר כך נכנס ליחידות ודיבר מה שדיבר, ואדמו\"ר הזקן השיב: 'ריבונו של עולם, \"ואתה מחיה את כולם\" כתיב'. מאז התחיל ר' יקותיאל לחיות חיים רוחניים ממש, וראה גילוי אור במוחש. אדמו\"ר הרש\"ב הוסיף: זה היה בדרך מתנה מן הרבי; אבל צריך להגיע לאור בכוח עצמו, בעבודה מסודרת, משלב לשלב. לקח: הצד השמאלי שבלב הוא משכן הנפש הבהמית, ור' יקותיאל רצה שיהיה כולו לקדושה – וזו כוונת פרק ט, שהנפש האלוקית תמשול בעיר הקטנה לבדה.", s: "ספר השיחות תרצ\"א, שבת פרשת חוקת-בלק, י\"ב תמוז (ספר השיחות תרפ\"ח–תרצ\"א, עמ' 251)", u: "https://pnimi.org/page/4301600451" },
      { t: "לא שנים של איכר", d: "כשרצה אדמו\"ר הזקן לברך את ר' יקותיאל ליעפלער בעשירות, אמר שאינו רוצה בזה, שלא תטריד אותו העשירות מלימוד החסידות ומן העבודה. וכשרצה לברכו באריכות ימים, אמר: 'אבל לא בשנים של איכר – \"עיניים להם ולא יראו, אוזניים להם ולא ישמעו\" – שאין רואים אלוקות ואין שומעים אלוקות'. לקח: רצון הנפש האלוקית, כמבואר בפרק ט, הוא שכל החיים – לא רק מספר השנים – יהיו של אלוקות.", s: "היום יום, ו' מרחשון; אגרות קודש אדמו\"ר הריי\"צ, אגרת 1794, חלק ו, עמ' 334", u: "https://www.chabad.org/therebbe/article_cdo/aid/3317965/jewish/6-Cheshvan.htm" }
    ]
  },
  10: {
    title: "פרק י'",
    summary: "כשאדם מגביר את הנפש האלוקית ונלחם בבהמית עד שמגרש ומבער את הרע מחלל השמאלי – הוא נקרא צדיק. צדיק גמור הפך את הרע שבו לטוב לגמרי, ואוהב את ה' באהבה בתענוגים. צדיק שאינו גמור – 'צדיק ורע לו' – נשאר בו רע מועט, בטל ברוב הטוב. מדרגות הצדיקים רבות, ו'בני עלייה' הם מועטים.",
    stories: [
      { t: "למה ה' לא נראה אליי?", d: "כשהיה אדמו\"ר הרש\"ב ילד בן ארבע או חמש, נכנס בשבת פרשת וירא אל סבו, הצמח צדק, והתחיל לבכות: 'מפני מה נראה ה' אל אברהם אבינו, ואלינו אינו נראה?' ענה לו הצמח צדק: 'כשיהודי צדיק, בן תשעים ותשע, מחליט שעליו למול את עצמו – הוא ראוי שהקב\"ה יתגלה אליו'. לקח: געגועים לאלוקות אינם מספיקים; הגילוי בא אחרי עבודה ומסירות של הצדיק.", s: "היום יום, ט' מרחשון", u: "https://www.chabad.org/therebbe/article_cdo/aid/3317978/jewish/9-Cheshvan.htm" },
      { t: "הבכי שפרץ מאליו", d: "אדמו\"ר הרש\"ב אמר בשיחה: כל יהודי בוכה בערב יום הכיפורים במנחה, אבל זקוק לשם כך להכנה – נזכר שהוא יהודי ושעכשיו ערב יום הכיפורים, ואז פורץ בבכי. 'אבל במו עיניי ראיתי אחד שהבכי התפרץ אצלו מאליו, בלי כוונה – היה זה אבי'. אדמו\"ר המהר\"ש לא היה 'איש של בכי', ובכל זאת, באמצע שיחה על דברים שאין להם קשר לבכי, ואף כשחייך, היה מתפרץ ממנו בכי מתוך תוך פנימיות נקודת הלב, בלי שום הכנה – 'משום שהיה בדוגמא שלמעלה, וכיוון שלמעלה היה אז זמן בכייה, התפרץ אצלו הבכי'. לקח: אצל צדיק, רגשות הלב עצמם מכוונים לפי מה שלמעלה.", s: "ספר השיחות תורת שלום (שיחות אדמו\"ר הרש\"ב), שיחת שמחת תורה תרס\"א, סעיף ו; בתרגום ללשון הקודש בגליון 'מעיינותיך' (באתר תורת חב\"ד)", u: "https://toratchabad.com/%D7%91%D7%93%D7%A8%D7%9B%D7%99-%D7%94%D7%A2%D7%91%D7%95%D7%93%D7%94-%D7%94%D7%A4%D7%A0%D7%99%D7%9E%D7%99%D7%AA" },
    ]
  },
  11: {
    title: "פרק י\"א",
    summary: "יש מדרגות שונות ב'רשע וטוב לו', שהטוב שבנפשו האלוקית כפוף לרע. יש מי שחוטא לעתים רחוקות ומיד מתחרט, כי הטוב שבו עדיין מתעורר; ויש מי שחטאיו רבים יותר, ועדיין מתעוררים בו לפעמים הרהורי תשובה – עד 'רשע ורע לו', שאין בו חרטה כלל.",
    stories: []
  },
  12: {
    title: "פרק י\"ב",
    summary: "הבינוני הוא מי שהרע שבו לעולם אינו גובר לעשות מעשה, לדבר או לחשוב בניגוד לרצון ה'. בשעת התפילה הרע כפוף ובטל, ואחר כך 'המוח שליט על הלב בתולדתו'. עולות בו תאוות ומחשבות זרות, אבל הוא דוחה אותן מיד; וכעס או שנאה אינו מניח שיבואו לידי מעשה או דיבור – אדרבה, הוא מתנהג בחסד.",
    stories: [
      { t: "שישים ושבע שנה", d: "אדמו\"ר הריי\"צ סיפר שבימי ילדותו, כשהיה מסתובב בחדרו של החסיד ר' הענדל, שמע פעם את החסיד המלמד ר' אהרן קוגל מדוקשיץ אומר לר' הענדל: אתה קם בבוקר, אומר 'מודה אני' – וכבר אתה בוכה? הרי אתה בעל מוחין קטן ובעל מדות גדול; אילו בכית בקריאת שמע שעל המטה, אחרי יום שלם שבו עושים דברים שאין לעשותם ואין עושים את מה שצריך – מילא; אבל מה אתה בוכה כבר ב'מודה אני' של הבוקר? ענה לו ר' הענדל: איני בוכה, אלא שלבי נלחץ. כבר שישים ושבע שנה שהוא – נפש הבהמית – מייסר אותי. עבר יום, ונדמה שהשיג את מבוקשו, וכשהלכתי לישון חשבתי שהנה הוא כבר יפגור; ורק בא הבוקר – והוא שוב כאן. הוא אינו מניח לי לומר 'מודה אני' כפי שיהודי צריך לומר, ואת זה איני יכול לשאת – ולכן לבי נלחץ ובוכה. לקח: אצל הבינוני הרע שבנפש הבהמית אינו מסתלק; גם אחרי יום שלם שבו לא נתן לו לשלוט, הוא חוזר ומתעורר בכל בוקר מחדש, והבינוני דוחה אותו שוב ושוב – כל ימיו.", s: "ספר השיחות תש\"ח, יום א' דחג הסוכות תש\"ח בסעודה, סעיף ב (ספר השיחות תש\"ו–ה'שי\"ת, עמ' 167)", u: "https://pnimi.org/page/4301620363" }
    ]
  },
  13: {
    title: "פרק י\"ג",
    summary: "'בינונים – זה וזה שופטן'. אצל הבינוני הרע שבחלל השמאלי לא נעקר, רק אינו בא לידי מעשה; לכן אומרים לאדם 'היה בעיניך כרשע' – שלא יחשוב את עצמו לצדיק. ואף על פי שאהבת ה' שמרגיש בתפילה עוברת אחריה, אין היא שקר – היא אמת לפי מדרגתו.",
    stories: [
      { t: "ברח החסיד – בא החסיד", d: "באחת מאגרותיו מתאר אדמו\"ר הריי\"צ את ר' יקותיאל ליעפלער, חסיד של אדמו\"ר הזקן. היה לו ביטוי: 'חסיד אוציאק' – החסיד ברח, ו'חסיד פרישאל' – החסיד בא. כשהחסיד 'ברח', היה עצוב מאוד, ומתפלל מהר מאוד, כשהוא מראה באצבעו בסידור מילה אחר מילה. וכשהחסיד 'בא', היו פניו מאירות, והוא רקד מעט והתפלל בלהט. היו זמנים, כשהחסיד 'בא', שהתפלל שחרית, מנחה ומעריב זו אחר זו, בלי זמן להפסיק ביניהן, ולא אכל מעת לעת, באומרו שהרבי בירך אותו באריכות ימים, ולכן יוכל לחיות ולהיות בריא גם בלי לאכול. אדמו\"ר הריי\"צ מוסיף שזהו סדרו של חסיד 'מקיפי', לעומת ר' משה ווילענקער, החסיד ה'פנימי', שעבודתו הייתה רצופה, בלי 'החסיד ברח' ו'החסיד בא'. לקח: אצל הבינוני ההתעוררות באה והולכת; ובכל זאת, ה'חסיד שבא' בשעת התפילה הוא אמת לפי מדרגתו.", s: "היום יום, א' כסלו; אגרות קודש אדמו\"ר הריי\"צ, חלק ד, אגרת א'קטו, עמ' תקמא–תקמב", u: "https://www.chabad.org/therebbe/article_cdo/aid/3318094/jewish/1-Kislev.htm" },
      { t: "לא צדיק ולא בינוני", d: "החסיד הישיש ר' אבא דוד ('אתכסיא') סיפר על חגיגת ל\"ג בעומר תר\"ד בליובאוויטש: הגאון ר' יצחק אייזיק מהומיל הוכיח את ר' הלל מפאריטש על שהוא מרבה בהידורים וזהירות יתרה, ואמר שעיקר העבודה הוא דרך הממוצע. ר' הלל התנצל מאוד שאינו עושה זאת מתוך יוהרה, ומתוך בכי רב סיפר את תולדות חייו. כשחזר אדמו\"ר הזקן בשנת תקע\"א מנסיעתו לוואהלין, נתקבצו אליו אלפים, ובאחד מבתי המלון, בין כחמישים מניינים, שמע ר' הלל – שלא ראה את פני אדמו\"ר הזקן, רק שמע את קולו – מאמר על 'לעולם ירגיז אדם יצר טוב על יצר הרע'. מורו, ר' זלמן זעזמער, ביאר לו: האדם בטעותו חושב את עצמו לבעל מדרגה; אבל כשבודק את עצמו בכל פרטי דעותיו ומידותיו, הוא מכיר את חסרונותיו, ומי שהוא באמת 'אדם' יודע שאינו במדרגת צדיק, ולא במדרגת בינוני, אלא הלוואי שיהיה ירא חטא ויזכור תמיד את יום המיתה. שלוש שנים, סיפר ר' הלל, נקרו בו הדברים, ובמשך השנים האלה עבד על גופו ואבריו שיהיו 'טוב באמת' – ולא רק 'צודק'. לקח: 'היה בעיניך כרשע' של פרק יג – גם חסיד גדול כר' הלל אינו מחזיק את עצמו אפילו לבינוני.", s: "ספר השיחות תש\"ו–ה'שי\"ת, הוספות, רשימה, עמ' 414–418", u: "https://pnimi.org/page/4301620654" }
    ]
  },
  14: {
    title: "פרק י\"ד",
    summary: "מדת הבינוני היא מדת כל אדם, ואחריה ראוי לכל אדם לרדוף – כי כל אחד יכול בכל עת להיות בינוני: לא לעשות רע במעשה, דיבור ומחשבה. אבל למאוס ברע לגמרי ולהפוך אותו לטוב – זו מדרגת הצדיק, שאינה בבחירתו של כל אחד. לכן אל יפול לבו כשאינו מגיע למדרגת צדיק, ובכל זאת עליו לעשות את שלו להרגיל את עצמו למאוס ברע.",
    stories: [
      { t: "מהרפש כבר יצאנו", d: "בשמחת תורה, בבית מדרשו של רבי מנחם מנדל מויטבסק, חיכו החסידים שעה ארוכה להקפות, והרבי לא יצא מחדרו. כשהפצירו בו, אמר שמן השמים גילו לו מאה פירושים בפסוק 'אתה הראת', וכיוון שעדיין לא הגיע לאותן מדרגות בעבודתו, אינו יכול לאמרו. אדמו\"ר הזקן, שהיה שם, יעץ לחסידים לומר לרבי שהואיל והם קיבלו אותו לרבי, עליו לומר את ההקפות; ואם יסרב – שיזמינו אותו לדין תורה, והוא, אדמו\"ר הזקן, יהיה הדיין. רבי מנחם מנדל הסכים לדין. אדמו\"ר הזקן פסק נגדו: ראשית, אי אפשר להגיע אל האופק – ככל שמתקדמים, רואים רחוק יותר. ושנית, סיפר משל: זוג גר למרגלות הר, ומי השופכין זרמו אל פתח ביתם. החליטו לבנות בית במעלה ההר, וטיפסו עד שכלו כוחותיהם. הבעל בכה: 'לעולם לא נגיע לפסגה'. ענתה לו אשתו: 'איננו צריכים להגיע לפסגה – די שיצאנו מן הרפש; נבנה כאן את ביתנו'. 'גם אנחנו', אמר אדמו\"ר הזקן, 'מן הרפש כבר יצאנו – בימים הנוראים נפרדנו מן החטאים'. רבי מנחם מנדל קיבל את הפסק ויצא לומר את פסוקי ההקפות. לקח: לא כל אחד יגיע לפסגה של מדרגת הצדיק; אבל לצאת מן הרפש – מדת הבינוני – אפשרי לכל אחד, וזה מספיק כדי לשמוח.", s: "רשימות דברים, חלק ד, עמ' קנט (וכן סיפורי חסידים – מועדים, סיפור 217)", u: "https://toratchabad.com/%D7%A1%D7%99%D7%A4%D7%95%D7%A8%D7%99%D7%9D-%D7%A2%D7%9C-%D7%90%D7%93%D7%9E%D7%95%D7%A8-%D7%94%D7%96%D7%A7%D7%9F" },
      { t: "לזמר את 'הבינוני'", d: "בחג הפסח תש\"ח ביקש אדמו\"ר הריי\"צ לנגן את הניגון הנקרא 'דער בינוני', והמסובים לא הצליחו להיזכר בתחילתו. אמר הרבי: 'כשלא לומדים חסידות, או כשלומדים עם ביאורים מהמצאה עצמית ואין עוסקים בעבודה של בירור ותיקון המידות – קשה, ובאמת בלתי אפשרי, להיות בינוני. אבל לזמר את \"הבינוני\" – זה לא צריך להיות קשה'. לקח: פרק יד מלמד שמדת הבינוני היא מדת כל אדם – אבל היא באה רק מתוך לימוד ועבודה, לא מעצמה.", s: "ספר השיחות תש\"ח, שיחות חג הפסח, סעיף ה (ספר השיחות תש\"ו–ה'שי\"ת, עמ' 201)", u: "https://pnimi.org/page/4301620404" }
    ]
  },
  15: {
    title: "פרק ט\"ו",
    summary: "'עובד אלוקים' הוא מי שנלחם עם יצרו ומשנה את טבעו, ו'אשר לא עבדו' הוא מי שאינו נלחם. גם מי שלומד הרבה, אם כך הורגל מטבעו, אינו נקרא 'עובד' עד שיוסיף על הרגלו – כמשל השונה פרקו מאה פעמים לעומת מאה ואחת.",
    stories: [
      { t: "לאבד את ה'מהרה'", d: "בימי נעוריו נהג אדמו\"ר הזקן ללמוד שעות ארוכות בבית המדרש של סבו, ר' משה פוזנר. פעם הבחין בלומד שקורא בספר במהירות רבה; ניכר שהבין היטב, אבל החיפזון לא מצא חן בעיניו. 'מדוע אתה ממהר כל כך?' שאל. 'מהיר אני בטבעי', התנצל הלומד. 'אם כך, עליך לשנות את הטבע'. 'איני יכול לשנות את טבעי'. השיב לו: 'לכל יהודי יש נשמה, שנותנת לו כוח לשנות את טבעו בדרך של קבלת עול. תחילה תרכוש הרגל חדש, ועם הזמן ההרגל יהפוך לטבע שני'. והוסיף: כתוב 'ואבדתם מהרה מעל הארץ הטובה' – 'ארץ' מלשון רצון; כשה' נותן לאדם חשק בלימוד, עליו 'לאבד את המהרה' – ללמוד במתינות. לימים נעשה הלומד חסיד של אדמו\"ר הזקן. לקח: 'עובד אלוקים' הוא מי שאינו מסתפק בטבעו, אלא משנה אותו מתוך קבלת עול.", s: "ספר השיחות קיץ ת\"ש, עמ' 59", u: "https://toratchabad.com/%D7%A1%D7%99%D7%A4%D7%95%D7%A8%D7%99%D7%9D-%D7%A2%D7%9C-%D7%90%D7%93%D7%9E%D7%95%D7%A8-%D7%94%D7%96%D7%A7%D7%9F" },
      { t: "משכיל ועובד", d: "אדמו\"ר הריי\"צ סיפר בשם אביו: בחנוכה תרי\"ד שהו ר' אייזיק מהומיל ור' הלל מפאריטש כמה שבועות בליובאוויטש. הצמח צדק אמר אז מאמרים רבים, ובנו, אדמו\"ר המהר\"ש, הלך לפי הוראתו לשמוע את חזרתם של שני החסידים. פעם ציווה הצמח צדק על בנו לחזור לפניו את המאמרים כפי ששמעם מהם, ואמר: 'ר' אייזיק הוא משכיל, ור' הלל הוא עובד'. כעבור כמה ימים שאל המהר\"ש: הרי המשכיל הוא עובד, והעובד הוא משכיל? הצמח צדק לא ענה. כעבור שבוע אמר מאמר במיוחד לבניו ולשני החסידים, ובאמצע הלילה שלח את המהר\"ש לראות מבעד לחלון מה הם עושים. ר' אייזיק ישב מהורהר, ראשו שמוט, עיניו עצומות ופניו בוערות. ר' הלל ישב כפוף, אצבעו בפיו ופניו חיוורות מאוד, כאדם מודאג. אמר הצמח צדק: שניהם מהרהרים במאמר של אתמול; אלא שר' אייזיק מתבונן בעניין 'תלת ראשין' שבכתר עליון, ור' הלל מתבונן בעניין מעלת הקבלת עול, שבגללה תהיה תכלית העלייה בספירת המלכות – וחושב על עצמו. לקח: 'עובד אלוקים' של פרק טו הוא מי שההשכלה מובילה אותו מיד לחשבון ולעבודה עם עצמו.", s: "קונטרס י\"ב תמוז תש\"ח, עמ' 24 (שיחת אדמו\"ר הריי\"צ) – בתרגום בגליון 'מעיינותיך' (באתר תורת חב\"ד); וראה ספר השיחות תש\"ו–ה'שי\"ת, הוספות, עמ' 418 והערה 66 שם", u: "https://toratchabad.com/%D7%94%D7%AA%D7%97%D7%9C%D7%AA-%D7%A0%D7%A9%D7%99%D7%90%D7%95%D7%AA%D7%95-%D7%A9%D7%9C-%D7%94%D7%A6%D7%9E%D7%97-%D7%A6%D7%93%D7%A7" }
    ]
  },
  16: {
    title: "פרק ט\"ז",
    summary: "עיקר העבודה הוא שהשכל ישלוט על המידות. גם כשהאהבה וההתבוננות אינן מתגלות בהתפעלות הלב, די בכך שהן נמצאות במוח ובתבונה וברצון הלב ('רעותא דליבא'), ומביאות את האדם לעסוק בתורה ובמצוות; וזו היא 'דחילו ורחימו' שהן הכנפיים שמעלות את המצוות.",
    stories: [
      { t: "שלוש שנים ושבע שנים", d: "אדמו\"ר הזקן אמר על החסיד ר' משה ווילענקער: למשה יש מוחין דגדלות, ובעשר השנים שעמל – עמל והשיג מוחין רחבים. שלוש שנים התכונן ר' משה ווילענקער ליחידות אצל אדמו\"ר הזקן, ולאחר מכן נשאר שבע שנים בליאזנא כדי להביא את היחידות לידי עבודה בפועל. לקח: ההתבוננות וההשגה, גדולות ככל שיהיו, אינן התכלית; עיקרן שיביאו את האדם לידי מעשה – שהשכל שבמוח ורעותא דליבא יתלבשו בעבודה בפועל.", s: "היום יום, י\"ח תמוז", u: "https://pnimi.org/page/3701350254" }
    ]
  },
  17: {
    title: "פרק י\"ז",
    summary: "'כי קרוב אליך הדבר מאד, בפיך ובלבבך לעשותו': כל אדם יכול להרגיל את מוחו לשלוט על לבו ולהוליד מן ההתבוננות אהבה ויראה לפחות במוחו, ולעשות על פיהן. ומי שלבו אטום – יכול לעורר את האהבה הטבעית המסותרת שבלב כל ישראל.",
    stories: [
      { t: "יד על הלב", d: "אדמו\"ר הריי\"צ סיפר (בליל א' דחג הסוכות תרפ\"ז) שאדמו\"ר הצמח צדק אמר שאצל הצעירים שבתלמידי אדמו\"ר הזקן היה המוח שליט על הלב גם בגשמיות, וסיפר על החסיד ר' משה מייזליש: בעת המלחמה היה ר' משה אצל נפוליאון, והיה כמרגל שמעביר משם ידיעות. פעם עמד ליד נפוליאון כשזה שכב על הארץ על גבי מפה ועשה תכנית לסדר מהלך המלחמה, ור' משה, שעמד שם ומקלו בידו, רשם בציפורנו על המקל את כל התכנית. נפוליאון הרגיש בדבר, וכדי לאמת את חשדו הניח מיד את ידו על לבו של ר' משה, להרגיש אם הוא מפחד – ולא הרגיש מאומה. לקח: מי שהרגיל את מוחו לשלוט על לבו, שלטונו מגיע גם למקום שבו הלב היה אמור להתפעל ולגלות אותו; ודבר זה 'קרוב אליך מאד' – כי הוא תלוי בהרגל ובעבודת המוח.", s: "ספר השיחות תרפ\"ז, ליל א' דחג הסוכות תרפ\"ז, סעיף ד (ספר השיחות תר\"פ–תרפ\"ז, עמ' 111–112)", u: "https://pnimi.org/page/4301580189" }
    ]
  },
  18: {
    title: "פרק י\"ח",
    summary: "גם מי שדעתו קצרה, קרוב אליו הדבר מאד, בזכות האהבה המסותרת שבלב כל ישראל, שהיא ירושה מן האבות. בבחינת החכמה שבנפש מלובש אור אין סוף, והיא למעלה מן השכל וההשגה; לכן כל ישראל מאמינים, ואפילו קל שבקלים מוסר נפשו על קדושת ה' ואינו יכול לכפור בה' אחד.",
    stories: [
      { t: "הנשמה שומעת", d: "החסיד ר' הלל מפאריטש שאל את אדמו\"ר האמצעי אם עליו לחזור דברי חסידות גם בעיירות שאנשיהן אין להם שום מושג בחסידות. ענה לו אדמו\"ר האמצעי: דברי חסידות – הנשמה שומעת אותם. וכתוב 'ונוזלים מן לבנון' – לבנון: ל\"ב נו\"ן, חכמה ובינה שבנשמה. וכאשר הנשמה שומעת, הדבר נוזל ונוטף בהארת הנשמה המחיה את הגוף, ונעשה חיזוק ב'ועשה טוב' של רמ\"ח מצוות עשה וב'סור מרע' של שס\"ה מצוות לא תעשה. לקח: גם מי שאין לו שום מושג בחסידות – הנשמה שבו, בבחינת החכמה שבה, שומעת ומרגישה אלוקות למעלה מן השכל וההשגה; ומשם נמשך חיזוק בפועל בקיום המצוות.", s: "היום יום, כ\"ד אדר א'", u: "https://pnimi.org/page/3701350322" },
      { t: "התואר: יהודי", d: "בחודש אדר ראשון תרפ\"ז נסע אדמו\"ר הריי\"צ ברכבת לילה ממעונו בלנינגרד למוסקבה. בבוקר ביקש נוסע מן התא השכן להכיר אותו – מארק סמיונוביץ' באשקוב, יושב ראש מועצת השלטון בצ'ליאבינסק וחבר הגפ\"או – ונכנס כשראשו מכוסה בכובע. אמר הרבי: שמי יוסף יצחק שניאורסאהן. שאל באשקוב: והתואר שלכם? ענה: 'איד' – יהודי. אמר באשקוב: כל ישראל יהודים הם, ואיזה תואר הוא זה? השיב הרבי: כן הדבר, כל ישראל יהודים, וזהו התואר האמיתי שלהם שאינו עובר ואינו מתחלף. כל התארים – אם בעליהם חוטאים, הם מאבדים את התואר; ואילו את התואר 'יהודי' גם החוטא אינו מאבד, כמאמר 'ישראל אף על פי שחטא ישראל הוא', כי נקודת היהדות – ה'פינטעלע איד' – נשארת לעד. אלא שיש בזה דרגות: יש מי שרק אוהב את עמו, מכבד את חכמת ישראל ואת תורת ישראל, מוקיר את מצוות ה' ומחבב את מנהגי ישראל; ויש מי שמוכן למסור את נפשו בפועל על קיום אחד ממנהגי ישראל, ומכל שכן על קיום מצות עשה או כדי שלא לעבור על מצות לא תעשה – וכל זה פעולתה של נקודת היהדות, אלא שהתגלותה תלויה על פי רוב בחינוך ובמאורעות השונים שבדרכי החיים. באשקוב סיפר שהוא יליד אורשא, שהוריו וכל משפחתם היו חסידי ליובאוויטש, ושאבות אבותיו נסעו לליובאוויטש כבר לפני כמאה שנה, וביקש לבקר את הרבי שוב. לקח: האהבה המסותרת היא ירושה שאינה נפסקת – גם החוטא אינו מאבד אותה, והיא מסוגלת להביא עד מסירות נפש בפועל; אם אינה נראית, אין זה משום שאינה, אלא משום שעדיין לא נתגלתה.", s: "רשימת אדמו\"ר הריי\"צ מנסיעתו למוסקבה, אדר ראשון תרפ\"ז (ספר השיחות תר\"פ–תרפ\"ז, 'ספר השיחות תרפ\"ז – רשימה', עמ' 133–134)", u: "https://pnimi.org/page/4301580216" }
    ]
  },
  19: {
    title: "פרק י\"ט",
    summary: "הנשמה היא 'נר ה'': כמו להבת הנר הנמשכת תמיד למעלה, כך הנפש חפצה בטבעה להיפרד מן הגוף ולהיכלל במקורה. אהבה זו כוללת גם יראה – שלא להיפרד מאחדות ה' אפילו בדיבור או במעשה של כפירה. אבל היא יכולה להיות 'בגלות' בנפש, כשה'רוח שטות' מכסה עליה.",
    stories: [

function renderChapters() {
  const el = document.getElementById('chapters');
  el.innerHTML = '';
  Object.keys(data).forEach(num => {
    const btn = document.createElement('button');
    btn.className = 'chap-btn';
    btn.dataset.num = num;
    btn.textContent = data[num].title;
    btn.onclick = () => showChapter(num);
    el.appendChild(btn);
  });
}

function renderSource(s) {
  if (!s.s) return '';
  const link = s.u ? ` – <a href="${s.u}" target="_blank" rel="noopener">לצפייה במקור</a>` : '';
  return `<div class="source"><strong>מקור:</strong> ${s.s}${link}</div>`;
}

function showChapter(num) {
  document.querySelectorAll('.chap-btn').forEach(b => b.classList.toggle('active', b.dataset.num === String(num)));
  const c = data[num];
  const content = document.getElementById('content');
  const stories = c.stories.length
    ? c.stories.map(s => `<div class="story"><h3>${s.t}</h3><p>${s.d}</p>${renderSource(s)}</div>`).join('')
    : '<div class="empty">סיפורים לפרק זה יתווספו בקרוב.</div>';
  content.innerHTML = `<div class="summary"><strong>תקציר:</strong> ${c.summary}</div>${stories}`;
}

renderChapters();
showChapter(1);
