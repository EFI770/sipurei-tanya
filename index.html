function renderChapters() {
  const el = document.getElementById('chapters');
  el.innerHTML = '';
  Object.keys(data).forEach(num => {
    const btn = document.createElement('button');
    btn.className = 'chap-btn';
    btn.textContent = data[num].title;
    btn.onclick = () => showChapter(num);
    el.appendChild(btn);
  });
}

function showChapter(num) {
  document.querySelectorAll('.chap-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const c = data[num];
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="summary"><strong>תקציר:</strong> ${c.summary}</div>
    ${c.stories.map(s => `<div class="story"><h3>${s.t}</h3><p>${s.d}</p></div>`).join('')}
  `;
}

renderChapters();
showChapter(1);
</script>
