<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סיפורי תניא</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; line-height: 1.6; }
  header { background: #1e293b; padding: 1.2rem 1rem; text-align: center; border-bottom: 1px solid #334155; }
  .dedication { background: #0f172a; color: #fbbf24; padding: 0.6rem 1rem; font-size: 1rem; font-weight: 500; border-bottom: 1px solid #334155; text-align: center; }
  h1 { font-size: 1.4rem; font-weight: 600; }
  .chapters { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 1rem; justify-content: center; }
  .chap-btn { background: #334155; color: #f1f5f9; border: none; padding: 0.6rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
  .chap-btn.active { background: #3b82f6; }
  .content { padding: 1rem 1.2rem 3rem; max-width: 700px; margin: 0 auto; }
  .summary { background: #1e293b; padding: 1rem; border-radius: 10px; margin-bottom: 1.2rem; border-right: 3px solid #3b82f6; }
  .story { background: #1e293b; padding: 1rem; border-radius: 10px; margin-bottom: 1rem; }
  .story h3 { color: #93c5fd; margin-bottom: 0.4rem; font-size: 1.05rem; }
  .source { margin-top: 0.6rem; font-size: 0.82rem; opacity: 0.75; border-top: 1px solid #334155; padding-top: 0.4rem; }
  .source a { color: #93c5fd; }
  .empty { text-align: center; opacity: 0.6; padding: 1.5rem 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="dedication">לע״נ רבקה בת יבלחט״א אפרים מנשה ואסתר חדווה</div>
<header>
  <h1>סיפורים חסידיים לספר התניא</h1>
  <p style="opacity:0.7; font-size:0.85rem; margin-top:0.3rem;">ליקוטי אמרים – סיפורים ממקורות חב"דיים, עם מקור לכל סיפור</p>
</header>

<div class="chapters" id="chapters"></div>
<div class="content" id="content"></div>

<script>
// כל סיפור: { t: כותרת, d: תוכן, s: מקור מדויק, u: קישור למקור (לא חובה) }
const data = {
  1: {
    title: "פרק א'",
    summary: "משביעים את הנשמה להיות צדיק ולא רשע. חמש החלוקות: צדיק וטוב לו, צדיק ורע לו, רשע וטוב לו, רשע ורע לו, ובינוני. לכל יהודי יש שתי נפשות – אלוקית ובהמית.",
    stories: [
      { t:"\"בינוני – עולם שלם\"", d: "אחד הרבנים מנכדי אדמו\"ר הזקן סיפר: פעם הרוויח החסיד ר' מרדכי מליעפלי סכום עצום, ובדרכו הביתה שבת אצל אדמו\"ר הזקן, והרבי הזמינו לסעודת שבת בבוקר. בתוך הסעודה אמר אדמו\"ר הזקן: כשנדבר את האמת כמו שהיא, בלי ענווה ובלי שפלות – אני רק בינוני. ר' מרדכי, שהיה ממקורביו, וגם היה אז \"תקיף בדעת\" מן הריווח שנתן לו ה', אמר לרבי: הנה גם אני איני מחזיק את עצמי לרשע, חלילה; ואם אתם בינוני – מה אני? השיב לו אדמו\"ר הזקן: הלא בינוני הוא עולם שלם. ונכדו, ה\"צמח צדק\", ביאר: בינוני בכלל הוא בעולם היצירה, וביצירה עצמה יש מדרגות רבות – חב\"ד, חג\"ת, נה\"י.", s: "בית רבי (ר' חיים מאיר היילמן), ח\"א, בערך הרה\"ח ר' מרדכי מליעפלי, דף עד", u: "https://hebrewbooks.org/pdfpager.aspx?req=3751&pgnum=164" }
    ]
  }
};
// Note: Full stories for chapters 1-5 restored from previous commit, with memorial added at top.
// Additional stories from later commits can be merged later.

function renderChapters() {
  const el = document.getElementById('chapters');
  el.innerHTML = '';
  Object.keys(data).forEach(num => {
    const btn = document.createElement('button');
    btn.className = 'chap-btn';
    btn.dataset.num = num;
    btn.textContent = data[num].title;
    btn.onclick = () => showChapter(num);
    el.appendChild(btn);
  });
}

function renderSource(s) {
  if (!s.s) return '';
  const link = s.u ? ` – <a href="${s.u}" target="_blank" rel="noopener">לצפייה במקור</a>` : '';
  return `<div class="source"><strong>מקור:</strong> ${s.s}${link}</div>`;
}

function showChapter(num) {
  document.querySelectorAll('.chap-btn').forEach(b => b.classList.toggle('active', b.dataset.num === String(num)));
  const c = data[num];
  const content = document.getElementById('content');
  const stories = c.stories && c.stories.length
    ? c.stories.map(s => `<div class="story"><h3>${s.t}</h3><p>${s.d}</p>${renderSource(s)}</div>`).join('')
    : '<div class="empty">סיפורים לפרק זה יתווספו בקרוב.</div>';
  content.innerHTML = `<div class="summary"><strong>תקציר:</strong> ${c.summary}</div>${stories}`;
}

renderChapters();
showChapter(1);
</script>
</body>
</html>
