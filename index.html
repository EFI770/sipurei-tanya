      { t:"בפעם השש עשרה", d: "באותה הקדמה מספרים בני אדמו\"ר הזקן, שכבר בהיותו בן שמונה עשרה למד את כל התלמוד עם ספרי הראשונים והאחרונים, ובהיותו בן שלושים חזר על כל התלמוד עם כל הראשונים והאחרונים שש עשרה פעמים. \"כאשר שמענו מפה קדוש\", בהיותו בעיר מאהליב שעל נהר דניסטר חזר על כל התלמוד בפעם השש עשרה בעמידה, לילה ויום, ולא פסק פיו מגירסא, \"כאשר עיני הכל ראו\". אז התחיל להגיה ולחדש בשולחן ערוך שלו, החל מהלכות נטילת ידיים.", s: "הקדמת בני המחבר לשולחן ערוך אדמו\"ר הזקן (מובאת גם בבית רבי, ח\"א, פרק ג, עמ' 7)", u: "https://www.chabadlibrary.org/books/11200019492" },
      { t:"הלכות בטעמיהן", d: "אדמו\"ר האמצעי כותב בהקדמתו לשולחן ערוך של אביו: \"לא פעם ושתים שמעתי מפי רוח קדשו\", שאם יגמור ה' בעדו, יצווה על כל אנ\"ש, מגדולם ועד קטנם, בכל עיר ומניין, לקבוע עתים בחבורות ללמוד הלכות בטעמיהן ולהיות בקיאים בהן, עד שכל הלכה תהא שגורה בפיהם. ועל זה, הוא מוסיף, אמרו חז\"ל \"השונה הלכות בכל יום מובטח לו שהוא בן העולם הבא\" – הלכות בטעמיהן הברורים למעשה, \"שזהו אמיתית גלוי רצון העליון\".", s: "הקדמת אדמו\"ר האמצעי לשולחן ערוך אדמו\"ר הזקן (קאפוסט תקע\"ו); נדפסה באגרות קודש אדמו\"ר האמצעי, אגרת כג", u: "https://www.chabadlibrary.org/books/11200019492" }
    ]
  },
  6: {
    title: "פרק ו'",
    summary: "כנגד הנפש האלוקית יש נפש מצד הקליפה והסטרא אחרא – 'זה לעומת זה'. גם היא כלולה מעשר בחינות טמאות (שלוש שכליות ושבע מידות רעות) ומתלבשת בשלושה לבושים: מחשבה, דיבור ומעשה של רע. כל מה שאינו בטל לה' ומרגיש עצמו דבר נפרד – נקרא 'סטרא אחרא', הצד האחר.",
    stories: [
      { t: "הבית בפוזנא", d: "אדמו\"ר הריי\"צ מביא בספר הזכרונות מעשה שסיפרה רחל, בתו של ר' ברוך מפוזנא, הנקרא 'ר' ברוך בטלן' (סבו של ר' ברוך, אבי אדמו\"ר הזקן). ר' ברוך בטלן גר שלושים שנה כדייר בבית ברחוב הפורטוגלי בפוזנא. הבית היה שייך לצורף הזהב אביגדור טוביה ולאשתו שרה גיטל. בעל הבית היה שיכור, משחק בקלפים ומרבה לנבל את פיו. אשתו עסקה בהכנסת אורחים, הכנסת כלה וסיוע ליולדות עניות, אך הרבתה בקללות. שניהם נתנו צדקה ביד רחבה. לאחר שנפטרו בלא ילדים, נשמעו מדירתם בכל ערב צווחות פראיות, צחוק של שיכורים, רקיעות רגליים ושירה גסה, ואיש מן השכנים לא יכול היה לעצום עין. ר' ברוך בטלן סיפר על כך לרבו, רבי יואל בעל שם מזאמושטש. רבי יואל הורה להפוך את הדירה לבית מדרש: להכניס לשם ספרי תורה, להתפלל בה שלוש פעמים ביום ולקבוע בה עתים לתורה. הרוחות ברחו מן הדירה, אך כעבור שישה שבועות השתכנו במרתף. רבי יואל בא אז בעצמו לפוזנא והזמין את בית הדין של העיר ל'דין תורה' עם המזיקים. נציגם טען שהבית שייך להם, כי הם נולדו ממחשבותיו ומעשיו הרעים של אביגדור טוביה ומקללותיה של שרה גיטל, ולכן הם יורשיהם. את הדירה שלמעלה, אמר, עזבו בגלל האור הגדול שבא עם ספרי התורה. בית הדין פסק שאין להם חלק בירושה. רבי יואל ציווה עליהם לעזוב את הבית, ומאז לא נראו עוד. לקח: לפי הסיפור, מן הקללות והמעשים הרעים נבראו מזיקים ממש, ורק אור התורה והקדושה גירש אותם.", s: "ספר הזכרונות לאדמו\"ר הריי\"צ (בתרגום ללשון הקודש), פרקים פ–פב; ובאנגלית: Lubavitcher Rabbi's Memoirs, vol. 2, ch. 33", u: "https://www.myascent.org/the-haunted-house/" },
      { t: "שיהיה ממך בצל", d: "חסיד אחד אמר לאדמו\"ר האמצעי שההצלחה שיש לו כשהוא חוזר חסידות לפני אחרים מזיקה לו, כי הוא נעשה בעל 'ישות'. אדמו\"ר האמצעי לא התרשם, ואמר לו: 'א ציבעלע זאל פון דיר ווערן, אבער חסידות זאלסטו חזר'ן' – גם אם ייעשה ממך בצל, חסידות תמשיך לחזור. לקח: הישות – הרגשת ה'אני' הנפרד – היא עניין של סטרא אחרא, אבל אין בה סיבה להפסיק לעשות טוב.", s: "אגרות קודש של הרבי, חלק ח, עמ' 288 (כמובא במגזין Derher, כסלו תשפ\"ד, הערה 14)", u: "https://derher.org/wp-content/uploads/Kislev-5784-3.pdf" },
      { t: "שבעים הפנים שמאחור", d: "זקני החסידים בוויטבסק מסרו מעשה מימי צעירותו של אדמו\"ר הזקן. ר' אלישע, למדן שחבריו כינוהו 'גאון הגאונים', פירש קטע במסכת עירובין שלא כפירוש רש\"י, והתרעם על כך שלא קיבלו את פירושו: הרי גם תוספות חולקים לעתים על רש\"י, והראב\"ד על הרמב\"ם, והרי 'שבעים פנים לתורה'. ר' אפרים, מחסידי הבעל שם טוב בוויטבסק, ענה לו בפשטות: 'כתוב \"כתובה פנים ואחור\". כשם שיש פנים, יש גם אחור. המחלוקות והפירושים של רש\"י ותוספות, של הרמב\"ם והראב\"ד – הם משבעים הפנים של התורה. הטענות והפירושים שלך – הם משבעים האחוריים של התורה'. אדמו\"ר הרש\"ב, שסיפר זאת, הסביר: כשלומדים בביטול, החידושים הם מן הפנים; כשלומדים בישות ובגאווה, החידושים הם מן האחוריים. לקח: גם בלימוד תורה, הרגשת עצמו כמציאות נפרדת היא 'צד אחר' שמסתיר את הקדושה.", s: "שיחת אדמו\"ר הרש\"ב לתלמידי תומכי תמימים, שמחת תורה תרס\"א ('כל היוצא למלחמת בית דוד'), בלקוטי דיבורים לאדמו\"ר הריי\"צ – בתרגום האנגלי, פרק 56", u: "https://www.chabad.org/library/article_cdo/aid/6279493/jewish/Chapter-56.htm" },
      { t: "חמץ ומצה", d: "עילוי מפורסם, בעל כשרון גדול ועמקן נפלא, בא לליאזנא ושקד בלימוד החסידות, ובזמן קצר רכש ידיעה רחבה בה. ביחידות הראשונה אצל אדמו\"ר הזקן שאל: 'רבי, מה חסר לי?'. ענה לו אדמו\"ר הזקן: 'אין חסר לך מאומה, כי ירא אלוקים אתה ולמדן, רק צריך אתה להוציא את החמץ, שהוא הישות וגסות הרוח, ולהכניס מצה, שהיא ביטול'. והוסיף שבעל גאווה 'דוחק רגלי השכינה', וכלי שהשתמשו בו בישות – כשנדמה לאדם שהיא אור – צריך ליבון, עד שהניצוצות ניתזים ונכללים באור האמיתי. לקח: הישות היא החמץ שבנפש – מה שתופח ומרגיש את עצמו – והתיקון הוא ביטול.", s: "היום יום, כ\"ז תמוז; אגרות קודש אדמו\"ר הריי\"צ, אגרת 1020, חלק ד, עמ' 333–334", u: "https://www.chabad.org/therebbe/article_cdo/aid/3316746/jewish/27-Tammuz.htm" },
      { t: "זיעה של מצוה", d: "כשאדמו\"ר הריי\"צ ניהל את ישיבת תומכי תמימים בליובאוויטש, ביקש להתקבל בחור מוכשר מאוד, שהייתה בו גסות שניכרה אפילו בתווי פניו. אדמו\"ר הרש\"ב הסכים לקבלו, וביקש מבנו לתת לו תשומת לב מיוחדת. לקראת פסח הורה הרש\"ב למסור לבחור את כל העבודה הקשה של אפיית המצות לתלמידים, שנעשתה בהידורים רבים. הבחור עבד בשמחה שבועות ארוכים, ובנוסף נצטווה ללמוד מאמר חסידות מורכב ולהסבירו. בסעודת אחרון של פסח אמר הרש\"ב לבנו: 'יוסף יצחק! ראה מה גדול כוחה של זיעה במצוה – לבחור הזה יש פנים אחרות לגמרי. הגסות נעלמה, והופיעו פנים של אדם'. לקח: הגסות של הקליפה אינה נעלמת מעצמה; היא מתבררת דרך עבודה ממשית בקדושה.", s: "לקוטי דיבורים (בתרגום האנגלי), חלק א, עמ' 259 ואילך – כמובא בביאור להיום יום כ\"ז תמוז באתר chabad.org", u: "https://www.chabad.org/therebbe/article_cdo/aid/3316746/jewish/27-Tammuz.htm" },
      { t: "במה אתה נחוץ", d: "אדמו\"ר הריי\"צ סיפר: חסיד בא לאדמו\"ר הזקן והתאונן על מצבו בפרנסה ובבריאות: הוא צריך שה' ישלח רפואה לו ולבני ביתו, הוא צריך פרנסה כדי לפרוע חובות, להשיא את ילדיו ולתקן את ביתו. ענה לו הרבי: 'אתה אומר מה שאתה צריך – ועל מה שצריכים אותך, אינך שואל!'. הרבי (אדמו\"ר מנחם מענדל) מוסיף באחד ממכתביו ששמע מחותנו, שכאשר תיקן החסיד את הנהגתו לפי ההוראה הזאת, הוטב מצבו, ועוד יותר מבתחילה. לקח: כשהאדם עסוק רק בעצמו ובצרכיו, הוא שוכח את התכלית שלשמה נברא; זו הנקודה שבה 'מציאות עצמו' עומדת מול עבודת ה'.", s: "ספר השיחות תש\"ג, עמ' 195; אגרות קודש של הרבי, חלק יא, אגרת ג'תקיא (כ\"ה אייר תשט\"ו)", u: "https://www.chabad.org/library/article_cdo/aid/2611382/jewish/Self-Concern.htm" }
    ]
  },
  7: {
    title: "פרק ז'",
    summary: "הנפש הבהמית שביהודי היא מקליפת נוגה, שיש בה טוב ורע. כל הדברים המותרים – אכילה, שתייה ועסקים – יונקים מנוגה. כשאדם אוכל כדי שיהיה לו כוח לעבוד את ה', המאכל עולה ונכלל בקדושה; ואם אוכל לתאוותו בלבד – הוא יורד זמנית לסטרא אחרא, עד שיחזור ויעבוד ה' בכוח זה.",
    stories: [
      { t: "למה אתה אוכל?", d: "פעם שיחקו בגן בניו הקטנים של אדמו\"ר המהר\"ש, הרז\"א והרש\"ב, והתווכחו על דברי המלמד, שבלקוטי תורה כתוב שיש הבדל בין טבע המידות של יהודי לטבע המידות של גוי. הרש\"ב, אז ילד בן חמש, לא הבין ולא האמין שיש הבדל כזה. קרא המהר\"ש למשרתו בנציון ושאלו: 'אכלת היום?' – 'כן'. 'אכלת טוב?' – 'מה פירוש טוב? שבע, ברוך השם'. 'ולשם מה אכלת?' – 'כדי לחיות'. 'ולשם מה אתה חי?' – 'כדי שאוכל להיות יהודי ולעשות מה שהקב\"ה רוצה', ונאנח. אחר כך ביקש המהר\"ש לקרוא לאיוואן הגוי, משרת החצר, ושאל אותו אותן שאלות. איוואן ענה שהוא אוכל כדי לחיות, וחי 'כדי שאוכל לשתות כוסית יי\"ש ולנשנש'. אמר המהר\"ש לבניו: 'רואים אתם: יהודי בטבעו אוכל כדי לחיות, וחי כדי להיות יהודי ולעשות מה שהקב\"ה מצווה. ועוד הוא נאנח, כי מרגיש שעדיין אינו עושה זאת באמת לאמיתו. והגוי חי בשביל השתייה והנשנוש, ומחייך, כי מצייר לעצמו את התענוג שבאכילה ושתייה, שזו התכלית בעיניו'.", s: "לקוטי דיבורים, חלק ג, עמ' תכא–תכב (שיחת ליל א' דחג הפסח תש\"ג, סעיף לט)", u: "https://www.chabad.org/parshah/article_cdo/aid/1062252/jewish/The-Origin-of-the-Jewish-Work-Ethic.htm" },
      { t: "סעודת שבת לשם שמים", d: "אדמו\"ר הריי\"צ סיפר, בסעודת יום ב' דראש השנה, ששמע מזקני החסידים: כשחזר אדמו\"ר הזקן ממזריטש, נכנס במוצאי שבת אל החסידים שישבו וחזרו על התורה ששמעו ממנו, ואמר: 'זקני' – הבעל שם טוב – 'גילה את מעלות הנשמות. וידוע המעשה: בשעה שישב עם תלמידיו בסעודת שבת, הראה להם כיצד רב אחד, גאון וצדיק שהיה במקום אחר, אוכל את סעודת השבת לשם שמים. ו'הרבי'' – המגיד ממזריטש – 'גילה את המעלות שבאלוקות'. לקח: גם אכילה גשמית, כשהיא לשם שמים, היא עניין של מעלת הנשמה.", s: "ספר השיחות תש\"ב, סעודת יום ב' דראש השנה, סעיף ב (מפי זקני החסידים, בשם אדמו\"ר הזקן)", u: "https://www.chabad.org/library/article_cdo/aid/4062523/jewish/Chapter-3.htm" },
      { t: "העגלון מבשנקוביץ", d: "באגרת משנת תרצ\"ו מביא אדמו\"ר הריי\"צ רשימה ששמע מאביו, אדמו\"ר הרש\"ב, על החסיד ר' יוסף מבשנקוביץ. בשנת תקס\"ד אמר לו אדמו\"ר הזקן ביחידות: 'לטובת נשמתך טוב יותר להיות בעל עגלה מלהיות רב'. כעבור כעשר שנים הציעו לו רבנות, והוא נזכר בדברים. אחרי מאבק פנימי קשה נעשה לעגלון, כשהוא כבן שבעים, אחרי עשרות שנים של לימוד תורה. בשנת תקע\"ו לן באחד ממסעותיו במלון בדרך לעיר סעננא. באותו מלון התאכסן גם יהודי בשם שלמה לייב, שעזב את דרך אבותיו, חי עם אשה נכרית ושימש בחצר אציל. האורח זלזל בתפילה, אך בלילה שמע את ר' יוסף אומר תיקון חצות בבכי, ובבוקר את תפילתו הארוכה בהתלהבות, ונזכר בבית אביו. הוא נשבע לשוב בתשובה גמורה, ביקש טלית ותפילין והתפלל בבכי רב. מאוחר יותר הגיע לליובאוויטש, ואדמו\"ר האמצעי סידר לו תיקון וציווה עליו לשוב לאשתו ולילדיו. כשנכנס ר' יוסף ליחידות, אמר לו אדמו\"ר האמצעי: 'אבי היה אצלי ואמר שיוסף בשנקוביצער הוציא לפועל את הכוונה'. אדמו\"ר הריי\"צ כותב שאין בידו מסורת ברורה בדבר, אך 'יש מקום לחשוב' שעבור בעל תשובה זה כתב אדמו\"ר האמצעי את הקונטרס 'פוקח עורים', העוסק בתיקוני תשובה, ובפרט על שכרות, ולכן כתבו באידיש, השפה המדוברת.", s: "אגרות קודש אדמו\"ר הריי\"צ, חלק ג, אגרת תתכה (כ\"ו טבת תרצ\"ו), עמ' תעז ואילך", u: "https://chabadpedia.co.il/wiki/%D7%A4%D7%95%D7%A7%D7%97_%D7%A2%D7%95%D7%A8%D7%99%D7%9D" },
      { t: "לחם וקוואס", d: "אדמו\"ר הרש\"ב סיפר בשיחה על סבו, הצמח צדק: במגירתו היה מונח לחם, ובמקום כלשהו בחדר עמד גם 'קוואס'. לפני שקיבל אנשים ליחידות היה אוכל מזה, כדי שיהיה לו כוח לענות ליהודי או לעשות דבר מסוים. ובאכילה זו, אמר הרש\"ב, היה הצמח צדק שומע ורואה בלחם ובקוואס אלוקות, 'בבחינת עצמותו יתברך', יותר מבשעת תפילתו – 'והרי גודל ערך תפילתו ידוע'. 'הייתי מאחל זאת לעצמי ברגע זה', הוסיף. לקח: אכילה מן ההיתר, כשהיא בשביל עבודת ה', אינה רק מותרת – היא נעשית כלי לאלוקות.", s: "תורת שלום (ספר השיחות אדמו\"ר הרש\"ב), שיחת שמחת תורה תרס\"א, בתרגום ללשון הקודש בגליון 'מעיינותיך' (באתר תורת חב\"ד)", u: "https://toratchabad.com/%D7%91%D7%93%D7%A8%D7%9B%D7%99-%D7%94%D7%A2%D7%91%D7%95%D7%93%D7%94-%D7%94%D7%A4%D7%A0%D7%99%D7%9E%D7%99%D7%AA" },
      { t: "בגשמיות וברוחניות", d: "פעם ישבו אדמו\"ר הזקן וחבריו, תלמידי המגיד ממזריטש, בהתוועדות. אדמו\"ר הזקן אמר 'לחיים' ואיחל: 'יהי רצון שה' יעזור לנו בגשמיות וברוחניות'. שאלו אותו: מדוע אתה מקדים גשמיות לרוחניות? ענה: גם יעקב אבינו הקדים – 'ונתן לי לחם לאכול ובגד ללבוש', ורק אחר כך 'והיה ה' לי לאלוקים'. טענו חבריו: הגשמיות של יעקב אבינו היא מסוג אחר לגמרי! השיב להם: הלא גם הרוחניות שלו מסוג אחר; ואף אצלו הרוחניות גבוהה מהגשמיות, ובכל זאת הקדים את הגשמיות. לקח: הצרכים הגשמיים של יהודי אינם סתירה לעבודת ה' – הם הבסיס שעליו היא נבנית.", s: "שמועות וסיפורים, חלק א, עמ' 43", u: "https://toratchabad.com/%D7%A1%D7%99%D7%A4%D7%95%D7%A8%D7%99%D7%9D-%D7%A2%D7%9C-%D7%90%D7%93%D7%9E%D7%95%D7%A8-%D7%94%D7%96%D7%A7%D7%9F" },
      { t: "עשרים דקות זה הרבה", d: "בהתוועדות שמחת תורה תרפ\"ט העיר מישהו לאדמו\"ר הריי\"צ שהשעה מאוחרת לתפילת מנחה, ונותרו רק כעשרים דקות. ענה הרבי: 'עשרים דקות זה הרבה. אפשר לעשות תשובה עד שהזדונות נעשים כזכויות. זדונות – אותם איננו רוצים, אבל את הזכויות אנו רוצים. ובעשרים דקות אפשר לעשות תשובה'. לקח: בסוף פרק ז מבאר התניא שתשובה מאהבה הופכת את הזדונות לזכויות ומעלה אותם לקדושה – ולתשובה כזו די ברגעים ספורים.", s: "ספר השיחות תרפ\"ט, יום שמחת תורה, סעיף יא (ספר השיחות תרפ\"ח–תרצ\"א, עמ' 43)", u: "https://pnimi.org/page/4301600217" }
    ]
  },
  8: {
    title: "פרק ח'",
    summary: "מאכלות אסורות נאחזים בשלוש הקליפות הטמאות לגמרי – אינם עולים לקדושה ומטמטמים את הלב. גם דברים בטלים ושיחה בטלה, ובמיוחד ביטול זמן מתורה, חמורים מאוד, כי מבזבזים את כוחות הנפש האלוקית. וחכמת אומות העולם מלבישה את חב\"ד שבנפש בקליפת נוגה – אלא אם לומדים אותה לפרנסה או כדי להשתמש בה בעבודת ה' ובתורה.",
    stories: [
      { t: "הזמן של השיחות הבטלות", d: "ר' אבא גינזבורג, סוחר גדול ועשיר ממינסק, התאונן ביחידות לפני אדמו\"ר המהר\"ש שאין לו זמן ליטול ספר ביד, וטוב לו אם מספיק להתפלל בציבור. אמר לו הרבי: 'אבא, הרי אתה בר דעת, אמור בעצמך: כך מודים לה' על שנתן לך את הנסיון של דאגות העשירות במקום הנסיון של דאגת העניות?' ר' אבא יצא שבור. כעבור כמה ימים החליט לעזוב את עסקיו, לקחת מלמד ולשבת באוהלה של תורה, ולהוריש מחצית מהונו לצדקה. הרבי אמר שטוב שייקח מלמד וילמד בכל יום, ושהצדקה תהיה חלק מן התיקון, אף שצריך גם תשובה. אך את הצדקה עליו לתת עוד בחייו, ואת העסקים לא לעזוב. כשטען ר' אבא שלא יהיה לו זמן, ענה הרבי: 'יהיה לך זמן – את הזמן של דברים בטלים, שמדברים בו על דברים שאינם שייכים לעצם העסק, את הזמן הזה תן לתפילה וללימוד'. ר' אבא חזר הביתה, ערך חשבון של רכושו, לקח מלמד ונזהר מדברים בטלים במסחר. ובאמת נעשו לו כמה שעות פנויות בכל יום ללימוד. כעבור כמה חודשים בא לליובאוויטש עם החשבון, וחילק את חלק הצדקה לדברים שונים.", s: "אגרות קודש אדמו\"ר הריי\"צ, חלק ח, אגרת ב'קנו (י\"ג תשרי תש\"ד), עמ' ה–ז", u: "https://www.chabad.org/parshah/article_cdo/aid/3324946/jewish/Finding-Time.htm" },
      { t: "שעון או ספרים", d: "אדמו\"ר הריי\"צ רשם בילדותו (תרנ\"א) שאביו, אדמו\"ר הרש\"ב, היה נותן לו כסף על כל פרק משניות שלמד בעל פה. הוא חסך את הכסף והלווה אותו לגמילות חסדים. הוא השתוקק לקנות ספרים בכריכה טובה ושעון עם שרשרת מוזהבת, ושקל מה לקנות קודם: את הספרים, שבינתיים אפשר לשאול, או את השעון, שאי אפשר להשיג בהשאלה. 'כף מאזני שכלי הכריע כי שעון נחוץ יותר, ותועלתו מרובה בשמירת הזמן' – כתב. הוא צייר לעצמו שבעזרת השעון לא רק כל שעה תהיה מיוחדת לעניני קדושה, אלא אפילו הדקות יהיו שמורות.", s: "רשימת אדמו\"ר הריי\"צ משנת תרנ\"א, נדפסה בספר המאמרים תרנ\"א, הוספות, עמ' רנו–רנז (באנגלית: Likkutei Dibburim, vol. 4, ch. 37, §14)", u: "https://chabadpedia.co.il/wiki/%D7%A9%D7%9E%D7%99%D7%A8%D7%AA_%D7%94%D7%96%D7%9E%D7%9F" },
      { t: "החלב של הנכרי", d: "חסיד אחד בא לאדמו\"ר הזקן וסיפר שחתנו נתקף בספקות באמונה. אדמו\"ר הזקן אמר שהחתן שתה, בלי לדעת, חלב שחלב נכרי בלי השגחת יהודי – איסור דרבנן – והורה לו דרך תיקון. לקח: מאכל אסור מטמטם את הלב ומשאיר בו רושם, גם כשנאכל בשוגג וגם כשהאיסור מדרבנן; זו חומרת מאכלות אסורות שבפרק ח.", s: "ספר המאמרים אידיש, עמ' 57; ספר המאמרים ת\"ש, עמ' 82 (כמובא בשיעורים בספר התניא, פרק ח)", u: "https://www.chabad.org/library/tanya/tanya_cdo/aid/1058362/jewish/Tanya-Chapter-8-II.htm" },
      { t: "עשרים ושניים מאסרים", d: "באסיפת הרבנים בפטרבורג בשנת תר\"ג (1843) נעצר הצמח צדק עשרים ושתיים פעמים, משום שעמד בתוקף נגד דרישת השלטון לשנות את החינוך היהודי. השר טען שזהו מרד במלכות. ענה לו הצמח צדק: 'מורד במלכות חייב מיתה בגוף, אבל מורד במלכות שמים חייב מיתה בנפש. מה מהם גדול יותר?'. לקח: התניא מלמד שחכמות זרות מלבישות את כוחות השכל בקליפה; כשהן נכנסות לחינוך, הסכנה היא לנפש עצמה.", s: "היום יום, כ\"ג מרחשון; ספר השיחות תש\"א, עמ' 57", u: "https://www.chabad.org/therebbe/article_cdo/aid/3318030/jewish/23-Cheshvan.htm" }
    ]
  },
  9: {
    title: "פרק ט'",
    summary: "מקום משכן הנפש הבהמית בחלל השמאלי שבלב, והנפש האלוקית שוכנת במוח ומתפשטת לחלל הימני. הגוף הוא 'עיר קטנה' ששתי הנפשות נלחמות עליה – כל אחת רוצה למשול בה לבדה. רצון הנפש האלוקית שכל מחשבה, דיבור ומעשה יהיו שלה ולה' בלבד. והיצר הרע נלחם רק כדי שהאדם יתגבר עליו – כמשל הזוהר על המלך שבחן את בנו.",
    stories: [
      { t: "והאר עינינו", d: "ר' שלמה מונסון, חסיד של אדמו\"ר האמצעי בשקלוב, נולד למשפחה עשירה וגדל בין חסידי אדמו\"ר הזקן. הוא שמר על מנהגי החסידים, אבל חסר לו חום חסידי. שמונה שנים נסע לליובאוויטש ליחידות ולא ראה שינוי ממשי בעצמו. בהתוועדות של חסידי שקלוב פרץ ר' מיכל המלמד הצולע בבכי, הכה על חזהו והתפלל – לא על אחרים, אלא על עצמו: 'ריבונו של עולם, רחם עליי ועזור לי, שאוכל לומר \"והאר עינינו בתורתך\" באותה התלהבות שבה שלמה מונסון אומר \"והעושר והכבוד מלפניך\"'. הדברים חדרו ללבו של ר' שלמה. זמן קצר אחר כך נסע לליובאוויטש, נכנס ליחידות אצל אדמו\"ר האמצעי וחזר אדם אחר. לקח: אותו להט שבלב יכול לבעור לעושר או לאלוקות; המלחמה על 'העיר הקטנה' היא על כך למי ילך הלב.", s: "שיחת אדמו\"ר הרש\"ב לתלמידי תומכי תמימים, שמחת תורה תרס\"א ('כל היוצא למלחמת בית דוד'), בלקוטי דיבורים לאדמו\"ר הריי\"צ – בתרגום האנגלי, פרק 56", u: "https://www.chabad.org/library/article_cdo/aid/6279493/jewish/Chapter-56.htm" },
      { t: "המנורה והאבן", d: "אדמו\"ר הזקן אמר ביחידות לר' זאב דב, למדן מופלג שלמד אצל גדולי מינסק וסלוצק: 'בני ישראל נקראים נרות. נר כולל כלי, פתילה, שמן ואש – אבל צריך להדליק את האש, ורק אז הוא מאיר. יש לך נר טוב, אבל חסר לך המדליק. על ידי הכאה בכוח באבן של הנפש הבהמית יוצא ניצוץ אש, והוא מדליק את האש האלוקית'. לקח: המאבק עם הנפש הבהמית, ולא בריחה ממנו, הוא שמצית את אור הנפש האלוקית.", s: "היום יום, י' סיון; אגרות קודש אדמו\"ר הריי\"צ, אגרת 937, חלק ד, עמ' 121", u: "https://www.chabad.org/therebbe/article_cdo/aid/3316536/jewish/10-Sivan.htm" },
      { t: "קצוץ לי את הצד השמאלי", d: "אדמו\"ר הרש\"ב סיפר (כפי שמסר בנו, אדמו\"ר הריי\"צ) על ר' יקותיאל ליעפלער, שהיה איש פשוט, אבל מסר את עצמו לאדמו\"ר הזקן בכל עצמותו. פעם טיפס אל חדרו של הרבי בקומה העליונה בצעקה: 'רבי, קצוץ לי את הצד השמאלי!'. אחר כך נכנס ליחידות ודיבר מה שדיבר, ואדמו\"ר הזקן השיב: 'ריבונו של עולם, \"ואתה מחיה את כולם\" כתיב'. מאז התחיל ר' יקותיאל לחיות חיים רוחניים ממש, וראה גילוי אור במוחש. אדמו\"ר הרש\"ב הוסיף: זה היה בדרך מתנה מן הרבי; אבל צריך להגיע לאור בכוח עצמו, בעבודה מסודרת, משלב לשלב. לקח: הצד השמאלי שבלב הוא משכן הנפש הבהמית, ור' יקותיאל רצה שיהיה כולו לקדושה – וזו כוונת פרק ט, שהנפש האלוקית תמשול בעיר הקטנה לבדה.", s: "ספר השיחות תרצ\"א, שבת פרשת חוקת-בלק, י\"ב תמוז (ספר השיחות תרפ\"ח–תרצ\"א, עמ' 251)", u: "https://pnimi.org/page/4301600451" },
      { t: "לא שנים של איכר", d: "כשרצה אדמו\"ר הזקן לברך את ר' יקותיאל ליעפלער בעשירות, אמר שאינו רוצה בזה, שלא תטריד אותו העשירות מלימוד החסידות ומן העבודה. וכשרצה לברכו באריכות ימים, אמר: 'אבל לא בשנים של איכר – \"עיניים להם ולא יראו, אוזניים להם ולא ישמעו\" – שאין רואים אלוקות ואין שומעים אלוקות'. לקח: רצון הנפש האלוקית, כמבואר בפרק ט, הוא שכל החיים – לא רק מספר השנים – יהיו של אלוקות.", s: "היום יום, ו' מרחשון; אגרות קודש אדמו\"ר הריי\"צ, אגרת 1794, חלק ו, עמ' 334", u: "https://www.chabad.org/therebbe/article_cdo/aid/3317965/jewish/6-Cheshvan.htm" }
    ]
  },
  10: {
    title: "פרק י'",
    summary: "כשאדם מגביר את הנפש האלוקית ונלחם בבהמית עד שמגרש ומבער את הרע מחלל השמאלי – הוא נקרא צדיק. צדיק גמור הפך את הרע שבו לטוב לגמרי, ואוהב את ה' באהבה בתענוגים. צדיק שאינו גמור – 'צדיק ורע לו' – נשאר בו רע מועט, בטל ברוב הטוב. מדרגות הצדיקים רבות, ו'בני עלייה' הם מועטים.",
    stories: [
      { t: "למה ה' לא נראה אליי?", d: "כשהיה אדמו\"ר הרש\"ב ילד בן ארבע או חמש, נכנס בשבת פרשת וירא אל סבו, הצמח צדק, והתחיל לבכות: 'מפני מה נראה ה' אל אברהם אבינו, ואלינו אינו נראה?' ענה לו הצמח צדק: 'כשיהודי צדיק, בן תשעים ותשע, מחליט שעליו למול את עצמו – הוא ראוי שהקב\"ה יתגלה אליו'. לקח: געגועים לאלוקות אינם מספיקים; הגילוי בא אחרי עבודה ומסירות של הצדיק.", s: "היום יום, ט' מרחשון", u: "https://www.chabad.org/therebbe/article_cdo/aid/3317978/jewish/9-Cheshvan.htm" },
      { t: "הבכי שפרץ מאליו", d: "אדמו\"ר הרש\"ב אמר בשיחה: כל יהודי בוכה בערב יום הכיפורים במנחה, אבל זקוק לשם כך להכנה – נזכר שהוא יהודי ושעכשיו ערב יום הכיפורים, ואז פורץ בבכי. 'אבל במו עיניי ראיתי אחד שהבכי התפרץ אצלו מאליו, בלי כוונה – היה זה אבי'. אדמו\"ר המהר\"ש לא היה 'איש של בכי', ובכל זאת, באמצע שיחה על דברים שאין להם קשר לבכי, ואף כשחייך, היה מתפרץ ממנו בכי מתוך תוך פנימיות נקודת הלב, בלי שום הכנה – 'משום שהיה בדוגמא שלמעלה, וכיוון שלמעלה היה אז זמן בכייה, התפרץ אצלו הבכי'. לקח: אצל צדיק, רגשות הלב עצמם מכוונים לפי מה שלמעלה.", s: "תורת שלום (ספר השיחות אדמו\"ר הרש\"ב), שיחת שמחת תורה תרס\"א, בתרגום ללשון הקודש בגליון 'מעיינותיך' (באתר תורת חב\"ד)", u: "https://toratchabad.com/%D7%91%D7%93%D7%A8%D7%9B%D7%99-%D7%94%D7%A2%D7%91%D7%95%D7%93%D7%94-%D7%94%D7%A4%D7%A0%D7%99%D7%9E%D7%99%D7%AA" },
      { t: "המקטרת", d: "פעם, כשאדמו\"ר האמצעי היה צעיר, עבר אביו, אדמו\"ר הזקן, ליד ביתו בדרכו למקווה, וראה אותו עומד ליד החלון, מקטרת בפיו, שקוע במחשבה. אדמו\"ר הזקן הושיט יד, הוציא את המקטרת מפיו והמשיך בדרכו. כשחזר מן המקווה, עמד בנו באותה תנוחה, ולא הרגיש כלל שהמקטרת איננה. לקח: כשהנפש כולה נתונה בהתבוננות אלוקית, הגוף והחושים אינם מושכים לשום צד.", s: "לקוטי סיפורים, עמ' 87 (כמובא במגזין Derher, כסלו תשפ\"ד, הערה 29)", u: "https://derher.org/wp-content/uploads/Kislev-5784-3.pdf" },
      { t: "והוא רחום", d: "אדמו\"ר האמצעי היה צריך לעתים קרובות שיזכירו לו לאכול ולישון. אבל אביו, אדמו\"ר הזקן, ציין שמעולם לא היה צריך להזכיר לו לומר את 'והוא רחום' הארוך בימי שני וחמישי, או 'יעלה ויבוא' בראש חודש, כי 'כשהוא מתפלל, הוא רואה את הדברים כפי שהם למעלה'. לקח: אצל צדיק, אפילו פרטי התפילה נובעים מראיית האלוקות, ולא מהרגל.", s: "רשימת היומן, עמ' 315 (כמובא במגזין Derher, כסלו תשפ\"ד, הערה 30)", u: "https://derher.org/wp-content/uploads/Kislev-5784-3.pdf" },
      { t: "כעמוד של ברזל", d: "החסיד ר' יעקב מקאדאן תיאר: 'בראש השנה אחד התפלל אדמו\"ר האמצעי שמונה עשרה שלוש שעות, ולא ראיתי אף תנועה אחת. הוא עמד כעמוד של ברזל נעוץ באדמה... כשיצא מבית הכנסת, קשה היה להביט בפניו הקדושות, שבערו בקדושה'. החסידים ראו את המשמש מחזיק את בגדו הרטוב של הרבי, ואמרו לו שלא יאחזנו בידיו, כי ודאי יסחט ממנו מים – איסור ביום טוב. אחרי מוסף החליף הרבי שוב את כותנתו, שהייתה שוב ספוגה, אף שבמשך כל התפילה עמד ללא תנועה. לקח: אצל צדיק, אש האהבה פנימית כל כך, שאינה זקוקה לביטוי חיצוני.", s: "עדות ר' יעקב מקאדאן, כמובא במגזין Derher, כסלו תשפ\"ד (ללא הפניה למקור ראשוני)", u: "https://derher.org/wp-content/uploads/Kislev-5784-3.pdf" },
      { t: "השטנדר", d: "כשהיה אדמו\"ר המהר\"ש ילד, שאל את אחיו הגדול, המהרי\"ל: 'למה קוראים לך \"השטנדר\"?'. ענה המהרי\"ל: 'כי סבנו, אדמו\"ר האמצעי, היה נשען עליי כשאמר חסידות בשדות'. 'כמה זמן?' – 'שעה או שעתיים'. המהר\"ש לא האמין: בשביל שעה או שעתיים לא היו קוראים לך שטנדר. 'לפעמים שלוש או ארבע שעות'. גם זה לא הספיק לו. לבסוף הודה המהרי\"ל: 'פעם אחת נשען עליי שמונה עשרה שעות'. לקח: כשהנפש האלוקית מושלת לבדה, הגוף אינו מעכב – לא הזמן ולא העייפות.", s: "לקוטי סיפורים, עמ' 137 (כמובא במגזין Derher, כסלו תשפ\"ד, הערה 10)", u: "https://derher.org/wp-content/uploads/Kislev-5784-3.pdf" },
      { t: "רק אותך", d: "אדמו\"ר הצמח צדק כותב שכך היה נשמע מסבו, אדמו\"ר הזקן, בשעת דבקותו: 'איך וויל זע גאר ניסט, איך וויל ניט דיין גן עדן, איך וויל ניט דיין עולם הבא... איך וויל מער ניט אז דיך אליין' – איני רוצה מאומה, איני רוצה את הגן עדן שלך, איני רוצה את העולם הבא שלך; איני רוצה אלא אותך בלבד. לקח: זו מדרגת אהבת הצדיק שבפרק י – אהבה שאינה מבקשת שום שכר, אפילו רוחני, אלא את ה' עצמו.", s: "דרך מצותיך, שרש מצות התפילה, פרק מ (קלח, א); הובא בהיום יום, י\"ח כסלו", u: "https://www.chabad.org/therebbe/article_cdo/aid/2987908/jewish/page.htm" }
    ]
  },
  11: {
    title: "פרק י\"א",
    summary: "יש מדרגות שונות ב'רשע וטוב לו', שהטוב שבנפשו האלוקית כפוף לרע. יש מי שחוטא לעתים רחוקות ומיד מתחרט, כי הטוב שבו עדיין מתעורר; ויש מי שחטאיו רבים יותר, ועדיין מתעוררים בו לפעמים הרהורי תשובה – עד 'רשע ורע לו', שאין בו חרטה כלל.",
    stories: [
      { t: "מה עשיתי – ומה עושים עכשיו", d: "ר' מענדל פוטרפאס סיפר: כשהסתתר מפני הקומוניסטים, התגורר בבית של אלמנה עם ילד קטן. ערב אחד הכניסה את בנה לאמבטיה, בלי לשים לב שהמים חמים מדי. הילד נכווה קשות ומת כעבור כמה ימים. האישה לא מצאה מנוח, ובכתה שוב ושוב: 'מה עשיתי? מה עשיתי?'. אחרי זמן רב נרגעה מעט, והחלה ללחוש: 'מה אני עושה עכשיו? מה אני עושה עכשיו?'. ר' מענדל אמר: בכל פעם שאני מרגיש צורך לשוב לדרך הנכונה, אני אומר בצער: 'מה עשיתי? מה עשיתי?'. ואחרי שאני נרגע מעט, אני חושב: 'מה אני עושה עכשיו?'. לקח: החרטה שמתעוררת בנפש היא ניצוץ הטוב שעדיין חי; אבל עליה להוביל למעשה – 'מה עושים עכשיו'.", s: "סיפורי ר' מענדל פוטרפאס בגוף ראשון, מתוך הספר My Gulag Life (Hasidic Archives), כפי שפורסמו בירחון COLlive, תשרי תשפ\"ג", u: "https://collive.com/6-tishrei-stories-told-by-the-mashpia-reb-mendel-futerfas/" }
    ]
  },
  12: {
    title: "פרק י\"ב",
    summary: "הבינוני הוא מי שהרע שבו לעולם אינו גובר לעשות מעשה, לדבר או לחשוב בניגוד לרצון ה'. בשעת התפילה הרע כפוף ובטל, ואחר כך 'המוח שליט על הלב בתולדתו'. עולות בו תאוות ומחשבות זרות, אבל הוא דוחה אותן מיד; וכעס או שנאה אינו מניח שיבואו לידי מעשה או דיבור – אדרבה, הוא מתנהג בחסד.",
    stories: [
      { t: "והכל מאמינים", d: "ר' מענדל פוטרפאס סיפר: ביום כיפור אחד, בבית הסוהר, כשאמרתי את התפילה 'וכל מאמינים', נכנסה לראשי מחשבה מכאיבה: האם באמת כולם מאמינים? האם האיש הגס והבורגני שישן על הדרגש הסמוך באמת מאמין? מיד דחיתי את המחשבות האלה ואמרתי לעצמי: איך אתה יכול לחשוב מחשבות שנוגדות את המילים הכתובות בסידור? אם הן נכתבו, ודאי הן אמת. כעבור שבוע ניגש אליי חברי לתא ושאל: 'נכון שאתה יהודי?'. ובלי לחכות לתשובה אמר: 'גם אני יהודי, וגם אני התפללתי ביום כיפור'. לקח: הבינוני אינו נמנע מכך שתעלה בו מחשבה זרה – אבל הוא דוחה אותה מיד, ואינו ממשיך לחשוב בה.", s: "סיפורי ר' מענדל פוטרפאס בגוף ראשון, מתוך הספר My Gulag Life (Hasidic Archives), כפי שפורסמו בירחון COLlive, תשרי תשפ\"ג", u: "https://collive.com/6-tishrei-stories-told-by-the-mashpia-reb-mendel-futerfas/" },
      { t: "ר' איטשע דער מתמיד", d: "זקני החסידים זוכרים חסיד של אדמו\"ר הרש\"ב ואדמו\"ר הריי\"צ, ר' יצחק הורוביץ, שכינוהו 'ר' איטשע דער מתמיד', ושנודע כמי שהוא 'בינוני' כהגדרת התניא. כל אחת משלוש תפילותיו לוותה בהתבוננות שנבעה מן החסידות שלמד באריכות לפני התפילה. לפעמים בקושי הספיק את שלוש התפילות ביום אחד, וארוחת הבוקר הדלה שלו חיכתה לא אחת עד אחרי מעריב. לקח: הבינוני כפי שמתאר פרק י\"ב הוא אדם אמיתי; וכוחו של המוח לשלוט בלב בא מן ההתבוננות בשעת התפילה.", s: "היום יום, א' כסלו – בביאור שבמהדורת chabad.org (מפי זקני החסידים; ללא מקור כתוב)", u: "https://www.chabad.org/therebbe/article_cdo/aid/3318094/jewish/1-Kislev.htm" }
    ]
  },
  13: {
    title: "פרק י\"ג",
    summary: "'בינונים – זה וזה שופטן'. אצל הבינוני הרע שבחלל השמאלי לא נעקר, רק אינו בא לידי מעשה; לכן אומרים לאדם 'היה בעיניך כרשע' – שלא יחשוב את עצמו לצדיק. ואף על פי שאהבת ה' שמרגיש בתפילה עוברת אחריה, אין היא שקר – היא אמת לפי מדרגתו.",
    stories: [
      { t: "ברח החסיד – בא החסיד", d: "היו זמנים שר' יקותיאל ליעפלער, חסיד של אדמו\"ר הזקן, התפלל שחרית, מנחה ומעריב אחת אחרי השנייה, ולא היה זמן להפסיק ביניהן. אדמו\"ר הריי\"צ מספר באותו מכתב שר' יקותיאל היה מתאר את מצבי רוחו המשתנים במילים: 'ברח החסיד' ו'בא החסיד'. כשהיה במצב 'ברח החסיד', היה עצוב מאוד, ומתפלל מהר, כשהוא עוקב באצבעו אחרי המילים בסידור אחת אחת. וכשהיה במצב 'בא החסיד', היו פניו מאירות, והוא רקד והתפלל באש. בימים כאלה יכול היה להתפלל יום שלם. לקח: אצל הבינוני ההתעוררות באה והולכת; ובכל זאת, גם ה'חסיד שבא' בשעת התפילה הוא אמת לפי מדרגתו.", s: "היום יום, א' כסלו; אגרות קודש אדמו\"ר הריי\"צ, אגרת 1115, חלק ד, עמ' תקמב", u: "https://www.chabad.org/therebbe/article_cdo/aid/3318094/jewish/1-Kislev.htm" },
      { t: "למה הרבי לא קיבל אותי", d: "ר' מענדל פוטרפאס סיפר: כשהגעתי לראשונה לניו יורק אל הרבי, ביקשתי יחידות, והרבי סירב בלי לתת סיבה. רק אחרי שבוע נודע לי שאחותי, גולדה שם טוב, נפטרה בלונדון כמה שבועות קודם לכן. בני המשפחה לא רצו שאשב שבעה ולכן לא סיפרו לי. אילו קיבל אותי הרבי, הייתי מבקש ברכה לאחותי – והרבי לא רצה להיות זה שיבשר לי. ושאלתם מה חשבתי כשסירבו לקבל אותי? פשוט מאוד: ידעתי שאני פשוט כל כך, שהרבי אינו יכול להביט בי. הסקתי שאם לא אשוב לדרכי ה', הרבי לא יסכים לראות אותי. וכך, כל אותו שבוע, עסקתי בתשובה. לקח: 'היה בעיניך כרשע' – חסיד גדול שאינו מחזיק את עצמו לצדיק, וכל סימן מלמעלה מעורר בו חשבון נפש.", s: "סיפורי ר' מענדל פוטרפאס בגוף ראשון, מתוך הספר My Gulag Life (Hasidic Archives), כפי שפורסמו בירחון COLlive, תשרי תשפ\"ג", u: "https://collive.com/6-tishrei-stories-told-by-the-mashpia-reb-mendel-futerfas/" },
      { t: "לא צדיק ולא בינוני", d: "ר' חנוך הענדל סיפר על התוועדות ל\"ג בעומר תר\"ד בליובאוויטש: הגאון ר' יצחק אייזיק מהומיל הוכיח את ר' הלל מפאריטש על שהוא מרבה בהידורים וזהירות יתרה, ואמר שעיקר העבודה הוא דרך הממוצע. ר' הלל התנצל מאוד שאינו עושה זאת מתוך יוהרה, ומתוך בכי רב סיפר את תולדות חייו. כשחזר אדמו\"ר הזקן בשנת תקע\"א מנסיעתו לוואהלין, נתקבצו אליו אלפים, ובאחד מבתי המלון, בין כחמישים מניינים, שמע ר' הלל – שלא ראה את פני אדמו\"ר הזקן, רק שמע את קולו – מאמר על 'לעולם ירגיז אדם יצר טוב על יצר הרע'. מורו, ר' זלמן זעזמער, ביאר לו: האדם בטעותו חושב את עצמו לבעל מדרגה; אבל כשבודק את עצמו בכל פרטי דעותיו ומידותיו, הוא מכיר את חסרונותיו, ומי שהוא באמת 'אדם' יודע שאינו במדרגת צדיק, ולא במדרגת בינוני, אלא הלוואי שיהיה ירא חטא ויזכור תמיד את יום המיתה. שלוש שנים, סיפר ר' הלל, נקרו בו הדברים, ובמשך השנים האלה עבד על גופו ואבריו שיהיו 'טוב באמת' – ולא רק 'צודק'. לקח: 'היה בעיניך כרשע' של פרק יג – גם חסיד גדול כר' הלל אינו מחזיק את עצמו אפילו לבינוני.", s: "ספר השיחות תש\"ו–ה'שי\"ת, הוספות, רשימה (סיפורי ר' חנוך הענדל), עמ' 415–418", u: "https://pnimi.org/page/4301620654" }
    ]
  },
  14: {
    title: "פרק י\"ד",
    summary: "מדת הבינוני היא מדת כל אדם, ואחריה ראוי לכל אדם לרדוף – כי כל אחד יכול בכל עת להיות בינוני: לא לעשות רע במעשה, דיבור ומחשבה. אבל למאוס ברע לגמרי ולהפוך אותו לטוב – זו מדרגת הצדיק, שאינה בבחירתו של כל אחד. לכן אל יפול לבו כשאינו מגיע למדרגת צדיק, ובכל זאת עליו לעשות את שלו להרגיל את עצמו למאוס ברע.",
    stories: [
      { t: "מהרפש כבר יצאנו", d: "בשמחת תורה, בבית מדרשו של רבי מנחם מנדל מויטבסק, חיכו החסידים שעה ארוכה להקפות, והרבי לא יצא מחדרו. כשהפצירו בו, אמר שמן השמים גילו לו מאה פירושים בפסוק 'אתה הראת', וכיוון שעדיין לא הגיע לאותן מדרגות בעבודתו, אינו יכול לאמרו. אדמו\"ר הזקן, שהיה שם, יעץ לחסידים לומר לרבי שהואיל והם קיבלו אותו לרבי, עליו לומר את ההקפות; ואם יסרב – שיזמינו אותו לדין תורה, והוא, אדמו\"ר הזקן, יהיה הדיין. רבי מנחם מנדל הסכים לדין. אדמו\"ר הזקן פסק נגדו: ראשית, אי אפשר להגיע אל האופק – ככל שמתקדמים, רואים רחוק יותר. ושנית, סיפר משל: זוג גר למרגלות הר, ומי השופכין זרמו אל פתח ביתם. החליטו לבנות בית במעלה ההר, וטיפסו עד שכלו כוחותיהם. הבעל בכה: 'לעולם לא נגיע לפסגה'. ענתה לו אשתו: 'איננו צריכים להגיע לפסגה – די שיצאנו מן הרפש; נבנה כאן את ביתנו'. 'גם אנחנו', אמר אדמו\"ר הזקן, 'מן הרפש כבר יצאנו – בימים הנוראים נפרדנו מן החטאים'. רבי מנחם מנדל קיבל את הפסק ויצא לומר את פסוקי ההקפות. לקח: לא כל אחד יגיע לפסגה של מדרגת הצדיק; אבל לצאת מן הרפש – מדת הבינוני – אפשרי לכל אחד, וזה מספיק כדי לשמוח.", s: "רשימות דברים, חלק ד, עמ' קנט (וכן סיפורי חסידים – מועדים, סיפור 217)", u: "https://toratchabad.com/%D7%A1%D7%99%D7%A4%D7%95%D7%A8%D7%99%D7%9D-%D7%A2%D7%9C-%D7%90%D7%93%D7%9E%D7%95%D7%A8-%D7%94%D7%96%D7%A7%D7%9F" },
      { t: "לזמר את 'הבינוני'", d: "בחג הפסח תש\"ח ביקש אדמו\"ר הריי\"צ לנגן את הניגון הנקרא 'דער בינוני', והמסובים לא הצליחו להיזכר בתחילתו. אמר הרבי: 'כשלא לומדים חסידות, או כשלומדים עם ביאורים מהמצאה עצמית ואין עוסקים בעבודה של בירור ותיקון המידות – קשה, ובאמת בלתי אפשרי, להיות בינוני. אבל לזמר את \"הבינוני\" – זה לא צריך להיות קשה'. לקח: פרק יד מלמד שמדת הבינוני היא מדת כל אדם – אבל היא באה רק מתוך לימוד ועבודה, לא מעצמה.", s: "ספר השיחות תש\"ח, שיחות חג הפסח, סעיף ה (ספר השיחות תש\"ו–ה'שי\"ת, עמ' 201)", u: "https://pnimi.org/page/4301620404" }
    ]
  },
  15: {
    title: "פרק ט\"ו",
    summary: "'עובד אלוקים' הוא מי שנלחם עם יצרו ומשנה את טבעו, ו'אשר לא עבדו' הוא מי שאינו נלחם. גם מי שלומד הרבה, אם כך הורגל מטבעו, אינו נקרא 'עובד' עד שיוסיף על הרגלו – כמשל השונה פרקו מאה פעמים לעומת מאה ואחת.",
    stories: [
      { t: "לאבד את ה'מהרה'", d: "בימי נעוריו נהג אדמו\"ר הזקן ללמוד שעות ארוכות בבית המדרש של סבו. פעם הבחין בלומד שקורא בספר במהירות רבה; ניכר שהבין היטב, אבל החיפזון לא מצא חן בעיניו. 'מדוע אתה ממהר כל כך?' שאל. 'מהיר אני בטבעי', התנצל הלומד. 'אם כך, עליך לשנות את הטבע'. 'איני יכול לשנות את טבעי'. השיב לו: 'לכל יהודי יש נשמה, שנותנת לו כוח לשנות את טבעו בדרך של קבלת עול. תחילה תרכוש הרגל חדש, ועם הזמן ההרגל יהפוך לטבע שני'. והוסיף: כתוב 'ואבדתם מהרה מעל הארץ הטובה' – 'ארץ' מלשון רצון; כשה' נותן לאדם חשק בלימוד, עליו 'לאבד את המהרה' – ללמוד במתינות. לימים נעשה הלומד חסיד של אדמו\"ר הזקן. לקח: 'עובד אלוקים' הוא מי שאינו מסתפק בטבעו, אלא משנה אותו מתוך קבלת עול.", s: "ספר השיחות קיץ ת\"ש, עמ' 59", u: "https://toratchabad.com/%D7%A1%D7%99%D7%A4%D7%95%D7%A8%D7%99%D7%9D-%D7%A2%D7%9C-%D7%90%D7%93%D7%9E%D7%95%D7%A8-%D7%94%D7%96%D7%A7%D7%9F" },
      { t: "משכיל ועובד", d: "אדמו\"ר הריי\"צ סיפר בשם אביו: בחנוכה תרי\"ד שהו ר' אייזיק מהומיל ור' הלל מפאריטש כמה שבועות בליובאוויטש. הצמח צדק אמר אז מאמרים רבים, ובנו, אדמו\"ר המהר\"ש, הלך לפי הוראתו לשמוע את חזרתם של שני החסידים. פעם ציווה הצמח צדק על בנו לחזור לפניו את המאמרים כפי ששמעם מהם, ואמר: 'ר' אייזיק הוא משכיל, ור' הלל הוא עובד'. כעבור כמה ימים שאל המהר\"ש: הרי המשכיל הוא עובד, והעובד הוא משכיל? הצמח צדק לא ענה. כעבור שבוע אמר מאמר במיוחד לבניו ולשני החסידים, ובאמצע הלילה שלח את המהר\"ש לראות מבעד לחלון מה הם עושים. ר' אייזיק ישב מהורהר, ראשו שמוט, עיניו עצומות ופניו בוערות. ר' הלל ישב כפוף, אצבעו בפיו ופניו חיוורות מאוד, כאדם מודאג. אמר הצמח צדק: שניהם מהרהרים במאמר של אתמול; אלא שר' אייזיק מתבונן בעניין העליון שבמאמר, ור' הלל מתבונן בעניין הקבלת עול – וחושב על עצמו. לקח: 'עובד אלוקים' של פרק טו הוא מי שההשכלה מובילה אותו מיד לחשבון ולעבודה עם עצמו.", s: "ספר השיחות תש\"ח, שיחת י\"ב תמוז (קונטרס י\"ב תמוז תש\"ח, עמ' 24); כמובא בגיליון 'מעיינותיך' באתר תורת חב\"ד", u: "https://toratchabad.com/%D7%94%D7%AA%D7%97%D7%9C%D7%AA-%D7%A0%D7%A9%D7%99%D7%90%D7%95%D7%AA%D7%95-%D7%A9%D7%9C-%D7%94%D7%A6%D7%9E%D7%97-%D7%A6%D7%93%D7%A7" }
    ]
  },
  16: {
    title: "פרק ט\"ז",
    summary: "עיקר העבודה הוא שהשכל ישלוט על המידות. גם כשהאהבה וההתבוננות אינן מתגלות בהתפעלות הלב, די בכך שהן נמצאות במוח ובתבונה וברצון הלב ('רעותא דליבא'), ומביאות את האדם לעסוק בתורה ובמצוות; וזו היא 'דחילו ורחימו' שהן הכנפיים שמעלות את המצוות.",

    summary: "'כי קרוב אליך הדבר מאד, בפיך ובלבבך לעשותו': כל אדם יכול להרגיל את מוחו לשלוט על לבו ולהוליד מן ההתבוננות אהבה ויראה לפחות במוחו, ולעשות על פיהן. ומי שלבו אטום – יכול לעורר את האהבה הטבעית המסותרת שבלב כל ישראל.",

  19: {
    title: "פרק י\"ט",
    summary: "הנשמה היא 'נר ה'': כמו להבת הנר הנמשכת תמיד למעלה, כך הנפש חפצה בטבעה להיפרד מן הגוף ולהיכלל במקורה. אהבה זו כוללת גם יראה – שלא להיפרד מאחדות ה' אפילו בדיבור או במעשה של כפירה. אבל היא יכולה להיות 'בגלות' בנפש, כשה'רוח שטות' מכסה עליה.",
    stories: [
      { t: "שמע זה ישראל", d: "חסיד זקן סיפר לאדמו\"ר הריי\"צ על היחידות הראשונה שלו אצל אדמו\"ר המהר\"ש, כשהיה בן שלושים. המהר\"ש אמר לו שהמילה 'שמע' היא ראשי תיבות של 'שאו מרום עיניכם', והוסיף שלוש מילים: 'שמע זה ישראל'. את ההוראה הזאת נשא החסיד כל ימיו, עד שהגיע לגיל תשעים. וכך סיים את סיפורו: 'בקשה אחת יש לי עוד מן הקב\"ה: כשיגיע הזמן להחזיר לו את הנשמה שהפקיד בידי, ואומר \"שמע ישראל\" בפעם האחרונה – שיתן לי דעה צלולה, כדי שאוכל להיזכר אז בדברים שהרבי אמר לי: \"שמע זה ישראל\"'. לקח: האהבה הטבעית של פרק יט היא רצון הנשמה להיכלל באור ה' – והיא מתגלה במלוא כוחה ב'שמע ישראל', גם ברגע האחרון.", s: "לקוטי דיבורים (בתרגום האנגלי), חלק ג, עמ' 197–200; כמובא בביאור להיום יום, י\"ט מרחשון, באתר chabad.org", u: "https://www.chabad.org/therebbe/article_cdo/aid/3318010/jewish/19-Cheshvan.htm" }
    ]
  },

function renderChapters() {
  const el = document.getElementById('chapters');
  el.innerHTML = '';
  Object.keys(data).forEach(num => {
    const btn = document.createElement('button');
    btn.className = 'chap-btn';
    btn.dataset.num = num;
    btn.textContent = data[num].title;
    btn.onclick = () => showChapter(num);
    el.appendChild(btn);
  });
}

function renderSource(s) {
  if (!s.s) return '';
  const link = s.u ? ` – <a href="${s.u}" target="_blank" rel="noopener">לצפייה במקור</a>` : '';
  return `<div class="source"><strong>מקור:</strong> ${s.s}${link}</div>`;
}

function showChapter(num) {
  document.querySelectorAll('.chap-btn').forEach(b => b.classList.toggle('active', b.dataset.num === String(num)));
  const c = data[num];
  const content = document.getElementById('content');
  const stories = c.stories.length
    ? c.stories.map(s => `<div class="story"><h3>${s.t}</h3><p>${s.d}</p>${renderSource(s)}</div>`).join('')
    : '<div class="empty">סיפורים לפרק זה יתווספו בקרוב.</div>';
  content.innerHTML = `<div class="summary"><strong>תקציר:</strong> ${c.summary}</div>${stories}`;
}

renderChapters();
showChapter(1);
</script>
